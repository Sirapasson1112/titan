<style>
  :root {
    --ink: #1e3652;
    --ink-2: #274567;
    --ink-3: #33567d;
    --line-on-ink: rgba(255,255,255,0.08);
    --surface: #f4f5f7;
    --card: #ffffff;
    --card-line: #e1e6ec;
    --text: #1f2d3d;
    --text-soft: #5d6b7a;
    --text-faint: #8d99a6;
    --brand: #274567;
    --brand-ink: #1e3652;
    --brand-soft: #e3ecf5;
    --amber: #f59e0b;
    --amber-ink: #a05a0b;
    --amber-soft: #fef3c7;
    --green: #1f8a55;
    --green-ink: #17703f;
    --green-soft: #dcfce7;
    --red: #c0392b;
    --red-ink: #b3271a;
    --red-soft: #fbe9e7;
    --gray-soft: #eef1f4;
    --radius-card: 16px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(20,20,25,0.04), 0 8px 24px -14px rgba(20,20,25,0.14);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #0f1722;
      --card: #172230;
      --card-line: #263648;
      --text: #e8eef5;
      --text-soft: #aebbc9;
      --text-faint: #7488a0;
      --brand-soft: #1f3550;
      --amber-soft: #372c14;
      --green-soft: #1c2a1a;
      --red-soft: #33201b;
      --gray-soft: #1e2b3a;
      --brand-ink: #8fb4dc;
      --green-ink: #74e0a0;
      --red-ink: #ff9d9d;
      --amber-ink: #f7c66b;
    }
  }
  :root[data-theme="dark"] {
    --surface: #0f1722;
    --card: #172230;
    --card-line: #263648;
    --text: #e8eef5;
    --text-soft: #aebbc9;
    --text-faint: #7488a0;
    --brand-soft: #1f3550;
    --amber-soft: #372c14;
    --green-soft: #1c2a1a;
    --red-soft: #33201b;
    --gray-soft: #1e2b3a;
    --brand-ink: #8fb4dc;
    --green-ink: #74e0a0;
    --red-ink: #ff9d9d;
    --amber-ink: #f7c66b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font-family: "Noto Sans Thai", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: "Inter", "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }
  html { overflow-x: hidden; }
  .app { display: flex; min-height: 100%; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,15,17,0.5); z-index: 19; opacity: 0; transition: opacity .2s ease; }
  .sidebar-backdrop.show { display: block; opacity: 1; }
  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px;
    flex: 0 0 240px;
    background: var(--card);
    box-shadow: 1px 0 0 var(--card-line);
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    z-index: 20;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--card-line);
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand) 0%, #3c668e 100%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    box-shadow: 0 4px 14px -6px rgba(30,54,82,0.55);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-text { line-height: 1.2; }
  .brand-text .t1 { font-weight: 800; font-size: 14.5px; color: var(--text); letter-spacing: 0.2px; }
  .brand-text .t2 { font-size: 12px; color: var(--text-faint); font-weight: 500; }
  .nav { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13.5px; font-weight: 500; color: var(--text-soft);
    cursor: pointer; user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
    border: 1px solid transparent;
  }
  .nav-item svg { width: 17px; height: 17px; flex: none; opacity: 1; }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active {
    background: var(--brand-soft);
    color: var(--brand-ink);
    font-weight: 700;
    border-color: transparent;
  }
  .nav-item.active svg { opacity: 1; }
  .nav-foot { padding: 14px 20px 18px; border-top: 1px solid var(--card-line); }
  .nav-foot .nav-item { color: var(--text-soft); }
  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: var(--card);
    border-bottom: 1px solid var(--card-line);
    position: sticky; top: 0; z-index: 10;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--card-line);
    border-radius: 10px; padding: 8px 13px;
    color: var(--text-faint);
  }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input {
    border: none; background: transparent; outline: none;
    font: inherit; font-size: 13.5px; color: var(--text); width: 100%;
  }
  .search input::placeholder { color: var(--text-faint); }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    position: relative; width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--card-line);
    color: var(--text-soft); cursor: pointer; flex: none;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid var(--card); }
  .profile { display: flex; align-items: center; gap: 10px; padding-left: 10px; border-left: 1px solid var(--card-line); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#5b9bff,#3c668e);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px; flex: none;
  }
  .profile-text { line-height: 1.25; }
  .profile-text .name { font-size: 13px; font-weight: 700; color: var(--text); }
  .profile-text .role { font-size: 12px; color: var(--text-faint); }
  .content { padding: 24px 28px 56px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .page { display: none; animation: fade .35s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 21px; font-weight: 800; margin: 0 0 3px; letter-spacing: -0.2px; }
  .page-head p { margin: 0; color: var(--text-soft); font-size: 13.5px; }
  .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--card-line); background: var(--card); color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(47,111,237,0.45); }
  .btn:hover { background: var(--surface); }
  .btn.primary:hover { background: var(--brand); filter: brightness(0.9); }
  /* ---------- Grid / cards ---------- */
  .grid { display: grid; gap: 16px; }
  .grid > * { min-width: 0; } /* let wide tables scroll inside their card instead of stretching the page */
  .card {
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }
  /* KPI cards: one card per KPI (value + status + trend), each with its own accent colour */
  :root { --kpi-grid: #e3e3e0; --kpi-good: #15803d; --kpi-bad: #b91c1c; }
  .kpi-card.acc-blue { --acc: #3c668e; --acc-soft: #bccfe0; --acc-bg: #e6eef5; }
  .kpi-card.acc-orange { --acc: #ea580c; --acc-soft: #fbc9a8; --acc-bg: #fdeee4; }
  .kpi-card.acc-teal { --acc: #0d9488; --acc-soft: #a7ddd8; --acc-bg: #e0f3f1; }
  .kpi-card.acc-violet { --acc: #7c3aed; --acc-soft: #d4c1f9; --acc-bg: #efe8fd; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --kpi-grid: #34343a; --kpi-good: #4ade80; --kpi-bad: #f87171; }
    :root:not([data-theme="light"]) .kpi-card.acc-blue { --acc: #8fb4dc; --acc-soft: #2c4270; --acc-bg: #1f2a3d; }
    :root:not([data-theme="light"]) .kpi-card.acc-orange { --acc: #fb923c; --acc-soft: #5a3418; --acc-bg: #35251a; }
    :root:not([data-theme="light"]) .kpi-card.acc-teal { --acc: #2dd4bf; --acc-soft: #17433f; --acc-bg: #15302d; }
    :root:not([data-theme="light"]) .kpi-card.acc-violet { --acc: #a78bfa; --acc-soft: #3b2d63; --acc-bg: #2a2340; }
  }
  :root[data-theme="dark"] { --kpi-grid: #34343a; --kpi-good: #4ade80; --kpi-bad: #f87171; }
  :root[data-theme="dark"] .kpi-card.acc-blue { --acc: #8fb4dc; --acc-soft: #2c4270; --acc-bg: #1f2a3d; }
  :root[data-theme="dark"] .kpi-card.acc-orange { --acc: #fb923c; --acc-soft: #5a3418; --acc-bg: #35251a; }
  :root[data-theme="dark"] .kpi-card.acc-teal { --acc: #2dd4bf; --acc-soft: #17433f; --acc-bg: #15302d; }
  :root[data-theme="dark"] .kpi-card.acc-violet { --acc: #a78bfa; --acc-soft: #3b2d63; --acc-bg: #2a2340; }
  .kpi-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
  .kpi-section-head h2 { font-size: 15px; font-weight: 800; margin: 0; }
  .kpi-section-head h2 .per { color: var(--text-faint); font-weight: 700; }
  .kpi-section-head .hint { font-size: 12px; color: var(--text-faint); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 10px; }
  .kpi-grid > * { min-width: 0; }

  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .pg-btn:disabled { opacity: .4; cursor: not-allowed; }
  body.role-user .admin-only { display: none !important; }
  .role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; }
  .role-badge.admin { background: var(--brand-soft); color: var(--brand-ink); }
  .role-badge.user { background: var(--gray-soft); color: var(--text-soft); }
  .cell-link { color: var(--brand-ink); cursor: pointer; font-weight: 600; }
  .cell-link:hover { text-decoration: underline; }
  .cal-ev { cursor: pointer; }
  .link-inline { color: var(--brand-ink); cursor: pointer; font-weight: 600; text-decoration: none; }
  .link-inline:hover { text-decoration: underline; }
  /* User guide */
  .guide-toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .guide-toc a { padding: 7px 14px; border-radius: 9px; background: var(--surface); border: 1px solid var(--card-line); font-size: 12.5px; font-weight: 700; color: var(--text-soft); text-decoration: none; cursor: pointer; }
  .guide-toc a:hover { background: var(--brand-soft); color: var(--brand-ink); }
  .guide-section { scroll-margin-top: 90px; padding: 20px 22px; border-bottom: 1px solid var(--card-line); }
  .guide-section:last-child { border-bottom: none; }
  .guide-section h3 { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 800; margin: 0 0 4px; }
  .guide-section .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; flex: none; }
  .guide-section .ic svg { width: 16px; height: 16px; }
  .guide-section p { margin: 4px 0 0; font-size: 13px; color: var(--text-soft); line-height: 1.7; }
  .guide-list { margin: 10px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.8; color: var(--text-soft); }
  .guide-list li { margin-bottom: 4px; }
  .guide-list b { color: var(--text); }
  /* Field navigation map */
  .field-map-toolbar { display: flex; gap: 14px; padding: 16px 20px 0; flex-wrap: wrap; align-items: center; }
  /* Real Google Maps embed (the simulated SVG map stays available as a fallback view) */
  .gmap-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #e5e3df; }
  .field-map-sim { position: absolute; inset: 0; }
  .map-seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--card-line); border-radius: 10px; }
  .map-seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; white-space: nowrap; }
  .map-seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(16,26,46,0.12); }
  .gmap-bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 12px 20px 0; font-size: 12.8px; color: var(--text-soft); min-height: 30px; }
  .gmap-bar b { color: var(--text); }
  .gmap-bar .btn { padding: 6px 12px; font-size: 12px; }
  .gmap-hint { font-size: 12px; color: var(--text-faint); padding: 0 20px 14px; margin-top: -8px; }
  .field-stop-row.focused { border-color: var(--brand) !important; background: var(--brand-soft) !important; }
  .stop-pin-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--card-line); background: var(--card); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .stop-pin-btn svg { width: 15px; height: 15px; }
  .stop-pin-btn:hover { background: var(--brand-soft); }
  .legend-inline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-soft); font-weight: 600; }
  .legend-inline .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .field-map-canvas { position: relative; width: calc(100% - 40px); margin: 14px 20px 20px; aspect-ratio: 8 / 5; overflow: hidden; border-radius: 12px; background: #f4f5f2; border: 1px solid var(--card-line); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02); }
  .field-map-canvas-hero { aspect-ratio: 20 / 9; }
  .field-map-svg-wrap { width: 100%; height: 100%; transition: transform .2s ease; transform-origin: center center; }
  .field-map-svg-wrap svg { display: block; }
  .map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  .map-controls .pg-btn { background: #fff; color: #3c3c42; }
  .compass { position: absolute; bottom: 12px; left: 12px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.94); border: 1px solid var(--card-line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; color: var(--text-soft); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .map-scale { position: absolute; bottom: 12px; right: 12px; background: rgba(255,255,255,0.94); border: 1px solid var(--card-line); border-radius: 8px; padding: 5px 10px; font-size: 10.5px; font-weight: 700; color: var(--text-soft); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .field-stop-list { display: flex; flex-direction: column; }
  .field-stop-list-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; padding: 4px 20px 16px; }
  .field-stop-list-grid .field-stop-row { border: 1px solid var(--card-line); border-radius: 12px; margin: 8px; padding: 12px 14px; }
  .field-stop-list-grid .field-stop-row:hover { border-color: var(--brand); background: var(--surface); }
  .field-stop-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--card-line); cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .origin-pulse { transform-box: fill-box; transform-origin: center; animation: pulseRing 2.2s ease-out infinite; }
  @keyframes pulseRing { 0% { opacity: 0.35; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.8); } }
  .field-stop-row:hover { background: var(--surface); }
  .field-stop-row:last-child { border-bottom: none; }
  .field-stop-row .num { width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-ink); font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
  .field-stop-row .body { flex: 1; min-width: 0; }
  .field-stop-row .t { font-size: 12.8px; font-weight: 700; }
  .field-stop-row .d { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  /* v36 */
  .nav-group { font-size: 11px; font-weight: 700; letter-spacing: .4px; color: var(--text-faint); padding: 14px 12px 4px; text-transform: none; }
  .nav-group:first-child { padding-top: 4px; }
  .nav-step { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 800; width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--gray-soft); color: var(--text-soft); }
  .nav-item.active .nav-step { background: var(--card); color: var(--brand-ink); }
  .nav-item:focus-visible, .kpi-card:focus-visible, .flow-step:focus-visible, .chip:focus-visible, .insp-card:focus-visible, .sb-step:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .kpi-note { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .kpi-legend { display: inline-flex; align-items: center; gap: 6px; }
  .kpi-swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); flex: none; }
  .kpi-swatch.smp { background: var(--brand-soft); outline: 1.4px dashed var(--brand); outline-offset: -1.4px; }
  .cost-kpi .sub { font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.5; }
  .ar-kpis { grid-template-columns:repeat(5,1fr) !important; padding:0 20px 8px; }
  .ar-kpis .cost-kpi { box-shadow:none; border:1px solid var(--card-line); }
  @media (max-width:1100px){ .ar-kpis { grid-template-columns:repeat(3,1fr) !important; } }
  @media (max-width:640px){ .ar-kpis { grid-template-columns:repeat(2,1fr) !important; padding:0 14px 8px; } }
  /* v48: monthly report */
  #reportPrint { display:none; }
  .rp { background:#fff; color:#111; font-size:12px; line-height:1.55; }
  .rp h1 { font-size:18px; margin:0 0 2px; } .rp h2 { font-size:13.5px; margin:14px 0 6px; padding-bottom:3px; border-bottom:2px solid #3c668e; }
  .rp .sub { color:#555; font-size:11.5px; } .rp .meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 0 4px; font-size:11.5px; color:#333; }
  .rp table { width:100%; border-collapse:collapse; margin:4px 0; } .rp th, .rp td { border:1px solid #c8ccd2; padding:4px 7px; text-align:left; vertical-align:top; font-size:11.5px; } .rp th { background:#eef2f9; font-weight:700; }
  .rp td.n, .rp th.n { text-align:right; white-space:nowrap; }
  .rp .ok { color:#0a7a3d; font-weight:700; } .rp .miss { color:#c0262d; font-weight:700; } .rp .na { color:#777; }
  .rp .charts { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; } .rp .chart { border:1px solid #d8dce3; border-radius:6px; padding:6px 8px; break-inside:avoid; } .rp .chart b { font-size:11.5px; } .rp .chart svg { width:100%; height:auto; display:block; }
  .rp ul { margin:4px 0 4px 18px; padding:0; } .rp li { margin:2px 0; }
  .rp .note { font-size:10.5px; color:#555; margin-top:8px; }
  .rp .sign { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:26px; text-align:center; font-size:11.5px; break-inside:avoid; } .rp .sign div { border-top:1px solid #333; padding-top:5px; margin-top:34px; }
  .rp-prev { border:1px solid var(--card-line); border-radius:12px; padding:18px 20px; background:#fff; max-height:62vh; overflow:auto; }
  @media (max-width:640px){ .rp .charts { grid-template-columns:1fr; } .rp-prev { padding:12px; } }
  @media print {
    body.printing-report > *:not(#reportPrint) { display:none !important; }
    body.printing-report #reportPrint { display:block !important; }
    body.printing-report, body.printing-report .rp { background:#fff !important; }
    .rp th, .rp .chart svg, .rp h2 { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .rp h2 { break-after:avoid; page-break-after:avoid; }
    .rp table, .rp .chart { break-inside:avoid; }
  }
  .ci-box { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:10px 0; }
  .ci-box label { display:block; font-size:11.5px; font-weight:700; color:var(--text-soft); margin-bottom:4px; }
  .ci-box .select-sm, .ci-box input { width:100%; box-sizing:border-box; }
  .ci-chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .ci-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:9px; background:var(--gray-soft); font-size:12px; font-weight:700; color:var(--text); }
  .ci-chip i { width:8px; height:8px; border-radius:3px; display:inline-block; }
  .ci-warn { margin:8px 0; padding:8px 12px; border-radius:9px; font-size:12px; line-height:1.7; background:var(--gray-soft); color:var(--text-soft); }
  .ci-warn.bad { color:var(--red-ink); }
  .ci-scroll { max-height:210px; overflow:auto; border:1px solid var(--card-line); border-radius:10px; }
  .ci-scroll table { min-width:480px; }
  .cost-src-btns { display:inline-flex; gap:8px; flex-wrap:wrap; }
  .cost-src-btns .btn { padding:5px 11px; font-size:12px; }
  .sample-note { margin: -6px 0 14px; font-size: 12.5px; color: var(--text-soft); line-height: 1.7; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cost-pct { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .cal-more { white-space: nowrap; }
  @media (max-width: 860px) { .cal-more { font-size: 10px; } }
</style>

let IS_LOGGED_IN = (() => { try { return localStorage.getItem("loggedIn") === "1"; } catch(e){ return false; } })();

/* v30: username + password sign-in. Accounts live in this browser (no server): the password is
   stored as a salted hash, never as plain text. First run creates admin / admin, which must be changed. */
const pwHash = (user, pw) => { const str = "cmms|" + String(user).toLowerCase() + "|" + pw; let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7;
  for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
function loadUsers(){
  let u = null; try { u = JSON.parse(localStorage.getItem("users") || "null"); } catch(e){}
  if (!Array.isArray(u) || !u.length){
    u = [{ username:"admin", name:"ผู้ดูแลระบบ", title:"Maintenance Engineer", role:"admin", hash:pwHash("admin", "admin"), mustChange:true, createdAt:Date.now() }];
    saveUsers(u);
  }
  return u;
}
function saveUsers(u){ try { localStorage.setItem("users", JSON.stringify(u)); } catch(e){} }
const currentUsername = () => { try { return localStorage.getItem("currentUser") || ""; } catch(e){ return ""; } };
const currentUser = () => loadUsers().find(x => x.username === currentUsername()) || null;
const defaultAdminUnchanged = () => loadUsers().some(x => x.username === "admin" && x.mustChange && x.hash === pwHash("admin", "admin"));
function loginT(th, en){ return LANG === "en" ? en : th; }

let LOGIN_FAILS = 0, LOGIN_LOCK_UNTIL = 0;
window.submitLogin = function(){
  const err = msg => { const e = document.getElementById("lgErr"); if (e){ e.textContent = msg; e.classList.add("show"); }
    const f = document.getElementById("lgForm"); if (f){ f.classList.remove("lg-shake"); void f.offsetWidth; f.classList.add("lg-shake"); } };
  if (Date.now() < LOGIN_LOCK_UNTIL){ err(loginT(`ลองผิดหลายครั้ง กรุณารอ ${Math.ceil((LOGIN_LOCK_UNTIL - Date.now()) / 1000)} วินาที`, `Too many attempts, wait ${Math.ceil((LOGIN_LOCK_UNTIL - Date.now()) / 1000)} s`)); return; }
  const uEl = document.getElementById("login-username"), pEl = document.getElementById("login-password");
  const username = (uEl.value || "").trim().toLowerCase(), pw = pEl.value || "";
  if (!username){ err(loginT("กรุณากรอกชื่อผู้ใช้", "Please enter your username")); uEl.focus(); return; }
  if (!pw){ err(loginT("กรุณากรอกรหัสผ่าน", "Please enter your password")); pEl.focus(); return; }
  const user = loadUsers().find(x => x.username === username);
  const pwOk = user && user.hash === pwHash(username, pw);
  if (!pwOk || user.disabled){
    LOGIN_FAILS++; if (LOGIN_FAILS >= 5){ LOGIN_LOCK_UNTIL = Date.now() + 30000; LOGIN_FAILS = 0; }
    err(pwOk && user.disabled ? loginT("บัญชีนี้ถูกปิดใช้งาน ติดต่อผู้ดูแลระบบ", "This account is disabled") : loginT("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", "Wrong username or password"));
    pEl.value = ""; pEl.focus(); return;
  }
  LOGIN_FAILS = 0;
  signInAs(user);
  if (user.mustChange) setTimeout(() => openChangePwModal(true), 200);
};
function signInAs(user){
  PROFILE_NAME = user.name || user.username;
  PROFILE_TITLE = user.title || "";
  IS_LOGGED_IN = true;
  USER_ROLE = user.role === "admin" ? "admin" : "user";
  try {
    ["profileName", "profileTitle", "loggedIn", "userRole", "currentUser", "lastUser"].forEach((k, i) => localStorage.setItem(k, [PROFILE_NAME, PROFILE_TITLE, "1", USER_ROLE, user.username, user.username][i]));
    const all = loadUsers(); const me = all.find(x => x.username === user.username); if (me){ me.lastLogin = Date.now(); saveUsers(all); }
  } catch(e){}
  applyRoleToBody();
  renderProfileArea(); applyProfile();
  try { renderRoleButtons(); } catch(e){}
  try { renderUsersPanel(); } catch(e){}
  try { prefillInspector(); } catch(e){}
  const el = document.getElementById("loginScreen"); if (el) el.remove();
  document.body.classList.remove("locked");
  showToast(loginT(`ยินดีต้อนรับ ${PROFILE_NAME}`, `Welcome, ${PROFILE_NAME}`));
}

window.saveUser = function(existing){

  if (!/^[a-z0-9._-]{3,30}$/.test(username)){ showToast("ชื่อผู้ใช้ต้องเป็น a-z, 0-9, . _ - ยาว 3–30 ตัว"); return; }
  if (!existing && all.some(x => x.username === username)){ showToast("มีชื่อผู้ใช้นี้แล้ว"); return; }
  if (!v("um-name")){ showToast("กรุณากรอกชื่อ-นามสกุล"); return; }
  const pw = (document.getElementById("um-pw") || {}).value || "";
  if ((!existing || pw) && pw.length < 6){ showToast("รหัสผ่านต้องมีอย่างน้อย 6 ตัว"); return; }
  let u = all.find(x => x.username === username);
  if (!u){ u = { username, createdAt:Date.now() }; all.push(u); }
  const isMe = username === currentUsername();
  const newRole = isMe ? u.role : v("um-role");
  if (u.role === "admin" && newRole !== "admin" && all.filter(x => x.role === "admin" && !x.disabled).length <= 1){ showToast("ต้องมีผู้ดูแลระบบอย่างน้อย 1 บัญชี"); return; }
  u.name = v("um-name"); u.title = v("um-title"); u.role = newRole;

  if (pw){ u.hash = pwHash(username, pw); if (!isMe) u.mustChange = true; }

/* ===================== IMPORT / EXPORT (real .xlsx via SheetJS, CSV as a fallback) ===================== */
// Resolves the platform's "downloads" runtime capability once and reuses it; on a surface
// that doesn't grant it (or hasn't loaded window.claude at all), export falls back to a
// plain browser download instead of silently doing nothing.
let downloadsCapPromise = null;
function getDownloadsCap(){
  if (downloadsCapPromise) return downloadsCapPromise;
  downloadsCapPromise = (async () => {
    try {
      if (typeof claude === "undefined" || !claude.use) return null;
      return await claude.use("downloads");
    } catch(e){ return null; }
  })();
  return downloadsCapPromise;
}
// data may be a plain string (CSV/JSON) or an ArrayBuffer/Uint8Array (.xlsx bytes).
async function saveFile(filename, data, mime){
  mime = mime || "text/plain;charset=utf-8";
  const cap = await getDownloadsCap();
  if (cap){
    try {
      await cap.save({ filename, data });
      return true;
    } catch(e){
      if (e && e.code === "declined") return false; // the person just said no — not an error
      // fall through to the plain-browser fallback below for any other failure
    }
  }
  // Outside Claude's own artifact viewer (hosted on GitHub Pages, opened as a local
  // file, etc.) there is no "downloads" capability — but a completely ordinary
  // Blob + <a download> works fine there, since none of the artifact sandbox's
  // restrictions apply to a normally-hosted page. The explicit mime type matters:
  // without it, some browsers preview the bytes as plain text instead of saving a file.
  try {
    const blob = new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch(e){
    showToast("เบราว์เซอร์นี้ไม่รองรับการบันทึกไฟล์");
    return false;
  }
}

const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
let xlsxLibPromise = null;
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
// SheetJS (the "xlsx" library) is what actually writes a real, binary .xlsx file —
// this is what makes an exported table open as a proper formatted spreadsheet instead
// of raw comma-separated text.
function getXLSXLib(){
  if (typeof XLSX !== "undefined") return Promise.resolve(true);
  if (xlsxLibPromise) return xlsxLibPromise;
  xlsxLibPromise = loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")
    .then(() => true)
    .catch(() => loadScriptOnce("https://cdn.jsdelivr.net/npm/[email protected]/dist/xlsx.full.min.js").then(() => true).catch(() => false));
  return xlsxLibPromise;
}
function tableToAOA(rows, columns){
  const hasCancelReason = rows.some(r => r.cancelReason !== undefined);
  const keys = columns.map(c => c.key).concat("status").concat(hasCancelReason ? ["cancelReason"] : []);
  const headers = columns.map(c => tCol(c.label)).concat(LANG === "en" ? "Status" : "สถานะ").concat(hasCancelReason ? [LANG === "en" ? "Cancellation reason" : "เหตุผลการยกเลิก"] : []);
  const aoa = [headers];
  rows.forEach(r => aoa.push(keys.map(k => k === "status" ? tStatus(r[k]) : (r[k] ?? ""))));
  return aoa;
}
function csvEscape(v){
  const s = String(v ?? "");
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function aoaToCSV(aoa){
  // A UTF-8 BOM so Excel reads Thai text correctly instead of showing mojibake.
  return "\uFEFF" + aoa.map(row => row.map(csvEscape).join(",")).join("\r\n");
}
// Small RFC4180-ish parser: handles quoted fields, escaped quotes, and CRLF/LF.
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"'){ inQuotes = true; }
    else if (c === ','){ row.push(field); field = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows;
}

window.exportTableCSV = async function(tableId){

    XLSX.utils.book_append_sheet(wb, ws, tableId.slice(0, 31) || "Sheet1");

  }

window.importTableCSV = function(tableId){
  const st = TableState[tableId]; if (!st) return;
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".csv,text/csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    const isExcel = /\.xlsx$/i.test(file.name);
    let rows;
    if (isExcel){
      const gotLib = await getXLSXLib();
      if (!gotLib || typeof XLSX === "undefined"){ showToast("ไม่สามารถโหลดตัวอ่านไฟล์ Excel ได้ ลองใช้ไฟล์ .csv แทน"); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }).map(r => r.map(v => String(v ?? "")));
    } else {
      rows = parseCSV(await file.text());
    }
    if (rows.length < 2){ showToast("ไฟล์นี้ไม่มีข้อมูล"); return; }
    const keys = st.config.columns.map(c => c.key).concat("status");
    const defaultStatus = statusOptionsFor(tableId)[0];
    let added = 0;
    rows.slice(1).forEach((cells, idx) => {
      if (!cells.some(c => c !== "")) return;
      const row = { id: tableId + "-imp-" + Date.now() + "-" + idx };
      keys.forEach((k, i) => { row[k] = cells[i] !== undefined ? cells[i] : ""; });
      if (!row.status) row.status = defaultStatus;
      st.data.unshift(row);
      added++;
    });
    st.page = 1;
    renderTable(tableId);
    if (added){ persistTable(tableId); refreshLinkedViews(); }
    showToast(added ? `นำเข้าข้อมูล ${added} รายการเรียบร้อยแล้ว` : "ไม่พบแถวข้อมูลที่นำเข้าได้");
  };
  input.click();
};

// Walks the paper form's actual <table> rows and reads each cell as a person would read
// it on paper: a filled-in input's value, a ✓ for a checked box/radio, or the printed
// label text — so the export looks exactly like the form, not a raw data dump.
function paperTableToAOA(container){
  // Read a node the way a person reads the paper: printed text, typed values, ✓ for ticked boxes.
  const read = node => {
    if (node.nodeType === 3) return node.textContent;
    if (node.nodeType !== 1) return "";
    if (node.tagName === "INPUT"){
      if (node.type === "radio" || node.type === "checkbox") return node.checked ? "✓ " : "";
      return node.value || (node.classList.contains("pf-ul") ? "____" : "");
    }
    if (node.classList.contains("pf-photo")) return node.dataset.src ? "[มีรูปภาพ]" : "";
    return [...node.childNodes].map(read).join("");
  };
  const clean = t => t.replace(/ /g, " ").replace(/\s+/g, " ").trim();
  const aoa = [];
  container.querySelectorAll(".pf-title, table.pt tr, table.pt-in tr, .pf-photo-label, .pf-cap, .pf-sh, .pf-line, .pf-foot").forEach(el => {
    if (el.tagName === "TR"){
      const cells = [...el.children].map(td => clean(read(td)));
      if (cells.some(c => c)) aoa.push(cells);
    } else {
      const t = clean(read(el));
      if (t) aoa.push([t]);
      if (el.classList.contains("pf-title")) aoa.push([]);
    }
  });
  return aoa;
}

/* ===================== SAVED DATA (this browser) =====================
   Every table change is written to localStorage, so a work order closed by an inspection, a
   new PM job or an edited asset is still there after a reload — and every page keeps reading
   the same records. */
const TABLE_STORE_VERSION = "v1";
function tableStoreKey(id){ return `tbl-${id}-${TABLE_STORE_VERSION}`; }
function loadStoredRows(id){
  try { const v = localStorage.getItem(tableStoreKey(id)); const rows = v ? JSON.parse(v) : null; return Array.isArray(rows) && rows.length ? rows : null; } catch(e){ return null; }
}
// Each row remembers when it was last changed (_ts) so a sync can keep the newer edit.
const TABLE_SIG = {};
const rowSig = r => { const { _ts, ...rest } = r; return JSON.stringify(rest); };
function rememberTableSig(id){ const st = TableState[id]; if (st){ TABLE_SIG[id] = {}; st.data.forEach(r => { TABLE_SIG[id][r.id] = rowSig(r); }); } }
function persistTable(id){
  const st = TableState[id]; if (!st) return;
  const known = TABLE_SIG[id] || {}, now = Date.now();
  st.data.forEach(r => { const sig = rowSig(r); if (known[r.id] !== sig){ r._ts = now; known[r.id] = sig; } });
  TABLE_SIG[id] = known;
  try { localStorage.setItem(tableStoreKey(id), JSON.stringify(st.data)); } catch(e){}
  queueSync();
}

/* ===================== DATA TABLE ENGINE (search + filter + real pagination + add/view/edit) ===================== */
const TableState = {};

function initAssetTable(tableId, config){
  TableState[tableId] = { data: config.data, page: 1, pageSize: config.pageSize || 4, search: "", status: "", config };
  rememberTableSig(tableId);
  renderTable(tableId);
}

function getFilteredRows(tableId){
  const st = TableState[tableId];
  let rows = st.data;
  if (st.status) rows = rows.filter(r => r.status === st.status);
  if (st.search){
    const q = st.search.toLowerCase();
    rows = rows.filter(r => st.config.searchKeys.some(k => String(r[k] ?? "").toLowerCase().includes(q)));
  }
  return rows;
}

function buildPagerHtml(tableId, page, totalPages){
  let html = `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${page-1})" ${page<=1?"disabled":""}>${ic('chevL')}</button>`;
  const windowSize = 3;
  let start = Math.max(1, page-1);
  let end = Math.min(totalPages, start+windowSize-1);
  start = Math.max(1, end-windowSize+1);
  if (start > 1){ html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',1)">1</button>`; if (start > 2) html += `<span class="pg-dots">…</span>`; }
  for (let p = start; p <= end; p++) html += `<button class="pg-btn ${p===page?"active":""}" onclick="gotoTablePage('${tableId}',${p})">${p}</button>`;
  if (end < totalPages){ if (end < totalPages-1) html += `<span class="pg-dots">…</span>`; html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${totalPages})">${totalPages}</button>`; }
  html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${page+1})" ${page>=totalPages?"disabled":""}>${ic('chevR')}</button>`;
  return html;
}

function renderTable(tableId){
  const st = TableState[tableId];
  if (!st) return;
  const rows = getFilteredRows(tableId);
  const totalPages = Math.max(1, Math.ceil(rows.length / st.pageSize));
  if (st.page > totalPages) st.page = totalPages;
  const startIdx = (st.page - 1) * st.pageSize;
  const pageRows = rows.slice(startIdx, startIdx + st.pageSize);
  const cols = st.config.columns;
  const thead = cols.map(c => `<th>${tCol(c.label)}</th>`).join("") + `<th>${LANG==="en"?"Status":"สถานะ"}</th><th>${LANG==="en"?"Actions":"จัดการ"}</th>`;
  const tbody = pageRows.map(r => {
    const cells = cols.map(c => {
      return `<td>${r[c.key]}</td>`;
    }).join("");
    return `<tr>${cells}<td>${statusBadge(r.status)}</td><td>
      <button class="row-icon-btn" title="ดู" onclick="viewAssetRow('${tableId}','${r.id}')">${ic('eye')}</button>
      <button class="row-icon-btn admin-only" title="แก้ไข" onclick="editAssetRow('${tableId}','${r.id}')">${ic('edit')}</button>
    </td></tr>`;
  }).join("") || `<tr><td colspan="${cols.length+2}" style="text-align:center; color:var(--text-faint); padding:26px;">ไม่พบข้อมูลที่ตรงกับการค้นหา</td></tr>`;
  const tableWrap = document.getElementById(tableId+"-table-wrap");
  if (tableWrap) tableWrap.innerHTML = `<table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
  const countEl = document.getElementById(tableId+"-count");
  if (countEl) countEl.textContent = rows.length ? `แสดง ${startIdx+1}-${Math.min(startIdx+st.pageSize, rows.length)} จาก ${rows.length} รายการ` : "ไม่พบข้อมูล";
  const pagerEl = document.getElementById(tableId+"-pager");
  if (pagerEl) pagerEl.innerHTML = buildPagerHtml(tableId, st.page, totalPages);
  const kpiEl = document.getElementById(tableId+"-kpi-total");
  if (kpiEl) kpiEl.textContent = st.data.length;
  [["active","ใช้งาน"],["maint","ซ่อมบำรุง"],["off","หยุดใช้งาน"]].forEach(([k, status]) => {
    const el = document.getElementById(`${tableId}-kpi-${k}`);
    if (el) el.textContent = st.data.filter(r => r.status === status).length;
  });
  if (tableId === "workorder"){ renderWorkOrderChips(); renderKpiCards(); }
}

// Built once ASSET_DATA/work orders exist; reused by both the dashboard alerts card and the
// notification bell dropdown, so they always agree with each other and with the real records.
let DASH_ALERTS = [];
function renderDashboardWidgets(){
  const wost = TableState["workorder"];
  if (!wost) return;
  // Overdue first, then pending, earliest date first.
  const upcoming = wost.data.filter(r => r.status === "รอดำเนินการ" || r.status === "เกินกำหนด")
    .map(r => ({ r, p: parseWoDate(r) }))
    .sort((a, b) => (a.r.status === "เกินกำหนด" ? 0 : 1) - (b.r.status === "เกินกำหนด" ? 0 : 1) || (a.p.yearBE - b.p.yearBE) || (a.p.month - b.p.month) || (a.p.day - b.p.day))
    .slice(0, 5).map(x => x.r);
  const tbody = document.getElementById("dash-upcoming-tbody");
  if (tbody){
    tbody.innerHTML = upcoming.map(r => `<tr style="cursor:pointer;" title="เปิดใบงาน" onclick="viewAssetRow('workorder','${r.id}')"><td>${r.date}</td><td class="num cell-link">${r.code}</td><td>${r.equip}</td><td>${statusBadge(r.status)}</td></tr>`).join("")
      || `<tr><td colspan="4" style="text-align:center; color:var(--text-faint); padding:16px;">ไม่มีงานที่ใกล้ถึงกำหนด</td></tr>`;
  }
  // Alerts come from the live records: overdue work orders, the latest breakdowns, the latest
  // inspection that closed a work order, and equipment under maintenance.
  const shortDate = ts => { const d = new Date(ts); return `${d.getDate()} ${THAI_MONTHS_SHORT_KPI[d.getMonth()]} ${String(d.getFullYear() + 543).slice(-2)}`; };
  const alerts = [];
  wost.data.filter(r => r.status === "เกินกำหนด").slice(0, 2).forEach(r =>
    alerts.push({ dot:"var(--red)", label:`${r.code} เกินกำหนด · ${r.equip}`, date:r.date, action:`viewAssetRow('workorder','${r.id}')` }));
  FAILURE_LOG.slice(0, 2).forEach(f =>
    alerts.push({ dot:"var(--amber)", label:`ขัดข้อง: ${f.equip} — ${f.cause}`, date:shortDate(f.startTs), action:`viewFailure('${f.id}')` }));
  const closed = loadInspHistory().find(h => h.woCode);
  if (closed) alerts.push({ dot:"var(--green)", label:`${closed.woCode} ตรวจและปิดงานแล้ว`, date:shortDate(Date.parse(closed.savedAt)), action:`goToEquipment('workorder','${closed.woCode}')` });
  DASH_ALERTS = alerts.slice(0, 5);
  const listEl = document.getElementById("dash-alerts-list");
  if (listEl) listEl.innerHTML = DASH_ALERTS.map(a => `<div class="mini-stat-row" style="cursor:pointer;" onclick="${a.action}"><span class="dot" style="background:${a.dot}"></span><span class="lbl">${a.label}</span><span class="val" style="font-size:11px; color:var(--text-faint); font-weight:600; white-space:nowrap;">${a.date}</span></div>`).join("")
    || `<div class="mini-stat-row"><span class="lbl">ไม่มีการแจ้งเตือนใหม่</span></div>`;
  const bellDot = document.querySelector("#notifBellBtn .dot");
  if (bellDot) bellDot.style.display = DASH_ALERTS.length ? "" : "none";
}

/* ---- v27: one workflow bar on every work page, so each page shows where it sits in the PM cycle ---- */
const STEP_PAGES = ["pmplanning", "workorder", "fieldnav", "inspection"];
function renderStepBars(){
  if (!TableState["workorder"]) return;
  const en = LANG === "en", wo = TableState["workorder"].data, m = KPI_PERIOD.monthIdx;
  const open = wo.filter(r => ["รอดำเนินการ","กำลังดำเนินการ","เกินกำหนด"].includes(r.status));
  const late = open.some(r => r.status === "เกินกำหนด");
  const k = computeKpis();
  const steps = [
    { id:"pmplanning", th:"ปฏิทิน PM", en:"Calendar", n:wo.filter(r => r.status !== "ยกเลิก" && woMonthOf(r) === m).length },
    { id:"workorder", th:"ใบงาน", en:"Work orders", n:open.length, warn:late },
    { id:"fieldnav", th:"นำทาง", en:"Navigate", n:FIELD_STOPS.length },
    { id:"inspection", th:"ตรวจ & ปิดงาน", en:"Inspect & close", n:loadInspHistory().filter(inspInPeriod).length },
    { id:"dashboard", th:"สรุป KPI", en:"KPI", n:k.completion == null ? "–" : k.completion.toFixed(0) + "%" },
  ];
  const nextTip = { pmplanning:["ไปที่ใบงาน", "Go to work orders"], workorder:["ไปนำทางหน้างาน", "Navigate to site"], fieldnav:["ไปกรอกใบตรวจ", "Fill inspection"], inspection:["ดูผล KPI", "See KPIs"] };
  STEP_PAGES.forEach((pid, idx) => {
    const page = document.getElementById("page-" + pid); if (!page) return;
    let bar = page.querySelector(":scope > .step-bar");
    if (!bar){ bar = document.createElement("div"); bar.className = "step-bar"; const head = page.querySelector(":scope > .page-head"); if (head) head.after(bar); else page.prepend(bar); }
    const nxt = steps[idx + 1];
    bar.innerHTML = `<div class="sb-steps">` + steps.map((st, i) => `${i ? `<span class="sb-sep">›</span>` : ""}<span class="sb-step ${st.id === pid ? "on" : ""} ${st.warn ? "warn" : ""}" tabindex="0" onclick="goTo('${st.id}')" title="${en ? st.en : st.th}">${i + 1}. ${en ? st.en : st.th} <b>${st.n}</b></span>`).join("") + `</div>`
      + `<button class="btn sb-next" onclick="goTo('${nxt.id}')">${en ? nextTip[pid][1] : nextTip[pid][0]} →</button>`;
    const on = bar.querySelector(".sb-step.on"), sc = bar.querySelector(".sb-steps");
    if (on && sc && sc.scrollWidth > sc.clientWidth) sc.scrollLeft = Math.max(0, on.offsetLeft - sc.offsetLeft - 24);
  });
}

/* ===================== FIELD NAVIGATION MAP ===================== */
// Approximate real-world coordinates for the districts our demo data uses, so distances
// and the "open in Google Maps" hand-off are grounded in real geography (Samut Prakan).
const DISTRICT_COORDS = {
  "บางพลี": { lat:13.6034, lng:100.7043 },
  "บางพลีน้อย": { lat:13.5980, lng:100.6900 },
  "ตำหรุ": { lat:13.5900, lng:100.7250 },
  "สำโรง": { lat:13.6100, lng:100.5950 },
  "บางเสาธง": { lat:13.5750, lng:100.7200 },
  "พระสมุทรเจดีย์": { lat:13.6010, lng:100.5520 },
  "เมืองสมุทรปราการ": { lat:13.5990, lng:100.5970 },
  "บางบ่อ": { lat:13.5330, lng:100.8850 },
};
const FIELD_ORIGIN = { lat:13.5990, lng:100.5970, label:"ศูนย์ปฏิบัติการ เขตเมืองสมุทรปราการ" };
const MAP_BOUNDS = { minLat:13.51, maxLat:13.65, minLng:100.53, maxLng:100.90 };

function getAssetDistrict(tableId, row){
  if (!row) return null;
  if (tableId === "feeder") return row.name;
  if (tableId === "transformer") return row.place;
  if (tableId === "lbs") return row.place;
  if (tableId === "substation") return row.name;
  return null;
}
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function projectLatLng(lat, lng){
  const x = 60 + (lng - MAP_BOUNDS.minLng) / (MAP_BOUNDS.maxLng - MAP_BOUNDS.minLng) * 680;
  const y = 40 + (1 - (lat - MAP_BOUNDS.minLat) / (MAP_BOUNDS.maxLat - MAP_BOUNDS.minLat)) * 420;
  return { x, y };
}

let FIELD_STOPS = [];
function buildFieldStops(){
  const wost = TableState["workorder"];
  if (!wost){ FIELD_STOPS = []; return; }
  const pending = wost.data.filter(r => ["รอดำเนินการ", "กำลังดำเนินการ", "เกินกำหนด"].includes(r.status));
  const picked = pending.slice(0, 14).map(wo => {
    const district = DISTRICT_COORDS[wo.place] ? wo.place : "เมืองสมุทรปราการ";
    return { wo, district };
  });
  // Group by district and arrange each group's pins in a small ring around the district
  // centre — deterministic, and guarantees pins never land on exactly the same spot.
  const byDistrict = {};
  picked.forEach(item => { (byDistrict[item.district] = byDistrict[item.district] || []).push(item); });
  Object.values(byDistrict).forEach(group => {
    const n = group.length;
    const radius = n <= 1 ? 0 : 0.0075 + Math.min(n, 8) * 0.0012;
    group.forEach((item, i) => {
      const coord = DISTRICT_COORDS[item.district] || DISTRICT_COORDS["เมืองสมุทรปราการ"];
      const angle = n <= 1 ? 0 : (2 * Math.PI * i / n) - Math.PI / 2;
      item.lat = coord.lat + Math.sin(angle) * radius;
      item.lng = coord.lng + Math.cos(angle) * radius * 1.25; // lng degrees are narrower at this latitude
    });
  });
  FIELD_STOPS = picked.map(item => ({
    wo: item.wo, district: item.district, lat: item.lat, lng: item.lng,
    distKm: haversineKm(FIELD_ORIGIN.lat, FIELD_ORIGIN.lng, item.lat, item.lng),
  })).sort((a,b) => a.distKm - b.distKm);
}

function renderFieldMap(){
  const mapWrap = document.getElementById("fieldMapSvgWrap");
  const listEl = document.getElementById("fieldStopsList");
  const countEl = document.getElementById("fieldStopsCount");
  if (!mapWrap) return;
  const stops = FIELD_STOPS;
  const originXY = projectLatLng(FIELD_ORIGIN.lat, FIELD_ORIGIN.lng);

  const defs = `<defs>
    <filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="waterGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#bfe0f7"/>
      <stop offset="100%" stop-color="#a9d6f2"/>
    </radialGradient>
  </defs>`;
  // Base terrain + a light road-network texture, in the pale cream / gray-road palette Google's
  // default map style uses, since real map tiles can't be fetched into this sandboxed page.
  const base = `<rect x="0" y="0" width="800" height="500" fill="#f2efe9"/>`;
  const water = `
    <path d="M55,10 C112,140 72,270 108,480 L158,480 C124,300 160,165 122,10 Z" fill="url(#waterGrad)"/>
    <path d="M10,432 C280,492 540,492 790,438 L790,482 L10,482 Z" fill="url(#waterGrad)"/>
  `;
  // A handful of generic streets so the canvas reads as a road network rather than empty space —
  // one wider "arterial" road (Google renders these pale yellow) plus thin local streets.
  const arterial = `<path d="M170,60 C260,180 340,300 430,470" stroke="#f6d989" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M170,60 C260,180 340,300 430,470" stroke="#e8bf5a" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.35" stroke-dasharray="0.1 14"/>
    <path d="M40,260 C260,210 540,230 780,190" stroke="#f6d989" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const localStreets = [
    "M0,120 C220,95 520,110 800,80", "M0,340 C220,360 520,345 800,380",
    "M230,0 C210,160 260,320 220,500", "M560,0 C540,150 590,330 560,500",
    "M0,190 C180,210 420,195 620,215 C700,222 760,215 800,205",
  ].map(d => `<path d="${d}" stroke="#e2ddd0" stroke-width="2.5" fill="none" stroke-linecap="round"/>`).join("");
  const placeLabels = Object.entries(DISTRICT_COORDS).map(([name, c]) => {
    const p = projectLatLng(c.lat, c.lng);
    return `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="middle" font-size="11.5" letter-spacing="0.3" fill="#5b6478" font-weight="700" style="paint-order:stroke; stroke:#f2efe9; stroke-width:4px; stroke-linejoin:round;">${name}</text>`;
  }).join("");
  const roadLines = stops.map(s => {
    const p = projectLatLng(s.lat, s.lng);
    const mx = (originXY.x + p.x) / 2 + (p.y - originXY.y) * 0.08;
    const my = (originXY.y + p.y) / 2 - (p.x - originXY.x) * 0.08;
    return `<path d="M${originXY.x.toFixed(1)},${originXY.y.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}" fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round" opacity="0.5"/>`;
  }).join("");
  // Google-style teardrop pin: rounded head, pointed foot, small white core.
  const pinPath = "M0,-24 C8.8,-24 16,-16.8 16,-8 C16,3 0,20 0,20 C0,20 -16,3 -16,-8 C-16,-16.8 -8.8,-24 0,-24 Z";
  const pins = stops.map((s, i) => {
    const p = projectLatLng(s.lat, s.lng);
    const color = s.wo.status === "เกินกำหนด" ? "#ef4444" : s.wo.status === "กำลังดำเนินการ" ? "#0E9F8E" : "#f59e0b";
    return `<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})" onclick="showFieldStopDetail(${i})" style="cursor:pointer;" filter="url(#pinShadow)">
      <path d="${pinPath}" fill="${color}" stroke="#fff" stroke-width="1.6"/>
      <circle cx="0" cy="-8" r="7.5" fill="#fff"/>
      <text x="0" y="-4.5" text-anchor="middle" font-size="9.5" fill="${color}" font-weight="800">${i+1}</text>
    </g>`;
  }).join("");
  const originPin = `
    <circle class="origin-pulse" cx="${originXY.x.toFixed(1)}" cy="${originXY.y.toFixed(1)}" r="10" fill="#4285f4"/>
    <circle cx="${originXY.x.toFixed(1)}" cy="${originXY.y.toFixed(1)}" r="7" fill="#4285f4" stroke="#fff" stroke-width="3" filter="url(#pinShadow)"/>
    <text x="${originXY.x.toFixed(1)}" y="${(originXY.y-16).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#3f5a75" font-weight="800" style="paint-order:stroke; stroke:#f2efe9; stroke-width:4px;">ตำแหน่งของฉัน</text>`;

  mapWrap.innerHTML = `<svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    ${defs}
    ${base}
    ${water}
    ${localStreets}
    ${arterial}
    ${placeLabels}
    ${roadLines}
    ${pins}
    ${originPin}
  </svg>`;

  if (countEl) countEl.textContent = `(${stops.length})`;
  if (FIELD_FOCUS != null && FIELD_FOCUS >= stops.length) FIELD_FOCUS = null;
  syncFieldGoogleMap();
  if (listEl){
    listEl.innerHTML = stops.map((s, i) => `
      <div class="field-stop-row ${FIELD_FOCUS === i ? "focused" : ""}" data-stop="${i}" onclick="showFieldStopDetail(${i})">
        <div class="num" style="background:${s.wo.status==='เกินกำหนด' ? 'var(--red-soft)' : s.wo.status==='กำลังดำเนินการ' ? 'var(--green-soft)' : 'var(--amber-soft)'}; color:${s.wo.status==='เกินกำหนด' ? 'var(--red-ink)' : s.wo.status==='กำลังดำเนินการ' ? 'var(--green-ink)' : 'var(--amber-ink)'};">${stopLabel(i)}</div>
        <div class="body"><div class="t">${s.wo.equip}</div><div class="d">${s.district} · ${s.distKm.toFixed(1)} กม. จากศูนย์ปฏิบัติการ</div></div>
        ${statusBadge(s.wo.status)}
        <button class="stop-pin-btn" title="แสดงจุดนี้บนแผนที่" onclick="event.stopPropagation(); focusFieldStop(${i})">${ic('mapPin')}</button>
      </div>`).join("") || `<div style="padding:26px; text-align:center; color:var(--text-faint);">ไม่มีงานที่ต้องออกตรวจภาคสนามในขณะนี้</div>`;
  }
}

  const body = `<div class="mini-stat-list">

    <div class="mini-stat-row"><span class="lbl">อุปกรณ์</span><span class="val">${s.wo.equip}</span></div>
    <div class="mini-stat-row"><span class="lbl">พื้นที่</span><span class="val">${s.district}</span></div>
    <div class="mini-stat-row"><span class="lbl">ระยะทางโดยประมาณ</span><span class="val">${s.distKm.toFixed(1)} กม.</span></div>
    <div class="mini-stat-row"><span class="lbl">สถานะ</span><span class="val">${statusBadge(s.wo.status)}</span></div>
  </div>`;
  const inspIdx = s.wo.assetTableId != null ? ASSET_INSPECTION_LINK[s.wo.assetTableId] : undefined;

  openModal(`จุดตรวจ ${stopLabel(i)} — ${s.wo.code}`, body,
    `<button class="btn" onclick="closeModal(); focusFieldStop(${i})">${ic('mapPin')} แสดงบนแผนที่</button>
     <a class="btn" href="${gmapsUrl}" target="_blank" rel="noopener" style="text-decoration:none; display:inline-flex; align-items:center; gap:7px;">${ic('mapPin')} เปิดนำทางใน Google Maps</a>
     ${inspBtn}
     <button class="btn primary" onclick="closeModal(); viewAssetRow('workorder','${s.wo.id}')">เปิดใบงาน</button>`);
};

window.openFullRoute = function(){
  if (!FIELD_STOPS.length){ showToast("ไม่มีจุดตรวจในขณะนี้"); return; }
  // Google's web directions URL accepts a practical maximum of around 9-10 stops total;
  // take the nearest ones first (FIELD_STOPS is already sorted by distance).
  const chain = FIELD_STOPS.slice(0, 9);
  const last = chain[chain.length - 1];
  const waypoints = chain.slice(0, -1).map(s => `${s.lat},${s.lng}`).join("|");
  let url = `https://www.google.com/maps/dir/?api=1&origin=${FIELD_ORIGIN.lat},${FIELD_ORIGIN.lng}&destination=${last.lat},${last.lng}`;
  if (waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  window.open(url, "_blank", "noopener");
  if (FIELD_STOPS.length > chain.length) showToast(`เปิดเส้นทาง ${chain.length} จุดแรกที่ใกล้ที่สุด (Google Maps จำกัดจำนวนจุดต่อเส้นทาง)`);
};

/* ---- Real Google Maps (keyless embed). Overview = driving route from the operations centre
   through every stop (Google labels them A = start, B, C, … in list order); focusing a stop
   shows a pin on that location. Inside Claude's own preview, outside sites can't be framed,
   so that environment opens on the simulated map; the choice is remembered per browser. ---- */
const GMAP_MAX_STOPS = 9; // Google's route view handles about 10 points including the start
let FIELD_FOCUS = null;   // index into FIELD_STOPS, or null for the route overview
let FIELD_MAP_MODE = (() => {
  try { const v = localStorage.getItem("fieldMapMode"); if (v === "google" || v === "sim") return v; } catch(e){}
  return /claude/i.test(location.hostname) ? "sim" : "google";
})();
function stopLabel(i){
  // In the Google route view the markers are lettered; keep the list in step with them.
  return FIELD_MAP_MODE === "google" && i < GMAP_MAX_STOPS ? String.fromCharCode(66 + i) : String(i + 1);
}
function gmapRouteUrl(){
  const o = FIELD_ORIGIN, chain = FIELD_STOPS.slice(0, GMAP_MAX_STOPS);
  if (!chain.length) return `https://maps.google.com/maps?q=${o.lat},${o.lng}&z=12&hl=th&output=embed`;
  return `https://maps.google.com/maps?saddr=${o.lat},${o.lng}&daddr=${chain.map(s => s.lat.toFixed(5) + "," + s.lng.toFixed(5)).join("+to:")}&hl=th&output=embed`;
}
function gmapPointUrl(s){ return `https://maps.google.com/maps?q=${s.lat.toFixed(5)},${s.lng.toFixed(5)}&z=16&hl=th&output=embed`; }
function syncFieldGoogleMap(){
  const frame = document.getElementById("fieldGmap"), sim = document.getElementById("fieldMapSim");
  const bar = document.getElementById("gmapBar"), hint = document.getElementById("gmapHint");
  if (!frame || !sim) return;
  const g = FIELD_MAP_MODE === "google";
  frame.style.display = g ? "block" : "none";
  sim.style.display = g ? "none" : "block";
  const bG = document.getElementById("mapModeGoogle"), bS = document.getElementById("mapModeSim");
  if (bG) bG.classList.toggle("active", g);
  if (bS) bS.classList.toggle("active", !g);
  document.querySelectorAll(".field-stop-row[data-stop]").forEach(el => el.classList.toggle("focused", +el.dataset.stop === FIELD_FOCUS));
  if (!g){
    if (bar) bar.innerHTML = `แผนที่จำลอง · ตำแหน่งโดยประมาณตามเขต · กดหมุดเพื่อดูรายละเอียด`;
    if (hint) hint.textContent = "";
    return;
  }
  const s = FIELD_FOCUS != null ? FIELD_STOPS[FIELD_FOCUS] : null;
  const url = s ? gmapPointUrl(s) : gmapRouteUrl();
  if (frame.dataset.src !== url){ frame.dataset.src = url; frame.src = url; } // avoid reloading the map needlessly
  if (bar){
    const n = FIELD_STOPS.length, shown = Math.min(n, GMAP_MAX_STOPS);
    bar.innerHTML = s
      ? `กำลังแสดง <b>จุดตรวจ ${stopLabel(FIELD_FOCUS)}</b> · ${s.wo.code} · ${s.wo.equip} (${s.district}) <button class="btn" onclick="focusFieldStop(null)">${ic('arrowLeft')} กลับไปดูเส้นทางทั้งหมด</button>`
      : n ? `เส้นทางตรวจ <b>${shown} จุด</b> เรียงจากใกล้ไปไกล · <b>A</b> = ${FIELD_ORIGIN.label}${n > shown ? ` · แสดง ${shown} จุดแรก (เหลืออีก ${n - shown} จุดในรายการด้านล่าง)` : ""}`
          : `ไม่มีจุดตรวจในขณะนี้ — แสดงตำแหน่ง${FIELD_ORIGIN.label}`;
  }
  if (hint) hint.textContent = "* ตำแหน่งจุดตรวจเป็นพิกัดโดยประมาณตามเขตของอุปกรณ์ · ถ้าแผนที่ Google ไม่ขึ้น (เช่น เครือข่ายปิดกั้น Google) กด \"แผนที่จำลอง\" ด้านบน";
}
window.setFieldMapMode = function(mode){
  FIELD_MAP_MODE = mode === "sim" ? "sim" : "google";
  try { localStorage.setItem("fieldMapMode", FIELD_MAP_MODE); } catch(e){}
  renderFieldMap(); // badges switch between A/B/C and 1/2/3
};
window.focusFieldStop = function(i){
  FIELD_FOCUS = i == null ? null : i;
  if (FIELD_MAP_MODE === "sim"){ if (i != null) showFieldStopDetail(i); return; }
  syncFieldGoogleMap();
  if (i != null){
    const canvas = document.querySelector("#page-fieldnav .field-map-canvas");
    if (canvas && canvas.getBoundingClientRect().top < 60) canvas.scrollIntoView({ behavior: "smooth", block: "center" });
  }
};

let fieldMapZoom = 1;
window.zoomFieldMap = function(delta){
  fieldMapZoom = Math.min(2, Math.max(1, fieldMapZoom + delta*0.25));
  const wrap = document.getElementById("fieldMapSvgWrap");
  if (wrap) wrap.style.transform = `scale(${fieldMapZoom})`;
};

   2) Overdue PM Rate     = งาน PM ที่เกินกำหนด ÷ งาน PM ทั้งหมด × 100       (target ≤ 10%)

const THAI_MONTHS_SHORT_KPI = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function fmtThaiDateTime(ts){
  const d = new Date(ts);
  return `${d.getDate()} ${THAI_MONTHS_SHORT_KPI[d.getMonth()]} ${String(d.getFullYear() + 543).slice(-2)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
// FAILURE_LOG = breakdowns the user recorded in this browser + the built-in sample history.
let FAILURE_LOG = [], FAILURE_SAMPLE = [];
function makeFailureLog(assetData){
  const pool = [];
  assetData.transformer.slice(0, 40).forEach(a => pool.push({ tableId:"transformer", code:a.code, label:"Transformer "+a.code }));
  assetData.lbs.slice(0, 30).forEach(a => pool.push({ tableId:"lbs", code:a.code, label:"LBS "+a.code }));
  assetData.feeder.slice(0, 30).forEach(a => pool.push({ tableId:"feeder", code:a.code, label:"Feeder "+a.code }));
  Object.entries(EXTRA_ASSETS).forEach(([t, l]) => l.forEach(a => pool.push({ tableId:t, code:a.code, label:a.label })));
  const log = []; let k = 0;
  FAILURE_MONTH_COUNTS.forEach((n, m) => {
    if (m > NOW_M) return; // no sample breakdowns in months that haven't happened yet
    for (let i = 0; i < n; i++){
      // Symmetric spread around the month's mean (sums to ~0) so each month's MTTR lands on its mean.
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * 1.6;
      const hours = Math.max(0.5, Math.round((FAILURE_MONTH_MEAN_HRS[m] + off) * 10) / 10);
      const asset = pool[(k * 7) % pool.length];
      const day = 1 + ((i * 6 + m * 3) % (m === NOW_M ? Math.max(1, NOW_D - 1) : 27));
      const start = new Date(NOW_Y, m, day, 7 + (k * 5) % 11, (k * 17) % 60);
      if (m === NOW_M && start > TODAY) continue;
      log.push({ id:"F-"+String(k+1).padStart(4,"0"), sample:true, yearBE:NOW_BE, month:m, day,
        startTs:start.getTime(), endTs:start.getTime() + hours * 3600000, dateLabel:fmtThaiDateTime(start.getTime()),
        tableId:asset.tableId, assetCode:asset.code, equip:asset.label,
        cause:FAILURE_CAUSES[asset.tableId][k % FAILURE_CAUSES[asset.tableId].length], hours, reporter:"ข้อมูลตัวอย่าง", note:"" });
      k++;
    }
  });
  // sample history for the two previous years (full 12 months each)
  PREV_YEAR_SAMPLE.forEach((P, yi) => {
    const yearCE = NOW_Y - 1 - yi; let kk = 0;
    P.fcount.forEach((n, m) => {
      for (let i = 0; i < n; i++){
        const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * 1.6;
        const hours = Math.max(0.5, Math.round((P.fhrs[m] + off) * 10) / 10);
        const asset = pool[(kk * 11 + yi * 5) % pool.length];
        const day = 1 + ((i * 5 + m * 2) % 27);
        const start = new Date(yearCE, m, day, 7 + (kk * 5) % 11, (kk * 17) % 60);
        log.push({ id:"F-" + (yearCE + 543) + "-" + String(kk + 1).padStart(4, "0"), sample:true, yearBE:yearCE + 543, month:m, day,
          startTs:start.getTime(), endTs:start.getTime() + hours * 3600000, dateLabel:fmtThaiDateTime(start.getTime()),
          tableId:asset.tableId, assetCode:asset.code, equip:asset.label,
          cause:FAILURE_CAUSES[asset.tableId][kk % FAILURE_CAUSES[asset.tableId].length], hours, reporter:"ข้อมูลตัวอย่าง", note:"" });
        kk++;
      }
    });
  });
  return log;
}
function loadUserFailures(){ try { return JSON.parse(localStorage.getItem("failure-log-user") || "[]"); } catch(e){ return []; } }
function saveUserFailures(list){ try { localStorage.setItem("failure-log-user", JSON.stringify(list.slice(0, 500))); queueSync(); return true; } catch(e){ return false; } }
function rebuildFailureLog(){ FAILURE_LOG = loadUserFailures().concat(FAILURE_SAMPLE).sort((a, b) => b.startTs - a.startTs); }

// A work order's month comes from its date text ("5 ก.ย. 69"); anything unparseable counts as the demo month.
// "5 ก.ย. 69" / "30 ก.ย. 2569" → { day, month, yearBE }; unparseable dates fall back to the demo month.
function parseWoDate(r){
  const d = String(r.date || "");
  for (let i = 0; i < 12; i++){
    const at = d.indexOf(THAI_MONTHS_SHORT_KPI[i]);
    if (at < 0) continue;
    const day = parseInt(d.slice(0, at), 10);
    const ym = d.slice(at + THAI_MONTHS_SHORT_KPI[i].length).match(/\d{2,4}/);
    let yearBE = ym ? parseInt(ym[0], 10) : NOW_BE;
    if (yearBE < 100) yearBE += 2500;
    return { day: isNaN(day) ? 1 : day, month: i, yearBE };
  }
  return { day: 1, month: KPI_DEMO_MONTH, yearBE: NOW_BE };
}
function woMonthOf(r){ const p = parseWoDate(r); return p.yearBE === KPI_PERIOD.yearBE ? p.month : -1; }
function pmStatsFor(i){
  const wo = (TableState["workorder"] ? TableState["workorder"].data : []).filter(r => woMonthOf(r) === i);
  // months before the system's first month have no work orders: show the sample history instead
  if (KPI_PERIOD.yearBE === NOW_BE && i < KPI_DEMO_MONTH && !wo.length) return { completion: KPI_HISTORY.completion[i], overdueRate: KPI_HISTORY.overdue[i], sample: true };
  const PY = PREV_YEAR_SAMPLE[NOW_BE - 1 - KPI_PERIOD.yearBE];
  if (PY && !wo.length) return { completion: PY.completion[i], overdueRate: PY.overdue[i], sample: true };
  const active = wo.filter(r => r.status !== "ยกเลิก");
  const total = active.length;
  const done = active.filter(r => r.status === "เสร็จสิ้น").length;
  const overdue = active.filter(r => r.status === "เกินกำหนด").length;
  return { total, done, overdue, cancelled: wo.length - total,
    completion: total ? done / total * 100 : null, overdueRate: total ? overdue / total * 100 : null };
}
function failuresIn(i){ return FAILURE_LOG.filter(x => x.yearBE === KPI_PERIOD.yearBE && x.month === i); }
function mttrOf(list){ return list.length ? list.reduce((t, x) => t + x.hours, 0) / list.length : null; }
function kpiYears(){
  const ys = new Set([NOW_BE, NOW_BE - 1, NOW_BE - 2]);
  FAILURE_LOG.forEach(f => ys.add(f.yearBE));
  (TableState["workorder"] ? TableState["workorder"].data : []).forEach(r => ys.add(parseWoDate(r).yearBE));
  return [...ys].filter(y => y >= 2500 && y <= NOW_BE).sort((a, b) => b - a);
}
function kpiMaxMonth(){
  if (KPI_PERIOD.yearBE < NOW_BE) return 11;
  let max = KPI_DEMO_MONTH;
  FAILURE_LOG.forEach(f => { if (f.yearBE === KPI_PERIOD.yearBE) max = Math.max(max, f.month); });
  (TableState["workorder"] ? TableState["workorder"].data : []).forEach(r => { max = Math.max(max, woMonthOf(r)); });
  const now = new Date(); if (now.getFullYear() + 543 === KPI_PERIOD.yearBE) max = Math.max(max, now.getMonth());
  return Math.min(11, max);
}
function computeKpis(){
  const m = KPI_PERIOD.monthIdx;
  const pm = pmStatsFor(m);
  const failList = failuresIn(m).slice().sort((a, b) => a.startTs - b.startTs);
  const months = THAI_MONTHS_SHORT_KPI.slice(0, m + 1);
  const pmSeries = months.map((_, i) => pmStatsFor(i));
  return {
    ...pm, failList, repairHours: failList.reduce((t, x) => t + x.hours, 0),
    mttr: mttrOf(failList), failures: failList.length, months,
    series: {
      completion: pmSeries.map(p => p.completion),
      overdue: pmSeries.map(p => p.overdueRate),
      mttr: months.map((_, i) => mttrOf(failuresIn(i))),
      failures: months.map((_, i) => failuresIn(i).length),
    },
    // which months are sample numbers rather than records in the system (drawn with a dashed outline)
    sampleFlags: {
      pm: pmSeries.map(p => !!p.sample),
      fail: months.map((_, i) => { const l = failuresIn(i); return l.length > 0 && l.every(f => f.sample); }),
    },
  };
}

  KPI_PERIOD.yearBE = parseInt(v, 10);
  KPI_PERIOD.monthIdx = KPI_PERIOD.yearBE === NOW_BE ? KPI_DEMO_MONTH : 11;
  renderKpiCards(); renderKpiCharts(); renderFlowStrip();
};
window.setKpiMonth = function(v){
  KPI_PERIOD.monthIdx = parseInt(v, 10);
  renderKpiCards();

function kpiDeltaHtml(cur, prev, unit, goodWhenDown, decimals){
  if (cur == null || prev == null) return `<span>ไม่มีข้อมูลเทียบเดือนก่อน</span>`;
  const d = cur - prev;
  if (Math.abs(d) < Math.pow(10, -decimals) / 2) return `<span class="pct">เท่ากับเดือนก่อน</span>`;
  const good = goodWhenDown ? d < 0 : d > 0;
  return `<span class="kpi-delta ${good ? "good" : "bad"}">${d > 0 ? "▲ +" : "▼ "}${d.toFixed(decimals)}${unit}</span> จากเดือนก่อน`;
}
function kpiTargetHtml(ok, text){
  return `<span class="kpi-target ${ok ? "ok" : "miss"}">${ok ? "✓ ผ่านเป้า" : "✕ ยังไม่ถึงเป้า"} · เป้า ${text}</span>`;
}
function renderKpiCards(){
  if (!document.getElementById("kpiCompletionVal")) return;
  const k = computeKpis(), S = k.series, n = S.completion.length, T = KPI_TARGETS;
  const put = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  const status = (id, ok, missText, naText) => {
    const el = document.getElementById(id); if (!el) return;
    if (ok == null){ el.className = "kpi-status na"; el.textContent = naText || "ไม่มีข้อมูล"; return; }
    el.className = "kpi-status " + (ok ? "ok" : "miss"); el.textContent = ok ? "✓ ผ่านเป้า" : "✕ " + missText;
  };
  const val = (v, unit, dec) => v == null ? "–" : `${dec == null ? v : v.toFixed(dec)}<small>${unit}</small>`;
  const ysel = document.getElementById("kpiYearSelect");
  if (ysel) ysel.innerHTML = kpiYears().map(y => `<option value="${y}" ${y === KPI_PERIOD.yearBE ? "selected" : ""}>ปี ${y}</option>`).join("");
  const sel = document.getElementById("kpiMonthSelect");
  if (sel){
    const max = kpiMaxMonth();
    sel.innerHTML = Array.from({ length: max + 1 }, (_, i) => `<option value="${i}" ${i === KPI_PERIOD.monthIdx ? "selected" : ""}>${THAI_MONTHS_SHORT_KPI[i]} ${KPI_PERIOD.yearBE}</option>`).join("");
  }
  put("kpiCompletionVal", val(k.completion, "%", 1));
  put("kpiOverdueVal", val(k.overdueRate, "%", 1));
  put("kpiMttrVal", val(k.mttr, "ชม.", 1));
  put("kpiFailuresVal", val(k.failures, "ครั้ง"));
  put("kpiCompletionDelta", kpiDeltaHtml(S.completion[n-1], S.completion[n-2], "%", false, 1));
  put("kpiOverdueDelta", kpiDeltaHtml(S.overdue[n-1], S.overdue[n-2], "%", true, 1));
  put("kpiMttrDelta", kpiDeltaHtml(S.mttr[n-1], S.mttr[n-2], " ชม.", true, 1));
  put("kpiFailuresDelta", kpiDeltaHtml(S.failures[n-1], S.failures[n-2], "", true, 0));
  status("kpiCompletionTarget", k.completion == null ? null : k.completion >= T.completion, "ต่ำกว่าเป้า", "ยังไม่มีใบงาน");
  status("kpiOverdueTarget", k.overdueRate == null ? null : k.overdueRate <= T.overdue, "เกินเป้า", "ยังไม่มีใบงาน");
  status("kpiMttrTarget", k.mttr == null ? null : k.mttr <= T.mttr, "เกินเป้า", "ไม่มีการซ่อม");
  const noData = !k.sample && !k.total && !k.failures; // a month with no work orders and no records at all
  status("kpiFailuresTarget", noData ? null : k.failures <= T.failures, "เกินเป้า", "ยังไม่มีข้อมูล");
}
function renderKpiCharts(){
  const k = computeKpis(), S = k.series, T = KPI_TARGETS;
  const SP = k.sampleFlags.pm, SF = k.sampleFlags.fail;
  svgKpiBars("chartKpiCompletion", k.months, S.completion, { sample:SP, max:100, target:T.completion, targetLabel:"เป้า ≥ 90%", fmt:v => v.toFixed(0) + "%", tip:v => v.toFixed(1) + "%" });
  svgKpiBars("chartKpiOverdue", k.months, S.overdue, { sample:SP, max:20, target:T.overdue, targetLabel:"เป้า ≤ 10%", fmt:v => v.toFixed(0) + "%", tip:v => v.toFixed(1) + "%" });
  svgKpiLine("chartKpiMttr", k.months, S.mttr, { sample:SF, max:8, target:T.mttr, targetLabel:"เป้า ≤ 4 hr", fmt:v => v.toFixed(0), tip:v => v.toFixed(1) + " ชม./ครั้ง", last:v => v.toFixed(1) });
  svgKpiBars("chartKpiFailures", k.months, S.failures, { sample:SF, max:20, target:T.failures, targetLabel:"เป้า ≤ 5", fmt:v => String(Math.round(v)), tip:v => v + " ครั้ง" });
}

  if (key === "completion"){
    calc = k.sample ? `${k.completion.toFixed(1)}%` : k.completion == null ? "ยังไม่มีใบงานในเดือนนี้" : `${k.done} ÷ ${k.total} × 100 = ${k.completion.toFixed(1)}%`;

    extra = woNote;

  } else {

      <div><b>เป้าหมาย:</b> ${d.target} — ${d.goal}</div>
    </div>
    ${extra}`, `${btn}<button class="btn" onclick="closeModal(); goToGuide('guide-calc')">${ic('help')} วิธีคำนวณ</button><button class="btn primary" onclick="closeModal()">ปิด</button>`);

/* ===================== FAILURE LOG (บันทึกความขัดข้อง) =====================
   Technicians record each breakdown with its start and repair-finished time; repair hours are
   computed from the two. Entries are kept in this browser (localStorage) and feed the MTTR and
   Failure Frequency KPIs on the dashboard immediately. */
const FAILURE_TYPE_LABEL = { transformer:"หม้อแปลงจำหน่าย", lbs:"สวิตช์ตัดตอน (LBS)", feeder:"สายป้อน (Feeder)", substation:"สถานีย่อย",

window.deleteFailure = function(id){

function toLocalInputValue(d){ return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
window.openFailureModal = function(tableId, code){
  const types = Object.entries(FAILURE_TYPE_LABEL).map(([id, label]) => `<option value="${id}" ${id === tableId ? "selected" : ""}>${label}</option>`).join("");
  const now = new Date(); now.setSeconds(0, 0);
  const started = new Date(now.getTime() - 2 * 3600000);
  openModal("บันทึกความขัดข้อง", `
    <div class="form-grid-2">
      <div class="insp-field"><label>ประเภทอุปกรณ์</label><select id="fl-type" class="select-sm" onchange="populateFailureOptions()">${types}</select></div>
      <div class="insp-field"><label>อุปกรณ์</label><select id="fl-equip" class="select-sm"></select></div>
      <div class="insp-field full"><label>สาเหตุ</label><select id="fl-cause" class="select-sm" onchange="document.getElementById('fl-cause-other-wrap').style.display = this.value==='__other' ? '' : 'none'"></select></div>
      <div class="insp-field full" id="fl-cause-other-wrap" style="display:none;"><label>ระบุสาเหตุ</label><input type="text" id="fl-cause-other" placeholder="เช่น รถชนเสา, น้ำท่วมตู้"></div>
      <div class="insp-field"><label>เวลาเกิดเหตุ</label><input type="datetime-local" id="fl-start" value="${toLocalInputValue(started)}" oninput="updateFailureHours()"></div>
      <div class="insp-field"><label>เวลาซ่อมเสร็จ</label><input type="datetime-local" id="fl-end" value="${toLocalInputValue(now)}" oninput="updateFailureHours()"></div>
      <div class="full fl-hours" id="fl-hours"></div>
      <div class="insp-field"><label>ผู้บันทึก</label><input type="text" id="fl-reporter" value="${PROFILE_SET() ? PROFILE_NAME : ""}" placeholder="ชื่อผู้บันทึก"></div>
      <div class="insp-field"><label>หมายเหตุ (ถ้ามี)</label><input type="text" id="fl-note" placeholder="รายละเอียดการแก้ไข"></div>
    </div>`,
    `<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="submitFailure()">บันทึก</button>`);
  if (!tableId) document.getElementById("fl-type").value = "transformer";
  populateFailureOptions(code);
  updateFailureHours();
};
window.populateFailureOptions = function(selectCode){
  const type = document.getElementById("fl-type").value;
  const eq = document.getElementById("fl-equip"), cs = document.getElementById("fl-cause");
  const seen = new Map();
  (TableState["workorder"] ? TableState["workorder"].data : []).forEach(r => { if (r.assetTableId === type && r.assetCode && !seen.has(r.assetCode)) seen.set(r.assetCode, r.place || ""); });
  if (selectCode && !seen.has(selectCode)) seen.set(selectCode, "");
  eq.innerHTML = [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([code, place]) => `<option value="${code}" ${code === selectCode ? "selected" : ""}>${code}${place ? " — " + place : ""}</option>`).join("");
  cs.innerHTML = (FAILURE_CAUSES[type] || []).map(c => `<option value="${c}">${c}</option>`).join("") + `<option value="__other">อื่นๆ (ระบุเอง)</option>`;
  document.getElementById("fl-cause-other-wrap").style.display = "none";
};
window.updateFailureHours = function(){
  const s = new Date(document.getElementById("fl-start").value), e = new Date(document.getElementById("fl-end").value);
  const el = document.getElementById("fl-hours"); if (!el) return;
  if (isNaN(s) || isNaN(e)){ el.innerHTML = "กรอกเวลาเกิดเหตุและเวลาซ่อมเสร็จ"; return; }
  const h = (e - s) / 3600000;
  el.innerHTML = h <= 0 ? `<span style="color:var(--red-ink); font-weight:700;">เวลาซ่อมเสร็จต้องอยู่หลังเวลาเกิดเหตุ</span>`
    : `เวลาที่ใช้ซ่อม <b>${h.toFixed(1)} ชม.</b> ${h > KPI_TARGETS.mttr ? '<span class="badge red" style="margin-left:6px;">เกินเป้า 4 ชม.</span>' : '<span class="badge green" style="margin-left:6px;">อยู่ในเป้า</span>'}`;
};
window.submitFailure = function(){
  const type = document.getElementById("fl-type").value, code = document.getElementById("fl-equip").value;
  let cause = document.getElementById("fl-cause").value;
  if (cause === "__other") cause = document.getElementById("fl-cause-other").value.trim();
  const s = new Date(document.getElementById("fl-start").value), e = new Date(document.getElementById("fl-end").value);
  if (!code){ showToast("กรุณาเลือกอุปกรณ์"); return; }
  if (!cause){ showToast("กรุณาระบุสาเหตุ"); return; }
  if (isNaN(s) || isNaN(e)){ showToast("กรุณาระบุเวลาเกิดเหตุและเวลาซ่อมเสร็จ"); return; }
  if (e <= s){ showToast("เวลาซ่อมเสร็จต้องอยู่หลังเวลาเกิดเหตุ"); return; }
  const hours = Math.round((e - s) / 360000) / 10;
  const entry = { id:"FU-"+Date.now(), yearBE:s.getFullYear() + 543, month:s.getMonth(), day:s.getDate(),
    startTs:s.getTime(), endTs:e.getTime(), dateLabel:fmtThaiDateTime(s.getTime()),
    tableId:type, assetCode:code, equip:(PM_TYPE_LABEL[type] || type) + " " + code, cause, hours,
    reporter:document.getElementById("fl-reporter").value.trim(), note:document.getElementById("fl-note").value.trim() };
  const list = loadUserFailures(); list.unshift(entry);
  if (!saveUserFailures(list)){ showToast("บันทึกไม่ได้ — เบราว์เซอร์นี้ไม่อนุญาตให้เก็บข้อมูล"); return; }
  rebuildFailureLog();
  closeModal();
  refreshLinkedViews();
  showToast(`บันทึกความขัดข้องแล้ว — ใช้เวลาซ่อม ${hours.toFixed(1)} ชม. (นำไปคำนวณ MTTR เดือน ${THAI_MONTHS_SHORT_KPI[entry.month]} แล้ว)`);
};

function woInMonth(year, month){

function calChip(r){
