function renderCalendarView(){
  const label = document.getElementById("calMonthLabel");
  const grid = document.getElementById("calDaysGrid");
  if (!label || !grid) return;
  const { year, month } = calMonth();
  label.textContent = `${THAI_MONTHS[month]} ${year + 543}`;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = new Date(year, month, 1).getDay(); // 0 = Sunday
  const byDay = {};
  woInMonth(year, month).filter(r => r.status !== "ยกเลิก").forEach(r => { const d = parseWoDate(r).day; (byDay[d] = byDay[d] || []).push(r); });
  // Open work first so the chips that need attention are the ones shown.
  const rank = r => r.status === "เกินกำหนด" ? 0 : r.status === "เสร็จสิ้น" ? 2 : 1;
  const now = new Date();
  const SHOW = 3;
  let html = "";
  for (let i = 0; i < startWeekday; i++) html += `<div class="cal-cell muted"></div>`;
  for (let d = 1; d <= daysInMonth; d++){
    const evs = (byDay[d] || []).sort((a, b) => rank(a) - rank(b));
    const isToday = now.getFullYear() === year && now.getMonth() === month && now.getDate() === d;
    html += `<div class="cal-cell${isToday ? " today" : ""}"><div class="d${evs.length ? " has" : ""}" ${evs.length ? `onclick="showPmDay(${d})" title="ดูงานทั้งหมดของวันนี้"` : ""}>${d}</div>${evs.slice(0, SHOW).map(calChip).join("")}${evs.length > SHOW ? `<div class="cal-more" onclick="showPmDay(${d})">+${evs.length - SHOW} งาน</div>` : ""}</div>`;
  }
  const total = startWeekday + daysInMonth;
  const rem = (7 - (total % 7)) % 7;
  for (let i = 0; i < rem; i++) html += `<div class="cal-cell muted"></div>`;
  grid.innerHTML = html;
}

function syncCalPickers(){
  const { year, month } = calMonth();
  const ys = document.getElementById("calYearPick"), ms = document.getElementById("calMonthPick"), tb = document.getElementById("calTodayBtn");
  if (ys){
    const wos = TableState["workorder"] ? TableState["workorder"].data : [];
    let lo = NOW_Y - 2, hi = NOW_Y + 1;
    wos.forEach(r => { const y = parseWoDate(r).yearBE - 543; if (y > 1900){ lo = Math.min(lo, y); hi = Math.max(hi, y); } });
    lo = Math.min(lo, year); hi = Math.max(hi, year);
    const want = Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).map(y => `<option value="${y}">${y + 543}</option>`).join("");
    if (ys.innerHTML !== want) ys.innerHTML = want;
    ys.value = String(year);
  }
  if (ms) ms.value = String(month);
  if (tb) tb.disabled = year === NOW_Y && month === NOW_M;
}

// Sample work orders sit in the current month, with dates that fit their status:
// done / overdue on or before today, pending / in progress from today on.
function demoWoDate(i, status){
  const last = new Date(NOW_Y, NOW_M + 1, 0).getDate();
  const k = (i * 37) % 120; // same walk that picks the status, so each status group gets spread-out days
  let day;
  if (status === "เสร็จสิ้น" || status === "ยกเลิก") day = 1 + ((k * 5) % Math.max(1, NOW_D));
  else if (status === "เกินกำหนด") day = 1 + ((k * 4) % Math.max(1, NOW_D - 1));
  else day = NOW_D + ((k * 3) % Math.max(1, last - NOW_D + 1));
  return `${day} ${THAI_MONTHS_SHORT_KPI[NOW_M]} ${String(NOW_BE).slice(-2)}`;
}
function makeWorkOrderRows(assetData){
  // Pull the equipment straight from the asset tables so a work order always points at a real record —
  // clicking it can jump to that exact row on the Feeder / Transformer / LBS / Substation page.
  const pool = [];
  assetData.feeder.slice(0,20).forEach(a => pool.push({ tableId:"feeder", label:"Feeder "+a.code, code:a.code }));
  assetData.transformer.slice(0,20).forEach(a => pool.push({ tableId:"transformer", label:"Transformer "+a.code, code:a.code }));
  assetData.lbs.slice(0,20).forEach(a => pool.push({ tableId:"lbs", label:"LBS "+a.code, code:a.code }));
  assetData.substation.slice(0,10).forEach(a => pool.push({ tableId:"substation", label:"Unit Substation "+a.code, code:a.code }));
  const people = ["อนพล","อนันต์","วิชัย","กิตติ","สุชาติ","มานะ"];
  const seq = statusSequence({ "รอดำเนินการ":3, "เกินกำหนด":4, "กำลังดำเนินการ":2, "เสร็จสิ้น":108, "ยกเลิก":3 });
  const cancelReasons = ["ซ้ำกับใบงานอื่นที่สร้างไว้แล้ว", "เลื่อนแผนบำรุงรักษาอุปกรณ์ตัวนี้ออกไป", "อุปกรณ์ถูกปลดออกจากระบบก่อนถึงกำหนด"];
  let cancelledSeen = 0;
  const rows = [];
  for (let i=0; i<120; i++){
    const asset = pool[i % pool.length];
    // 37 is coprime with 120, so this visits every status exactly once while spreading open
    // work orders across feeders, transformers, LBS and substations instead of bunching them.
    const status = seq[(i * 37) % seq.length];
    const cancelReason = status === "ยกเลิก" ? cancelReasons[cancelledSeen++ % cancelReasons.length] : "";
    rows.push({ id:"wo-"+i, code:"PM-"+padNum(67+i,4), equip:asset.label, assetTableId:asset.tableId, assetCode:asset.code, date:demoWoDate(i, status), owner:people[i%people.length], status, cancelReason });
  }
  return rows;
}

// Header info laid out as label|blank pairs, two pairs per row — mirrors how the
// paper forms box off "Station ID ____  GIS ____" style fields.
// On narrow screens a wide paper-form table would otherwise force the whole page to scroll
// sideways; wrapping each table lets just that table scroll instead.
function wrapPaperTablesForScroll(container){
  container.querySelectorAll("table.paper-table").forEach(t => {
    if (t.parentElement.classList.contains("table-scroll")) return;
    const wrap = document.createElement("div");
    wrap.className = "table-scroll";
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
}

function inspSampleEntries(){
  return INSP_SAMPLE.map((s, k) => {
    const d = new Date(NOW_Y, NOW_M, Math.max(1, NOW_D - Math.round(s.day * (NOW_D - 1) / 20)), 9 + (k % 6), (k * 13) % 60);
    const ds = d.toLocaleDateString("th-TH", { day:"numeric", month:"numeric", year:"numeric" });
    const e = JSON.parse(JSON.stringify(s).split("@D").join(ds));
    delete e.day; e.id = "hs" + (k + 1); e.savedAt = d.toISOString(); e.sample = true;
    return e;
  });
}
function loadInspHistory(){
  try { return JSON.parse(localStorage.getItem("insp-history") || "[]"); } catch(e){ return []; }
}
function saveInspHistory(list){
  try { localStorage.setItem("insp-history", JSON.stringify(list.slice(0, 300))); queueSync(); return true; } catch(e){ return false; }
}

let PENDING_INSP_WO = null; // { woId, idx }
function pendingWo(){
  if (!PENDING_INSP_WO || !TableState["workorder"]) return null;
  return TableState["workorder"].data.find(r => r.id === PENDING_INSP_WO.woId) || null;
}
window.startInspectionForWorkOrder = function(woId, idx){

};

function prefillInspectionFromWo(f, wo){
  if (!wo) return;
  const st = document.querySelector('.paper-wrap [data-k="station"]');
  const pl = document.querySelector('.paper-wrap [data-k="place"]');
  if (st && !st.value) st.value = wo.assetCode;
  if (pl && !pl.value && wo.place) pl.value = wo.place;
}
window.saveInspectionForm = function(code){
  if (!validateInspForm()) return;
  const inputs = paperInputs();
  const data = inputs.map(el => el.type === "radio" ? (el.checked ? 1 : 0) : el.value);
  const f = INSPECTION_FORMS.find(x => x.code === code);
  // Every labelled box on the paper (Station ID, สถานที่, MEA No., ผู้ตรวจ …) — used for the summary and asset history.
  const headerVals = {};
  document.querySelectorAll(".paper-wrap [data-h]").forEach(el => { if (el.value && !(el.dataset.h in headerVals)) headerVals[el.dataset.h] = el.value; });
  const keyVal = k => (document.querySelector(`.paper-wrap [data-k="${k}"]`) || {}).value || "";
  const photos = [...document.querySelectorAll(".paper-wrap .pf-photo")].map(b => b.dataset.src || "");
  const sigs = [...document.querySelectorAll(".paper-wrap .pf-sign")].map(b => b.dataset.src || "");
  const findings = collectInspFindings(code);
  const summary = [keyVal("station"), keyVal("place")].filter(Boolean).join(" · ") || Object.values(headerVals).slice(0, 2).join(" · ") || "(ไม่ได้ระบุข้อมูลอุปกรณ์)";
  try {
    const wo = pendingWo();
    const entry = { id: "h" + Date.now(), code, title: f ? f.title : code, data, headerVals, summary, savedAt: new Date().toISOString(), layout: PF_LAYOUT,
      photos: photos.some(Boolean) ? photos : undefined,
      sigs: sigs.some(Boolean) ? sigs : undefined, findings: findings.length ? findings : undefined,
      woId: wo ? wo.id : undefined, woCode: wo ? wo.code : undefined, assetCode: wo ? wo.assetCode : undefined, assetTableId: wo ? wo.assetTableId : undefined };
    const history = loadInspHistory();
    history.unshift(entry);
    if (!saveInspHistory(history)){
      // Browser storage is full (photos are the big part): keep the answers, drop this entry's photos.
      if (entry.photos || entry.sigs){ delete entry.photos; delete entry.sigs; if (!saveInspHistory(history)) throw new Error("storage full"); showToast("พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม — บันทึกคำตอบแล้วแต่ไม่ได้เก็บรูปภาพ"); }
      else throw new Error("storage full");
    }
    if (wo){
      wo.status = "เสร็จสิ้น"; wo.cancelReason = ""; wo.inspectionId = entry.id;
      PENDING_INSP_WO = null;
      const b = document.getElementById("insp-wo-banner"); if (b) b.remove();
      renderTable("workorder"); persistTable("workorder"); refreshLinkedViews();
      showToast(`บันทึกใบตรวจแล้ว และปิดใบงาน ${wo.code} เป็น "เสร็จสิ้น" เรียบร้อย`);
      if (!findings.length) setTimeout(() => showAfterCloseModal(wo), 350);
    } else {
      showToast(`บันทึกลงประวัติการตรวจสอบแล้ว (${summary})`);
    }
    const banner = document.getElementById("insp-saved-banner");
    if (banner) banner.remove();
    if (findings.length) setTimeout(() => openFindingsModal(entry.id), 350);
  } catch(e){
    showToast("ไม่สามารถบันทึกได้ในเบราว์เซอร์นี้");
  }
};
function getLatestInspection(code){
  return loadInspHistory().find(h => h.code === code && h.layout === PF_LAYOUT) || null;
}
function loadInspectionForm(code){
  const saved = getLatestInspection(code);

  showSavedBanner(saved.savedAt, "พบข้อมูลที่บันทึกไว้ล่าสุดเมื่อ", "— โหลดคำตอบชุดนี้ให้แล้ว (กด \"ล้างคำตอบ\" เพื่อเริ่มใบใหม่)");

function showSavedBanner(savedAt, prefix, tail){
  const wrap = document.querySelector(".paper-wrap");
  if (!wrap || !savedAt) return;
  const when = new Date(savedAt).toLocaleString("th-TH", { dateStyle:"medium", timeStyle:"short" });
  const banner = document.createElement("div");
  banner.id = "insp-saved-banner";
  banner.style.cssText = "margin:0 0 14px; padding:10px 14px; border-radius:10px; background:var(--brand-soft); color:var(--brand-ink); font-size:12.5px; font-weight:600;";
  banner.textContent = `${prefix} ${when} ${tail || "— โหลดคำตอบชุดนี้ให้แล้ว"}`;
  wrap.insertBefore(banner, wrap.firstChild);
}

  const PAGE = 15, pages = Math.max(1, Math.ceil(list.length / PAGE)); F.page = Math.min(Math.max(1, F.page), pages);

window.exportInspectionHistory = async function(){
  const history = loadInspHistory();

  const aoa = [["วันที่บันทึก", "รหัสแบบฟอร์ม", "ชื่อแบบฟอร์ม", "ข้อมูลอุปกรณ์", "ใบงาน"]];

    h.code, h.title, h.summary || "", h.woCode || "",
  ]));
  const gotLib = await getXLSXLib();
  if (gotLib && typeof XLSX !== "undefined"){
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = aoa[0].map((_, i) => ({ wch: Math.max(14, ...aoa.map(r => String(r[i] ?? "").length)) + 2 }));

  }
  const ok = await saveFile("inspection-history.csv", aoaToCSV(aoa), "text/csv;charset=utf-8");
  if (ok) showToast("ไม่สามารถโหลดตัวสร้างไฟล์ Excel ได้ จึงส่งออกเป็น CSV แทน");
};

/* ===================== PAPER FORMS — exact replicas of the printed SF-07-0-015 … 025 =====================
   Every sheet is rebuilt cell-for-cell from its original A4 PDF: the same numbered sections, rows,
   wording (including the originals' own spellings), check boxes per row and column proportions
   (measured from the PDFs). Layout model: a sheet holds one outer table — section number | section
   body — and each body stacks one-row tables ("pt") whose own column widths reproduce the paper's
   uneven grid. Answers are saved by field order, so PF_LAYOUT marks which layout a save belongs to. */
const PF_LAYOUT = 2;
let pfSeq = 0;
const pfName = () => "pf" + (++pfSeq);
const pfStrip = s => String(s).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
function pfIn(h, k, cls){ return `<input type="text" class="pf-in${cls ? " " + cls : ""}"${h ? ` data-h="${pfStrip(h)}"` : ""}${k ? ` data-k="${k}"` : ""}>`; }
function pfLF(label, h, k){ return `<div class="pf-lf"><span class="pf-wl">${label}</span>${pfIn(h || label, k)}</div>`; }
function pfBox(name){ return `<label class="pf-box"><input type="radio" name="${name}"><span></span></label>`; }
function pfOpt(name, text){ return `<label class="pf-opt"><input type="radio" name="${name}"><span class="pf-sq"></span>${text}</label>`; }
function pfBrk(name, text){ return `<label class="pf-brk"><input type="radio" name="${name}"><span class="pf-b">[<i></i>]</span>${text}</label>`; }
function pfUl(w, h){ return `<input type="text" class="pf-ul" style="width:${w}"${h ? ` data-h="${h}"` : ""}>`; }
const pfCols = ws => `<colgroup>${ws.map(w => `<col style="width:${w}%">`).join("")}</colgroup>`;
// One-row table. cells: [{ w:%, html, cls }]
function pfRow(cells, cls){
  return `<table class="pt${cls ? " " + cls : ""}">${pfCols(cells.map(c => c.w))}<tr>${cells.map(c => `<td${c.cls ? ` class="${c.cls}"` : ""}>${c.html ?? ""}</td>`).join("")}</tr></table>`;
}
// Info row shorthand: ["L", label, w, extraCls] · ["F", w, dataKey] · ["W", "label+field", w] · ["X", html, w, cls]
function pfInfo(spec){
  let last = "";
  return pfRow(spec.map(([t, a, b, c]) => {
    if (t === "L"){ last = a; return { w:b, html:a, cls:"pf-l" + (c ? " " + c : "") }; }
    if (t === "F") return { w:a, html:pfIn(last, b) };
    if (t === "W") return { w:b, html:pfLF(a, last + " " + a) };
    return { w:b, html:a || "", cls:c || "" };
  }));
}
const pfTitleRow = (text, cls) => pfRow([{ w:100, html:text, cls:"pf-gray " + (cls || "b") }]);
function pfNotes(title, titleW, lines, cls){
  const h = pfStrip(title).replace(/\s*:$/, "");
  return pfRow([{ w:titleW, html:title, cls:"pf-glabel " + (cls || "b u") }, { w:100 - titleW, html:pfIn(h) }])
    + Array.from({ length: lines }, () => pfRow([{ w:100, html:pfIn(h) }])).join("");
}
function pfSig(ws){
  return [["ผู้ตรวจ","ผู้ตรวจสอบ"],["ตำแหน่ง","ตำแหน่ง"],["วันที่","วันที่"]].map(([a, b], i) => pfRow([
    { w:ws[0], html:a, cls:"pf-l" }, { w:ws[1], html:pfIn(i ? `${a} (ผู้ตรวจ)` : a) + (i ? "" : pfSignBtn(a)), cls:i ? "" : "pf-sigcell" },
    { w:ws[2], html:b, cls:"pf-l" }, { w:ws[3], html:pfIn(i ? `${b} (ผู้ตรวจสอบ)` : b) + (i ? "" : pfSignBtn(b)), cls:i ? "" : "pf-sigcell" }])).join("");
}
/* Checklist (forms 015–020). items: "2.1|Drop Fuse|111" (boxes under ปกติ/ชำรุด/ไม่มี) ·
   "#<u>RMU</u>|001" sub-heading (with any boxes) · "#!…" sub-heading spanning the result columns ·
   "CAP" the capacitor-bank Cap Off / Cap On time row. */
function pfChecklist(ws, items, gap){
  const head = `<tr class="b"><td rowspan="2" class="c">รายการ</td><td colspan="3" class="c">ผลการตรวจสอบ</td><td rowspan="2" class="c">ข้อบกพร่อง</td></tr><tr class="b"><td class="c">ปกติ</td><td class="c">ชำรุด</td><td class="c">ไม่มี</td></tr>`;
  const rows = items.map(it => {
    if (it === "CAP") return `<tr><td>${pfLF("เวลา Cap Off :", "เวลา Cap Off")}</td><td colspan="3">${pfLF("เวลา Cap On :", "เวลา Cap On")}</td><td></td></tr>`;
    const [a, b, c] = it.split("|");
    if (a.startsWith("#!")) return `<tr><td colspan="4">${a.slice(2)}</td><td></td></tr>`;
    const name = pfName();
    const heading = a.startsWith("#");
    const mask = heading ? (b || "000") : c;
    const boxes = [0, 1, 2].map(i => `<td class="c">${mask[i] === "1" ? pfBox(name) : ""}</td>`).join("");
    if (heading) return `<tr><td>${a.slice(1)}</td>${boxes}<td></td></tr>`;
    return `<tr><td><span class="pf-n${gap ? " gap" : ""}">${a}</span>${b}</td>${boxes}<td>${pfIn("")}</td></tr>`;
  }).join("");
  return `<table class="pt pf-cl">${pfCols(ws)}${head}${rows}</table>`;
}
// "- สถานะสวิตช์   [ ] ปลด   [ ] สับ" rows (LBS / Sectionalizer)
function pfStatus(ws, rows, minH){
  return `<table class="pt pf-plain"${minH ? ` style="height:${minH}px"` : ""}>${pfCols(ws)}${rows.map(([l, o1, o2]) => {
    const n = pfName();
    return `<tr><td>&nbsp;&nbsp;&nbsp;- ${l}</td><td>${pfBrk(n, o1)}</td><td>${pfBrk(n, o2)}</td></tr>`;
  }).join("")}</table>`;
}
// Current / voltage measurement block (forms 015 and 019 page 2)
function pfMeasure(vLabel, aLabel, r1, r2){
  const n1 = pfName(), n2 = pfName();
  const sub = s => s.replace(/^([VI])([^=]+)=$/, "$1<sub>$2</sub>=");
  const cell = (s, w) => ({ w, html:pfLF(sub(s), s.replace("=", "")) });

  + pfRow([{ w:r2[0], html:aLabel }, cell("IN=", r2[1]), cell("I1=", r2[2]), cell("I2=", r2[3]), cell("I3=", r2[4]),
      { w:r2[5] + r2[6], html:pfLF("ผลรวมกระแสหน้าหม้อแปลงฯ ทั้งหมด", "ผลรวมกระแสหน้าหม้อแปลง"), cls:"sm" }]);
}
function pfPhoto(label){

function pfNetworkTable(ws, critSpan, groups, lastHead){
  const head = `<tr class="b"><td rowspan="2" class="c">${ws.length === 7 ? "ลำ<br>ดับ" : "ลำดับ"}</td><td rowspan="2" class="c">รายการ</td><td rowspan="2" colspan="${critSpan}" class="c">เกณฑ์</td><td colspan="2" class="c xs">ผลตรวจสอบ</td><td rowspan="2" class="c">ข้อบกพร่อง</td><td rowspan="2" class="c wrap">${lastHead}</td></tr><tr class="b"><td class="c xs">ปกติ</td><td class="c xs" style="padding:0;">ไม่ปกติ</td></tr>`;
  const resultCells = () => { const n = pfName(); return `<td class="c">${pfBox(n)}</td><td class="c">${pfBox(n)}</td><td>${pfIn("")}</td><td>${pfIn("")}</td>`; };
  const crit = c => {
    if (Array.isArray(c) && c[0] === "OPT"){ const n = pfName(); return `<td colspan="${critSpan}" class="sm">${pfOpt(n, c[1])}<span class="pf-gap sm"></span>${pfOpt(n, c[2])}</td>`; }
    if (Array.isArray(c)) return `<td class="xs">${c[0]}</td><td class="c">${pfBox(pfName())}</td><td class="xxs">${c[1]}</td>`;
    return `<td colspan="${critSpan}" class="xs">${c}</td>`;
  };
  let rows = "";
  groups.forEach(g => {
    if (g.single){ rows += `<tr><td class="c">${g.n}</td><td>${g.t}</td>${crit(g.crit)}${resultCells()}</tr>`; return; }
    const span = 1 + g.items.length;
    rows += `<tr><td class="c" rowspan="${span}" style="vertical-align:top;">${g.n}</td><td class="b">${g.t}</td>`
      + (g.note ? `<td colspan="${critSpan + 2}" class="xs b u">${g.note}</td>` : `<td colspan="${critSpan}"></td><td></td><td></td>`)
      + `<td></td><td></td></tr>`;
    g.items.forEach(([t, c]) => { rows += `<tr><td>${t}</td>${crit(c)}${resultCells()}</tr>`; });
  });
  return `<table class="pt pf-net">${pfCols(ws)}${head}${rows}</table>`;
}

function renderInspectionDetail(f){
  pfSeq = 0;
  const build = PF_FORMS[f.code];

}

/* ---- photos (024 / 025): downscaled JPEG kept with the saved inspection ---- */
function setInspPhoto(box, data){
  box.dataset.src = data || "";
  box.innerHTML = data ? `<img src="${data}" alt="${box.dataset.h || "ภาพถ่าย"}">` : `<span class="pf-photo-hint">แตะเพื่อแนบรูป / ถ่ายภาพ</span>`;
}
window.pickInspPhoto = function(box){
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*";
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      setInspPhoto(box, cv.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); showToast("เปิดไฟล์รูปนี้ไม่ได้"); };
    img.src = url;
  };
  input.click();
};
function clearInspectionFormSilently(){
  paperInputs().forEach(el => { if (el.type === "radio" || el.type === "checkbox") el.checked = false; else el.value = ""; });
  document.querySelectorAll(".paper-wrap .pf-photo").forEach(b => setInspPhoto(b, ""));
  document.querySelectorAll(".paper-wrap .pf-sign").forEach(b => setSign(b, ""));
  document.querySelectorAll(".paper-wrap .pf-missing").forEach(el => el.classList.remove("pf-missing"));
}
window.clearInspectionForm = function(){
  clearInspectionFormSilently();
  const banner = document.getElementById("insp-saved-banner"); if (banner) banner.remove();
  prefillInspector();
  showToast("ล้างคำตอบในแบบฟอร์มแล้ว (ประวัติที่บันทึกไว้ยังอยู่)");
};
// Fill the open form from a saved entry. Returns false for saves made with the older layout.
function applyInspEntry(h){
  if (!h || h.layout !== PF_LAYOUT) return false;
  const inputs = paperInputs();
  (h.data || []).forEach((v, i) => {
    const el = inputs[i]; if (!el) return;
    if (el.type === "radio" || el.type === "checkbox") el.checked = !!v; else el.value = v;
  });
  document.querySelectorAll(".paper-wrap .pf-photo").forEach((b, i) => setInspPhoto(b, (h.photos || [])[i] || ""));
  document.querySelectorAll(".paper-wrap .pf-sign").forEach((b, i) => setSign(b, (h.sigs || [])[i] || ""));
  return true;
}
// Paper-style check boxes are radios (one answer per row) but must also be un-tickable, like a pen mark.
document.addEventListener("pointerdown", e => {
  const lab = e.target.closest && e.target.closest(".paper-wrap label");
  const inp = lab ? lab.querySelector("input[type=radio]") : null;
  if (inp) inp.dataset.was = inp.checked ? "1" : "";
}, true);
document.addEventListener("click", e => {
  const inp = e.target;
  if (!(inp instanceof HTMLInputElement) || inp.type !== "radio" || !inp.closest(".paper-wrap")) return;
  if (inp.dataset.was === "1"){ inp.checked = false; }
  inp.dataset.was = "";
});
// Oil test (023): average fills itself from the five readings.
document.addEventListener("input", e => {
  if (!e.target.classList || !e.target.classList.contains("pf-oil")) return;
  const tr = e.target.closest("tr");
  const vals = [...tr.querySelectorAll(".pf-oil")].map(x => parseFloat(x.value)).filter(v => !isNaN(v));
  const avg = tr.querySelector(".pf-oil-avg");
  if (avg) avg.value = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : "";
});

  { code:"SW-OH-3-078", title:"การบำรุงรักษา Ring Main Unit",

  { code:"SW-OH-3-080", title:"การบำรุงรักษา Capacitor Bank 12-24 kV ในสายป้อน",

    work:["1. ตรวจสอบข้อมูลทั่วไปของ Capacitor Bank 12-24 kV ในสายป้อน","2. ตรวจสอบบำรุงรักษาสภาพทั่วไป ตามข้อกำหนด",
      "## สภาพอุปกรณ์ประกอบ","2.1 Drop Fuse : ไม่มีรอยแตกร้าว/ชำรุด","2.2 Station Post Type Insulator : ไม่มีรอยแตกร้าว/ชำรุด","2.3 สายเข้า-ออก Drop Fuse : ไม่มีจุดชำรุดรอยไหม้","2.4 คอนสาย : ไม่เอียง/บิดเบี้ยว","2.5 อุปกรณ์ป้องกันสัตว์ : ไม่ชำรุด","2.6 กับดักฟ้าผ่า : ไม่มีรอยแตกร้าว/ชำรุด","2.7 ตัวถังหม้อแปลง : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.8 Cover (Bushing, L/A, Term kit.) : ครอบจุดต่อสายได้สนิทสามารถป้องกันสัตว์ได้","2.9 H.V. Ground : มีต่อเข้ากับตัวถัง Capacitor และ L/A",
      "## อุปกรณ์ควบคุม (สำหรับสถานี Switching Capacitor Bank)","2.10 Vacuum CB : ไม่มีรอยแตกร้าว/ชำรุด","2.11 Supply : มีแรงดันตามที่กำหนด","2.12 Fuse Control ภายในตู้ : ไม่ขาด","2.13 หลอดไฟแสดงสถานะในตู้ : ติดแสดงสถานะถูกต้อง","2.14 หน้าจอ Digital Control : ติดแสดงค่าถูกต้องเห็นชัดเจน","2.15 เสียงนาฬิกาเดิน : ทำงานถูกต้อง","2.16 อุปกรณ์ทั่วไปภายในตู้ : ไม่ชำรุด",
      "## Capacitor Cell","2.17 ตัวถังคาปาซิเตอร์ : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.18 Bushing : ไม่มีรอยแตกร้าว/ชำรุด","2.19 Fuse ภายใน : ไม่ขาด",
      "3. การวัดค่าคาปาซิแตนซ์",
      "## 3.1 กรณี Fixed Capacitor","3.1.1 ติดต่อประสานงานศูนย์สั่งการฯ เพื่อหยุดการทำงานของรีโคลสซิ่งรีเลย์ (Off RR.) และขอปลด DF ลง Capacitor Bank","3.1.2 ปลด DF ทั้ง 3 เฟสด้วยโหลดบัสเตอร์และนำกระบอกฟิวส์ลง","3.1.3 ปลด Hot Line Clamp ทั้ง 3 เฟส (ปลดเฟสไกลมาใกล้) แล้วรอ 10 นาที ก่อนทำงาน","3.1.4 สวมถุงมือยางทับด้วยถุงมือหนัง คายประจุ Capacitor โดย By pass ลงกราวด์ทีละเฟสทั้ง 3 เฟส","3.1.5 วัดค่าคาปาซิแตนซ์ที่ Capacitor แต่ละตัว ค่าที่ได้ต้องอยู่ในค่า ± 10% ของ Nameplate ที่กำหนดไว้","3.1.6 หากค่าไม่ได้ตามที่กำหนด ให้วางแผนเปลี่ยน Capacitor ตัวที่ชำรุดต่อไป","3.1.7 เมื่อปกติทุกตัว ติดตั้ง Hot Line Clamp เข้ากับ Stirrup Clamp","3.1.8 นำกระบอกฟิวส์ไปแขวนที่ DF แล้วสับเข้าจากเฟสใกล้ไปหาไกล","3.1.9 แจ้งศูนย์สั่งการฯ เพื่อให้รีโคลสซิ่งรีเลย์ทำงาน (On RR.)",
      "## 3.2 กรณี Switching Capacitor","3.2.1 ติดต่อประสานงานศูนย์สั่งการฯ เพื่อหยุดการทำงานของรีโคลสซิ่งรีเลย์ (Off RR.) และขอปลด Vacuum CB ลง Capacitor Bank","3.2.2 ปลด Vacuum CB ลง Capacitor Bank","3.2.3 ปลด DF ทั้ง 3 เฟสและนำกระบอกฟิวส์ลง","3.2.4 ปลด Hot Line Clamp ทั้ง 3 เฟส (ปลดเฟสไกลมาใกล้) แล้วรอ 10 นาที ก่อนทำงาน","3.2.5 สวมถุงมือยางทับด้วยถุงมือหนัง คายประจุ Capacitor โดย By pass ลงกราวด์ทีละเฟสทั้ง 3 เฟส","3.2.6 วัดค่าคาปาซิแตนซ์ที่ Capacitor แต่ละตัว ค่าที่ได้ต้องอยู่ในค่า ± 10% ของ Nameplate ที่กำหนดไว้","3.2.7 หากค่าไม่ได้ตามที่กำหนด ให้วางแผนเปลี่ยน Capacitor ตัวที่ชำรุดต่อไป","3.2.8 เมื่อปกติทุกตัว ติดตั้ง Hot Line Clamp เข้ากับ Stirrup Clamp","3.2.9 นำกระบอกฟิวส์ไปแขวนที่ DF แล้วสับเข้าจากเฟสใกล้ไปหาไกล","3.2.10 สับ Vacuum CB ลง Capacitor Bank","3.2.11 แจ้งศูนย์สั่งการฯ เพื่อให้รีโคลสซิ่งรีเลย์ทำงาน (On RR.)"]
  },
  { code:"SW-OH-3-081", title:"การบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของเครื่องป้องกันหม้อแปลงวงจรตาข่าย","2. ตรวจสอบบำรุงรักษาสภาพภายนอก ตามข้อกำหนด",
      "2.1 สถานะ MV.SW. : อยู่ในสถานะ CLOSE","2.2 สถานะ NP : อยู่ในสถานะ CLOSE","2.3 เบอร์ตู้/สีตู้ : ชัดเจน ไม่ลอก","2.4 ระบบกราวด์ : มีทั้งกราวด์ N และ G","2.5 อุปกรณ์ป้องกันแรงดันเกินภายนอก : มีทั้งด้าน N และ T ไม่ชำรุด","2.6 ตัวถัง รอยต่อหม้อแปลง : ไม่เสียหาย/ไม่มีน้ำมันรั่วซึม","2.7 ฝาตู้ : ปิดแน่นสนิท","2.8 การแขวนป้ายแดงห้ามปลด-สับ : ให้ตรวจสอบว่ามีหรือไม่",
      "3. ทดสอบโดยปลด-สับ MV.SW.","3.1 ใช้ขอยาวปลด MV.SW. ครั้งที่ 1 : สถานะ NP ต้องเปลี่ยนจาก CLOSE เป็น OPEN","3.2 ใช้ขอยาวสับ MV.SW. ครั้งที่ 1 : สถานะ NP ต้องเปลี่ยนจาก OPEN เป็น CLOSE","3.3 ใช้ขอยาวปลด MV.SW. ครั้งที่ 2 : สถานะ NP ต้องเปลี่ยนจาก CLOSE เป็น OPEN","3.4 หากสถานะไม่เปลี่ยนตามที่กำหนด ให้ปลด MV.SW. แล้วขึ้นไปเปิดฝาตู้เพื่อตรวจสอบซ่อมแซมอุปกรณ์ต่อไป",
      "4. ตรวจสอบสภาพภายในตู้","4.1 ตรวจสอบสภาพอุปกรณ์ภายใน : ไม่มีน้ำหรือหยดน้ำเกาะ/อุปกรณ์ไม่ชำรุดเสียหาย","4.2 ตรวจสอบสภาพรีเลย์ : อยู่ในสถานะที่ถูกต้อง",
      "5. ตรวจสอบอุปกรณ์ส่งข้อมูลระยะไกล","5.1 ตู้อุปกรณ์ : ไม่ชำรุดเสียหาย","5.2 ไฟเลี้ยง/CB & FUSE : มีไฟเลี้ยง/CB&FUSE สับอยู่","5.3 อินเตอร์เน็ตสวิทซ์ : ไม่ชำรุดเสียหาย",
      "6. สับ SW.แรงกลาง เมื่อลงจากเสาแล้ว : สถานะ NP ต้องเปลี่ยนจาก OPEN เป็น CLOSE"]
  },
  { code:"SW-OH-3-082", title:"การบำรุงรักษาหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของหม้อแปลงวงจรตาข่ายและสวิตช์แรงกลาง","2. ตรวจสอบบำรุงรักษาสภาพทั่วไป ตามข้อกำหนด",
      "## สวิทซ์แรงกลาง","2.1 สภาพภายนอก : ตัวถังไม่ฉีกขาดหรือบวม","2.2 สถานะก๊าซ SF6 : มีก๊าซ SF6 อยู่ในเกณฑ์ ตรวจสอบได้จากตัวแสดงสถานะ","2.3 หัวต่อสาย/สายไฟฟ้า : ไม่มีรอยบิ่น ไหม้ หรือแตกร้าว","2.4 ระบบกราวด์ : มีกราวด์ทั้งแรงสูง แรงต่ำ",
      "## หม้อแปลง","2.5 ตัวถัง : ไม่มีรอยแตก บุบ ฉีกขาด","2.6 น้ำมัน : ไม่รั่วไหล อยู่ในระดับที่กำหนด","2.7 ฟิวส์ 12 kV : ไม่ชำรุด","2.8 อุณหภูมิสูงสุด : ไม่เกิน 90 °C","2.9 อุณหภูมิจริง : ไม่เกิน 90 °C",
      "## ด้านแรงต่ำ","2.10 สายไฟฟ้า : ไม่มีจุดชำรุดเสียหาย","2.11 คาปาซิเตอร์แรงต่ำ : ไม่มีจุดชำรุดเสียหาย",
      "3. วัดกระแสไฟฟ้าด้านแรงกลาง 12 kV","3.1 ใช้ Clamp On Meter คล้องที่สายแรงกลางทีละเฟส บันทึกค่า","3.2 ค่ากระแสไฟฟ้าที่วัดได้ต้องไม่เกิน 25 A",
      "4. วัดกระแสไฟฟ้าเข้าคาปาซิเตอร์แรงต่ำ","4.1 ใช้ Clamp On Meter คล้องที่สายแรงกลางทีละเฟส บันทึกค่า","4.2 คาปาซิเตอร์ 25 kVAR : ค่ากระแสไฟฟ้าต้องอยู่ระหว่าง 28A-40A","4.3 คาปาซิเตอร์ 50 kVAR : ค่ากระแสไฟฟ้าต้องอยู่ระหว่าง 57A-80A","4.4 คาปาซิเตอร์ 75 kVAR : ค่ากระแสไฟฟ้าต้องอยู่ระหว่าง 86A-119A",
      "5. วัดแรงดันไฟฟ้าด้านแรงต่ำ","5.1 วัดแรงดันไฟฟ้าทีละเฟสเทียบนิวทรัล บันทึกค่า","5.2 ค่าแรงดันไฟฟ้าเฟสเทียบนิวทรัลต้องอยู่ระหว่าง 214V-237V","5.3 วัดแรงดันไฟฟ้าเฟส 1-2, 1-3, 2-3 บันทึกค่า","5.4 ค่าแรงดันไฟฟ้าระหว่างเฟสต้องอยู่ระหว่าง 371V-410V",
      "6. วัดกระแสไฟฟ้าด้านแรงต่ำ","6.1 กำหนดทิศทางชุดสายแรงต่ำ (ยืนบนถนนหันหน้าเข้าหม้อแปลง)","6.2 คล้องที่สายแรงต่ำทีละชุด แต่ละเฟส บันทึกค่า","6.3 กระแสไฟฟ้าต้องไม่เกิน 400 A ต่อสายไฟฟ้าที่ออกจากหลักโมล"]
  },
  { code:"SW-OH-3-083", title:"การบำรุงรักษาทดสอบและกรองน้ำมันหม้อแปลงวงจรตาข่าย",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"KYT มองหาจุดอันตรายก่อนปฏิบัติงาน"],
    work:["1. ปลดสวิตช์แรงกลางด้วยขอยาว","2. ตรวจสอบ Network Protector ว่าอยู่ในสถานะปลดแล้ว หากไม่ ให้ Manual Handle ของ NP ไปที่ตำแหน่ง OPEN แล้วตรวจสอบสถานะ","3. ปรับ Manual Handle ของ Network Protector ไปที่ตำแหน่ง OPEN ตลอดการทำงานจนกว่าจะจ่ายไฟฟ้าเข้าหม้อแปลง","4. เตรียมภาชนะรองรับน้ำมัน ขันก็อกด้านล่างของหม้อแปลงวงจรตาข่าย ให้น้ำมันไหลสู่ภาชนะปริมาณที่เหมาะสม แล้วหมุนปิดก็อก นำน้ำมันใส่เครื่องทดสอบความเป็นฉนวน ปรับระยะห่างขั้วประจุไฟฟ้าตามที่กำหนด",
      "5. การทดสอบน้ำมันหม้อแปลงและกรองน้ำมันหม้อแปลง","5.1 เปิดเครื่องทดสอบน้ำมันหม้อแปลง แล้วกดปุ่มทดสอบ","5.2 ทดสอบครั้งที่ 1 ถ้าค่าต่ำกว่า 26 kV ดำเนินการกรองน้ำมันครั้งที่ 1","5.3 ทดสอบครั้งที่ 1 ถ้าค่าสูงกว่า 26 kV ให้ทดสอบครบ 5 ครั้งแล้วหาค่าเฉลี่ย — ถ้าค่าเฉลี่ยต่ำกว่า 26 kV กรองน้ำมันครั้งที่ 1 — ถ้าสูงกว่า 26 kV ไม่ต้องกรอง น้ำมันหม้อแปลงปกติ เตรียมจ่ายไฟฟ้ากลับ","5.4 เมื่อกรองน้ำมันครั้งที่ 1 แล้ว ทดสอบความเป็นฉนวนของน้ำมันใหม่","5.5 เตรียมภาชนะรองรับน้ำมันและทดสอบซ้ำตามขั้นตอนเดิม","5.6 ทดสอบหลังกรองครั้งที่ 1 ถ้าค่าต่ำกว่า 26 kV ดำเนินการกรองน้ำมันครั้งที่ 2","5.7 ทดสอบหลังกรองครั้งที่ 1 ถ้าค่าสูงกว่า 26 kV ให้ทดสอบครบ 5 ครั้งแล้วหาค่าเฉลี่ย — ถ้าต่ำกว่า 26 kV กรองน้ำมันครั้งที่ 2 — ถ้าสูงกว่า 26 kV ไม่ต้องกรอง น้ำมันปกติ เตรียมจ่ายไฟฟ้ากลับ","5.8 เมื่อกรองน้ำมันครั้งที่ 2 แล้ว ทดสอบความเป็นฉนวนของน้ำมันใหม่","5.9 เตรียมภาชนะรองรับน้ำมันและทดสอบซ้ำตามขั้นตอนเดิม","5.10 ทดสอบครบ 5 ครั้งแล้วหาค่าเฉลี่ย — ถ้าต่ำกว่า 26 kV ห้ามสับจ่ายสวิตช์แรงกลาง แขวนป้ายแดง วางแผนเปลี่ยนหม้อแปลงใหม่ — ถ้าสูงกว่า 26 kV น้ำมันหม้อแปลงปกติ เตรียมจ่ายไฟฟ้ากลับ",
      "6. การจ่ายไฟฟ้ากลับ","6.1 ปรับ Manual Handle ของ Network Protector จาก OPEN ไปที่ AUTO","6.2 สับสวิตช์แรงกลางด้วยขอยาว ตรวจสอบสภาพหม้อแปลงปกติ","6.3 ตรวจสอบสถานะ Network Protector จาก OPEN เป็น CLOSE","6.4 หากไม่เปลี่ยนเป็น CLOSE ให้ Manual Handle ไปที่ CLOSE หากยังไม่เปลี่ยน ให้ปรับไปที่ OPEN ปลดสวิตช์แรงกลางออก แขวนป้ายแดง แจ้งกลุ่มงานดำเนินการซ่อมแซม Network Protector ต่อไป"]
  },
  { code:"SW-OH-3-084", title:"การตรวจสอบจุดร้อนแดงด้วยกล้อง Thermovision", objective: WI_OBJECTIVE_INSPECT,
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน"],
    work:["1. เปิดกล้อง Thermovision","2. เปิดฝาเลนส์","3. Set ค่า Parameter ต่างๆ ของกล้องให้ถูกต้อง เพื่อชดเชยปัจจัยที่มีผลต่อการวัด เช่น ระยะห่างจากตัวกล้อง (Distance), อุณหภูมิแวดล้อม (Ambient Temperature), อุณหภูมิสะท้อนกลับ (Reflect Temperature), ความชื้นสัมพัทธ์ (Relative Humidity)","4. เล็งกล้องไปยังวัตถุที่ต้องการตรวจ","5. ปรับโฟกัสภาพให้คมชัด","6. เลือก Range (ย่านวัด) ที่ถูกต้อง","7. ปรับ Level และ Span (ความแตกต่างของแสงและความสว่างของภาพ) ปรับภาพให้มีหลายสี","8. หาจุดร้อนแดงบนวัตถุที่กำลังตรวจสอบ","9. บันทึกค่าอุณหภูมิและเฟสที่เกิดร้อนแดงลงในแบบรายงานผลการตรวจสอบจุดร้อนแดง (Hot Spot)","10. บันทึกค่าอุณหภูมิของอุปกรณ์ประเภทเดียวกันของเฟสข้างเคียงที่อยู่ในสภาพปกติลงในแบบรายงาน","11. บันทึกค่า Delta-T ลงในแบบรายงาน","12. วิเคราะห์ค่า Delta-T ที่ได้ จัดลำดับความสำคัญตามข้อเสนอแนะและหาสาเหตุเพื่อการปรับปรุงแก้ไขต่อไป"],

    svg.dataset.i = i;

  const hit = el.querySelector("#iHit");

function pfCellText(td){ return td ? [...td.childNodes].map(n => n.textContent).join(" ").replace(/\s+/g, " ").trim() : ""; }
// Read what the open form flags as abnormal, straight from the paper (no per-form tables to keep in sync).
function collectInspFindings(code){
  const wrap = document.querySelector(".paper-wrap"); if (!wrap) return [];
  const out = [];
  const add = (item, defect) => out.push(defect ? `${item} — ${defect}` : item);
  // 015–020: ปกติ | ชำรุด | ไม่มี — the middle box means damaged
  wrap.querySelectorAll("table.pf-cl tr").forEach(tr => {
    const tds = tr.children; if (tds.length < 5) return;
    const bad = tds[2].querySelector("input[type=radio]");
    if (bad && bad.checked){
      const def = tds[4] ? (tds[4].querySelector("input") || {}).value : "";
      add(pfCellText(tds[0]), (def || "").trim());
    }
  });
  // 021 / 022: … | ปกติ | ไม่ปกติ | ข้อบกพร่อง | การดำเนินการ
  wrap.querySelectorAll("table.pf-net tr").forEach(tr => {
    const tds = [...tr.children]; if (tds.length < 6) return;
    const badCell = tds[tds.length - 3], okCell = tds[tds.length - 4];
    if (!okCell.querySelector("input[type=radio]")) return;
    const bad = badCell.querySelector("input[type=radio]");
    if (bad && bad.checked){
      const name = pfCellText(/^\d+$/.test(pfCellText(tds[0])) ? tds[1] : tds[0]);
      add(name, ((tds[tds.length - 2].querySelector("input") || {}).value || "").trim());
    }
  });
  // 023: the last average actually measured is still below 26 kV
  const avgs = [...wrap.querySelectorAll(".pf-oil-avg")].map(el => parseFloat(el.value)).filter(v => !isNaN(v));
  if (avgs.length && avgs[avgs.length - 1] < 26) add(`ค่า Breakdown Voltage เฉลี่ย ${avgs[avgs.length - 1].toFixed(1)} kV ต่ำกว่า 26 kV`);
  // 024: priority 1–2 or a Delta T above 20 °C
  if (code === "SF-07-0-024"){
    const pr = parseInt((wrap.querySelector('[data-h="ลำดับความสำคัญ"]') || {}).value, 10);
    const dts = [...wrap.querySelectorAll("input[data-h^='Delta T '].pf-in")].map(el => parseFloat(el.value)).filter(v => !isNaN(v));
    const maxDt = dts.length ? Math.max(...dts) : NaN;
    if (pr === 1 || pr === 2 || maxDt > 20){
      const adv = ((wrap.querySelector('[data-h="ข้อแนะนำการแก้ไข"]') || {}).value || "").trim();
      add(`Hot Spot${pr ? " ลำดับความสำคัญ " + pr : ""}${!isNaN(maxDt) ? ` (Delta T สูงสุด ${maxDt} °C)` : ""}`, adv);
    }
  }
  // 025: severity สูงมาก / สูง
  if (code === "SF-07-0-025"){
    const sev = wrap.querySelector(".pf-sev"), chk = sev ? sev.parentElement.querySelector("input:checked") : null;
    const sel = chk ? pfCellText(chk.closest("label")) : "";
    if (sel === "สูงมาก" || sel === "สูง"){
      const spot = (wrap.querySelector('[data-h="จุดที่ผิดปกติ"]') || {}).value || "";
      add(`Partial Discharge ระดับความรุนแรง${sel}`, spot.trim());
    }
  }
  return out;
}

function fillGpsCoords(btn, lng){
  const lat = lng.closest(".paper-wrap").querySelector('input[data-h="Lat."]');
  if (!lat) return;
  if (!navigator.geolocation){ showToast("อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง"); return; }
  if (!window.isSecureContext){ showToast("ต้องเปิดเว็บผ่าน https:// จึงจะดึงพิกัดได้"); return; }
  if (btn.classList.contains("busy")) return;
  btn.classList.add("busy"); btn.querySelector("span").textContent = "กำลังหา…";
  const done = txt => { btn.classList.remove("busy"); btn.querySelector("span").textContent = txt; };
  navigator.geolocation.getCurrentPosition(pos => {
    const set = (el, v) => { el.value = v; el.dispatchEvent(new Event("input", { bubbles:true })); };
    set(lat, pos.coords.latitude.toFixed(6)); set(lng, pos.coords.longitude.toFixed(6));
    btn.classList.add("done"); done("พิกัด");
    showToast(`ใส่พิกัดแล้ว ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} (คลาดเคลื่อน ±${Math.round(pos.coords.accuracy)} ม.)`);
  }, err => {
    done("พิกัด");
    showToast(err.code === 1 ? "ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง — เปิด Location และอนุญาตให้เว็บนี้ใช้ตำแหน่งในเบราว์เซอร์"
      : err.code === 3 ? "หาตำแหน่งไม่ทันเวลา — ลองออกไปที่โล่งแล้วกดอีกครั้ง" : "ดึงตำแหน่งไม่สำเร็จ — ตรวจว่าเปิด GPS/Location อยู่");
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}

function findAssetByCode(code){
  if (!code) return null;
  const c = code.trim().toUpperCase();
  for (const t of ["transformer", "lbs", "substation", "feeder"]){
    const a = (ASSET_DATA[t] || []).find(r => String(r.code).toUpperCase() === c);
    if (a) return { tableId:t, asset:a };
  }
  return null;
}
function inspAssetFor(entry){
  if (entry.assetTableId && entry.assetCode) return { tableId:entry.assetTableId, code:entry.assetCode };
  const station = (entry.headerVals || {})["Station ID"] || (entry.headerVals || {})["STATION ID"] || "";
  const hit = findAssetByCode(station);
  if (hit) return { tableId:hit.tableId, code:hit.asset.code };
  const idx = INSPECTION_FORMS.findIndex(f => f.code === entry.code);
  return { tableId:INSPECTION_ASSET_LINK[idx] || "", code:station.trim() };
}

function pfSignBtn(who){ return `<span class="pf-sign" data-who="${who}" onclick="openSignPad(this)" title="เซ็นชื่อ"><span class="pf-sign-hint">✍ เซ็น</span></span>`; }
function setSign(el, data){
  el.dataset.src = data || "";
  el.innerHTML = data ? `<img src="${data}" alt="ลายเซ็น${el.dataset.who || ""}">` : `<span class="pf-sign-hint">✍ เซ็น</span>`;
  el.classList.toggle("signed", !!data);
}
let SIGN_TARGET = null;
window.openSignPad = function(el){
  SIGN_TARGET = el;
  openModal(`ลายเซ็น${el.dataset.who ? " — " + el.dataset.who : ""}`,
    `<div class="sign-pad-wrap"><canvas id="signPad" width="900" height="300"></canvas><div class="sign-line">เซ็นชื่อด้วยนิ้วหรือปากกาในกรอบนี้</div></div>`,
    `${el.dataset.src ? `<button class="btn" style="color:var(--red-ink);" onclick="setSign(SIGN_TARGET,''); closeModal();">ลบลายเซ็น</button>` : ""}
     <button class="btn" onclick="clearSignPad()">ล้าง</button><button class="btn" onclick="closeModal()">ยกเลิก</button>
     <button class="btn primary" onclick="saveSignPad()">ใช้ลายเซ็นนี้</button>`);
  const cv = document.getElementById("signPad"), ctx = cv.getContext("2d");
  ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1f6b";
  cv.dataset.ink = "";
  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); cv.dataset.ink = "1"; e.preventDefault(); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; e.preventDefault(); });
  const end = () => { drawing = false; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
};
window.setSign = setSign;
window.clearSignPad = function(){ const cv = document.getElementById("signPad"); if (cv){ cv.getContext("2d").clearRect(0, 0, cv.width, cv.height); cv.dataset.ink = ""; } };
window.saveSignPad = function(){
  const cv = document.getElementById("signPad");
  if (!cv || !cv.dataset.ink){ showToast("ยังไม่ได้เซ็นชื่อในกรอบ"); return; }
  // Crop to the ink so the signature fills the small box on the paper.
  const ctx = cv.getContext("2d"), px = ctx.getImageData(0, 0, cv.width, cv.height).data;
  let x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0;
  for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2){
    if (px[(y * cv.width + x) * 4 + 3] > 20){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(cv.width, x1 + pad); y1 = Math.min(cv.height, y1 + pad);
  const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0), s = Math.min(1, 300 / w, 100 / h);
  const out = document.createElement("canvas"); out.width = Math.round(w * s); out.height = Math.round(h * s);
  out.getContext("2d").drawImage(cv, x0, y0, w, h, 0, 0, out.width, out.height);
  setSign(SIGN_TARGET, out.toDataURL("image/png"));
  closeModal();
};

/* ===================== v48: monthly report (preview + print / save as PDF) ===================== */
const RP_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function rpChart(labels, values, o){
  const W = 360, H = 130, pl = 8, pr = 8, pt = 16, pb = 18, base = H - pb, ch = base - pt, n = values.length, gap = (W - pl - pr) / n;
  const X = i => pl + gap * (i + .5), Y = v => base - Math.min(v, o.max) / o.max * ch;
  let g = `<line x1="${pl}" y1="${base}" x2="${W - pr}" y2="${base}" stroke="#bbb"/>`;
  if (o.line){
    let d = ""; values.forEach((v, i) => { if (v != null) d += (d ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); });
    g += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2"/>`;
    values.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${o.sample && o.sample[i] ? "#fff" : o.color}" stroke="${o.color}" stroke-width="1.5"/>`; });
  } else {
    const bw = Math.min(16, gap * .6);
    values.forEach((v, i) => { if (v == null || v <= 0) return; const y = Y(v), smp = o.sample && o.sample[i];
      g += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base - y).toFixed(1)}" rx="2" fill="${smp ? "#fff" : o.color}" stroke="${o.color}" stroke-width="1.3"${smp ? ' stroke-dasharray="3 2"' : ""}/>`; });
  }
  const ty = Y(o.target);
  g += `<line x1="${pl}" y1="${ty.toFixed(1)}" x2="${W - pr}" y2="${ty.toFixed(1)}" stroke="#c0262d" stroke-dasharray="4 3" stroke-width="1"/><text x="${pl}" y="${(ty + 9).toFixed(1)}" text-anchor="start" font-size="8.5" fill="#c0262d">${o.targetLabel}</text>`;
  values.forEach((v, i) => { if (v != null) g += `<text x="${X(i).toFixed(1)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#222">${o.fmt(v)}</text>`; });
  labels.forEach((l, i) => { g += `<text x="${X(i).toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="8.5" fill="#555">${l}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">${g}</svg>`;
}

/* ===================== v14: backup / restore (whole browser store as one file) ===================== */
const BACKUP_SKIP = new Set(["loggedIn", "currentUser"]);
function collectStore(filter){
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (BACKUP_SKIP.has(k) || (filter && !filter(k))) continue;
      data[k] = localStorage.getItem(k);
    }
  } catch(e){}
  return data;
}
function storeSummary(data){
  const n = k => { try { return (JSON.parse(data[k] || "[]") || []).length; } catch(e){ return 0; } };
  return { wo:n("tbl-workorder-v1"), insp:n("insp-history"), fail:n("failure-log-user"),
    assets:["feeder","transformer","lbs","substation"].reduce((t, id) => t + n(`tbl-${id}-v1`), 0) };
}

window.applyRestore = function(){
  const p = window.__pendingRestore; if (!p) return;

    localStorage.clear();

    Object.entries(p.data).forEach(([k, v]) => { if (!BACKUP_SKIP.has(k) && !/^sync-(url|key|auto|last)/.test(k)) localStorage.setItem(k, v); });

/* ===================== v14: cross-device sync through a Google Apps Script web app ===================== */
/* The Apps Script keeps one merged copy (a JSON file in the owner's Drive) and writes readable
   sheets of work orders, inspections and breakdowns. Each sync posts this device's records; the
   script merges them by id (newer edit wins, deletions are remembered) and returns the merged
   copy, which this device then adopts — so two people can work on different devices. */
const SYNC_KEYS = k => k === "tbl-workorder-v1" || k === "insp-history" || k === "failure-log-user" || k === "sync-deleted";
const syncGet = k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } };
const syncSet = (k, v) => { try { v === "" ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
let SYNC_BUSY = false, SYNC_TIMER = null, SYNC_PENDING = false;
function syncConfigured(){ return /^https:\/\/script\.google(usercontent)?\.com\//.test(syncGet("sync-url")) && !!syncGet("sync-key"); }
function markDeleted(id){
  let list = []; try { list = JSON.parse(syncGet("sync-deleted") || "[]"); } catch(e){}
  if (!list.includes(id)){ list.push(id); syncSet("sync-deleted", JSON.stringify(list.slice(-2000))); }
}
function queueSync(){
  if (!syncConfigured() || syncGet("sync-auto") === "0") return;
  clearTimeout(SYNC_TIMER);
  SYNC_TIMER = setTimeout(() => runSync(true), 2500);
}
window.addEventListener("online", () => { if (SYNC_PENDING) queueSync(); });
async function runSync(quiet){
  if (!syncConfigured()){ if (!quiet) showToast("ยังไม่ได้ตั้งค่าลิงก์ Apps Script และรหัสซิงก์"); return false; }
  if (SYNC_BUSY){ SYNC_PENDING = true; return false; }
  SYNC_BUSY = true; setSyncStatus("กำลังซิงก์…");
  const before = collectStore(SYNC_KEYS);
  try {
    const res = await fetch(syncGet("sync-url"), { method:"POST", body:JSON.stringify({ key:syncGet("sync-key"), device:PROFILE_NAME, data:before }) });
    const j = await res.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "ตอบกลับไม่ถูกต้อง");
    const merged = j.data || {};
    // Adopt the merged copy, but keep anything typed on this device since the request left.
    const now = collectStore(SYNC_KEYS);
    const changedHere = Object.keys(now).some(k => now[k] !== before[k]);
    let changed = false;
    if (!changedHere){
      Object.keys(merged).forEach(k => { if (SYNC_KEYS(k) && merged[k] !== syncGet(k)){ syncSet(k, merged[k]); changed = true; } });
    } else SYNC_PENDING = true;
    syncSet("sync-last", new Date().toISOString());
    SYNC_PENDING = changedHere;
    if (changed) applySyncedData();
    setSyncStatus("");
    if (!quiet) showToast(changed ? "ซิงก์แล้ว — รับข้อมูลใหม่จากเครื่องอื่นเรียบร้อย" : "ซิงก์แล้ว — ข้อมูลตรงกันทุกเครื่อง");
    return true;
  } catch(e){
    SYNC_PENDING = true;
    setSyncStatus(navigator.onLine === false ? "ออฟไลน์ — จะซิงก์ให้เมื่อกลับมาออนไลน์" : "ซิงก์ไม่สำเร็จ: " + (e.message || e));
    if (!quiet) showToast(navigator.onLine === false ? "ตอนนี้ออฟไลน์ — จะซิงก์ให้อัตโนมัติเมื่อมีสัญญาณ" : "ซิงก์ไม่สำเร็จ — ตรวจลิงก์ Apps Script และรหัสซิงก์");
    return false;
  } finally {
    SYNC_BUSY = false;
    if (SYNC_PENDING && navigator.onLine !== false && quiet !== "retry"){ SYNC_PENDING = false; setTimeout(() => runSync("retry"), 1500); }
  }
}
window.runSync = runSync;

  syncSet("sync-url", url); syncSet("sync-key", key);

const APPS_SCRIPT_CODE = String.raw`/* PM CMMS — ตัวกลางซิงก์ข้อมูล (วางใน Extensions > Apps Script ของ Google Sheet) */
const KEY = 'เปลี่ยนเป็นรหัสซิงก์ของทีม';      // ตั้งรหัสเอง แล้วกรอกรหัสเดียวกันในหน้า ตั้งค่า ของเว็บ
const FILE_NAME = 'pmweb-cmms-data.json';      // ไฟล์เก็บข้อมูลรวม (อยู่ใน Google Drive ของคุณ)

function doGet(e) { return out({ ok: e.parameter.key === KEY, app: 'pmweb-cmms' }); }
function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  if (body.key !== KEY) return out({ ok: false, error: 'รหัสซิงก์ไม่ถูกต้อง' });
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    const file = dataFile();
    const current = JSON.parse(file.getBlob().getDataAsString() || '{}') || {};
    const merged = mergeData(current, body.data || {});
    file.setContent(JSON.stringify(merged));
    try { writeSheets(merged, body.device); } catch (err) { console.error(err); }
    return out({ ok: true, data: merged, at: new Date().toISOString() });
  } finally { lock.releaseLock(); }
}
function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
function dataFile() {
  const it = DriveApp.getFilesByName(FILE_NAME);
  return it.hasNext() ? it.next() : DriveApp.createFile(FILE_NAME, '{}', 'application/json');
}
function arr(s) { try { const v = JSON.parse(s || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
// รวมข้อมูลตาม id: แถวที่แก้ทีหลัง (_ts ใหม่กว่า) ชนะ, รายการที่ถูกลบจะไม่กลับมา
function mergeData(cur, inc) {
  const dead = new Set(arr(cur['sync-deleted']).concat(arr(inc['sync-deleted'])));
  const res = {};
  const keys = new Set(Object.keys(cur).concat(Object.keys(inc)));
  keys.forEach(function (k) {
    if (k === 'sync-deleted') return;
    if (!(k in inc)) { res[k] = cur[k]; return; }
    if (!(k in cur)) { res[k] = inc[k]; return; }
    const map = new Map(), order = [];
    arr(inc[k]).concat(arr(cur[k])).forEach(function (r) {
      if (!r || r.id == null) return;
      const old = map.get(r.id);
      if (!old) { map.set(r.id, r); order.push(r.id); }
      else if ((r._ts || 0) > (old._ts || 0)) map.set(r.id, r);
    });
    let rows = order.map(function (id) { return map.get(id); });
    if (k === 'insp-history') rows.sort(function (a, b) { return String(b.savedAt).localeCompare(String(a.savedAt)); });
    if (k === 'failure-log-user') rows.sort(function (a, b) { return (b.startTs || 0) - (a.startTs || 0); });
    res[k] = JSON.stringify(rows);
  });
  Object.keys(res).forEach(function (k) {
    const rows = arr(res[k]).filter(function (r) { return !dead.has(r.id); });
    res[k] = JSON.stringify(k === 'insp-history' ? rows.slice(0, 300) : rows);
  });
  res['sync-deleted'] = JSON.stringify(Array.from(dead).slice(-2000));
  return res;
}
// แผ่นงานให้หัวหน้าเปิดดูได้ใน Google Sheets (เขียนทับทุกครั้งที่ซิงก์)
function writeSheets(d, device) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) return;
  const put = function (name, head, rows) {
    const sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.clearContents();
    sh.getRange(1, 1, 1, head.length).setValues([head]).setFontWeight('bold');
    if (rows.length) sh.getRange(2, 1, rows.length, head.length).setValues(rows);
    sh.setFrozenRows(1);
  };
  put('ใบงาน', ['เลขที่ใบงาน', 'อุปกรณ์', 'วันที่', 'ผู้รับผิดชอบ', 'สถานะ', 'หมายเหตุ'],
    arr(d['tbl-workorder-v1']).map(function (r) { return [r.code, r.equip, r.date, r.owner, r.status, r.note || r.cancelReason || '']; }));

      <li>กราฟใต้การ์ดแสดงค่ารายเดือนตั้งแต่ ม.ค. · เดือนที่ยังไม่มีใบงานในระบบใช้ตัวเลขตัวอย่าง และความขัดข้องที่ติดมากับระบบเป็นข้อมูลตัวอย่าง — แท่ง/เส้นของเดือนเหล่านี้วาดเป็น<b>เส้นประ</b> ชี้เมาส์จะขึ้นคำว่า "(ตัวอย่าง)" ส่วนแท่งทึบคือตัวเลขจากใบงานและบันทึกจริง</li>
      <li>กดการ์ด KPI บนหน้าหลักเพื่อดูตัวเลขที่ใช้คำนวณของเดือนที่เลือก เช่น "105 ÷ 114 × 100 = 92.1%"</li>
    </ul>
    <div class="calc-h">เวลาซ่อม (บันทึกความขัดข้อง)</div>
    <ul class="guide-list">
      <li>บันทึกได้จากการ์ด MTTR หรือ Failure Frequency บนหน้าหลัก › "บันทึกความขัดข้อง" หรือจากหน้าต่างพบจุดผิดปกติหลังบันทึกใบตรวจ</li>
      <li>เวลาซ่อม (ชม.) = เวลาซ่อมเสร็จ − เวลาเกิดเหตุ ปัดทศนิยม 1 ตำแหน่ง · เวลาซ่อมเสร็จต้องอยู่หลังเวลาเกิดเหตุ · ถ้าเกิน 4 ชม. ขึ้นป้ายแดง "เกินเป้า" ทันทีตอนกรอก</li>
    </ul>
    <div class="calc-h">ใบตรวจ: เกณฑ์ที่ถือว่า "พบจุดผิดปกติ"</div>
    <div class="table-wrap"><table class="calc-table" style="min-width:520px;">
      <tr><th style="width:34%">แบบฟอร์ม</th><th>ระบบถือว่าผิดปกติเมื่อ</th></tr>
      <tr><td>SF-07-0-015 ถึง 020</td><td>ติ๊กช่อง "ชำรุด" แถวใดก็ได้ (รวมแถวจุดร้อนแดงในใบ 019 หน้า 2)</td></tr>
      <tr><td>SF-07-0-021, 022</td><td>ติ๊กช่อง "ไม่ปกติ" แถวใดก็ได้</td></tr>
      <tr><td>SF-07-0-023 กรองน้ำมัน</td><td>ค่าเฉลี่ย Breakdown Voltage ของรอบสุดท้ายที่กรอก ต่ำกว่า 26 kV</td></tr>
      <tr><td>SF-07-0-024 Hot Spot</td><td>ลำดับความสำคัญ 1 หรือ 2 หรือ Delta T ช่องใดเกิน 20 °C</td></tr>
      <tr><td>SF-07-0-025 Partial Discharge</td><td>ระดับความรุนแรง "สูง" หรือ "สูงมาก"</td></tr>
    </table></div>
    <div class="calc-h">ใบตรวจ: ค่าที่ระบบคำนวณให้</div>
    <ul class="guide-list">
      <li><b>023 ค่าเฉลี่ย Breakdown Voltage</b> = ผลรวมค่าที่กรอก ÷ จำนวนครั้งที่กรอก (สูงสุด 5 ครั้ง) คำนวณใหม่ทุกครั้งที่พิมพ์</li>
      <li><b>024 ลำดับความสำคัญ Hot Spot</b> (ตามตารางบนใบ อ้างอิง Standard for Infrared Inspection of Electrical Systems &amp; Rotating Equipment, 2016): Delta T 0–10 °C = 4 อุปกรณ์ปกติ · &gt;10–20 °C = 3 แก้ไขในการบำรุงรักษาครั้งต่อไป · &gt;20–40 °C = 2 ควรแก้ไขภายใน 1 เดือน · &gt;40 °C = 1 แก้ไขเร่งด่วน</li>
    </ul>
    <div class="calc-h">ตัวเลขอื่นๆ</div>
    <ul class="guide-list">
      <li><b>จุดตรวจในแผนที่นำทาง</b> เรียงตามระยะทางตรงจากศูนย์ปฏิบัติการ (สูงสุด 14 จุด) ตำแหน่งหมุดเป็นค่าประมาณตาม "สถานที่" ในใบงาน</li>
      <li><b>ต้นทุน</b>: ใช้ไปแล้ว = อะไหล่ + ผู้รับเหมา + ค่าแรง + อื่นๆ ของทั้งปี · ส่วนต่าง = ใช้ไปแล้ว − งบประมาณ · % ของงบ = ใช้ไปแล้ว ÷ งบประมาณ × 100 · รวมเฉพาะเดือนที่ผ่านมาแล้วของปี (การ์ดและกราฟบนหน้าต้นทุนเป็นตัวอย่าง ค่าใช้จ่ายจริงอยู่ในตาราง "ค่าใช้จ่ายที่บันทึกในใบงาน")</li>
      <li><b>ซิงก์ข้ามเครื่อง</b>: รายการเดียวกันถูกแก้หลายเครื่อง ระบบเก็บค่าที่แก้ล่าสุด · รายการที่ลบแล้วจะไม่กลับมา</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-dashboard">
    <h3><span class="ic">${ic('dashboard')}</span>หน้าหลัก (Dashboard)</h3>
    <p>แถบ <b>ขั้นตอนงาน PM</b> (ใต้การ์ด KPI) แสดงวงจรงานทั้งระบบในแถวเดียว: ปฏิทินงาน → ใบงานค้าง → ออกตรวจภาคสนาม → ตรวจสอบ → ความขัดข้อง → สรุปผล KPI ทุกช่องเป็นตัวเลขสดจากข้อมูลจริง กดช่องไหนก็ไปหน้านั้นทันที ช่องที่ไอคอนเป็นสีแดงคือจุดที่ต้องดูแล (มีงานเกินกำหนด หรือต่ำกว่าเป้า)</p>
    <p>ด้านบนสุดคือ <b>ตัวชี้วัดงานบำรุงรักษา (KPI) 4 ตัว</b> ประจำเดือน แต่ละการ์ดบอกค่าปัจจุบัน เทียบกับเดือนก่อน (▲▼ สีเขียว = ดีขึ้น, สีแดง = แย่ลง) และป้าย <b>✓ ผ่านเป้า / ✕ ยังไม่ถึงเป้า</b></p>
    <ul class="guide-list">
      <li><b>PM Completion Rate</b> = PM ที่เสร็จสมบูรณ์ ÷ PM ที่กำหนดทั้งหมด × 100 — เป้าหมาย ≥ 90%</li>
      <li><b>Overdue PM Rate</b> = งาน PM ที่เกินกำหนด ÷ งาน PM ทั้งหมด × 100 — เป้าหมาย ≤ 10%</li>
      <li><b>MTTR</b> = เวลาซ่อมรวม (ชั่วโมง) ÷ จำนวนครั้งที่ซ่อม — เป้าหมาย ≤ 4.0 ชั่วโมง/ครั้ง</li>
      <li><b>Failure Frequency</b> = จำนวนครั้งที่อุปกรณ์เกิดความขัดข้องในเดือน — เป้าหมาย ≤ 5 ครั้ง/เดือน</li>
      <li>PM Completion และ Overdue คำนวณสดจากใบงาน (ไม่นับใบงานที่ยกเลิก) ส่วน MTTR และ Failure คำนวณจากความขัดข้องที่บันทึก — กดการ์ด MTTR หรือ Failure แล้วกด <b>บันทึกความขัดข้อง</b> เพื่อเพิ่มรายการ</li>
      <li>ช่อง <b>เลือกเดือน</b> มุมขวาของหัวข้อ KPI ใช้ดูค่าย้อนหลังของเดือนอื่น กราฟจะแสดงถึงเดือนที่เลือก</li>
      <li><b>กดที่การ์ด KPI</b> เพื่อดูตัวเลขที่ใช้คำนวณจริง และปุ่มไปยังใบงานที่เกี่ยวข้อง</li>
      <li>กราฟแนวโน้มใต้การ์ด แสดงค่ารายเดือนตั้งแต่ ม.ค. พร้อมเส้นแนวนอนประบอกเป้าหมาย แท่ง/จุดสีเข้มคือเดือนที่เลือก แท่งที่มีขอบประคือตัวเลขตัวอย่าง ชี้เมาส์ที่แท่งเพื่อดูตัวเลขแต่ละเดือน</li>
      <li><b>งาน PM ใกล้ถึงกำหนด</b> — ใบงานที่เกินกำหนดขึ้นก่อน ตามด้วยงานที่รอดำเนินการ เรียงตามวันที่ กดแถวเพื่อเปิดใบงาน (มีปุ่ม "ตรวจและปิดใบงาน")</li>
      <li><b>แจ้งเตือน / เหตุการณ์สำคัญ</b> — สร้างจากข้อมูลจริง: ใบงานที่เกินกำหนด ความขัดข้องล่าสุด และใบงานที่เพิ่งตรวจและปิด ใช้ชุดเดียวกับกระดิ่งด้านบน กดแล้วไปยังรายการนั้น</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-pm">
    <h3><span class="ic">${ic('calendar')}</span>ปฏิทินงาน PM</h3>
    <p>ปฏิทินดึงจาก <b>ใบงานจริง</b> ทุกใบ แต่ละป้ายคือรหัสอุปกรณ์ สีตามประเภทอุปกรณ์ (ฟ้า Feeder · ส้ม Transformer · เขียว LBS · เทา Unit Substation · ม่วง อุปกรณ์อื่น เช่น SZ / RMU / Capacitor / Network) ขอบแดง = เกินกำหนด สีจาง = เสร็จแล้ว</p>
    <ul class="guide-list">
      <li>กดป้ายงานในปฏิทินเพื่อเปิดใบงานนั้น วันที่มีงานเกิน 3 งานจะมี "+n งาน" กดเพื่อดูทั้งหมดของวันนั้น (หรือกดที่ตัวเลขวันที่)</li>
      <li>เลื่อนเดือนด้วยปุ่ม ◀ ▶ หรือเลือก <b>เดือน / ปี</b> จากช่องเลือกด้านบนปฏิทินเพื่อกระโดดไปดูย้อนหลังได้ทันที กด <b>เดือนนี้</b> เพื่อกลับมาเดือนปัจจุบัน · การ์ด "งานตามแผน" และวงกลม % เสร็จตามแผนด้านขวาเปลี่ยนตามเดือนที่ดู กดแต่ละแถวเพื่อไปหน้าใบงานที่กรองสถานะนั้นไว้</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-workorder">
    <h3><span class="ic">${ic('clipboard')}</span>ใบงาน (Work Order)</h3>
    <p>รายการใบงานทั้งหมด แต่ละใบเก็บรหัสอุปกรณ์และสถานที่ไว้ในตัว กด "ดู" เพื่อเห็นรายละเอียดและปุ่ม "ตรวจและปิดใบงาน"</p>
    <ul class="guide-list">
      <li>แถบชิปด้านบน (ทั้งหมด / รอดำเนินการ / กำลังดำเนินการ / เสร็จสิ้น / เกินกำหนด / ยกเลิก) กรองใบงานตามสถานะ</li>
      <li>ใบงานที่ถูก<b>ยกเลิก</b> คือใบงานที่ถูกสั่งให้ไม่ต้องดำเนินการต่อ (เช่น ซ้ำกับใบงานอื่น, เลื่อนแผน, อุปกรณ์ถูกปลดออกจากระบบ) — เมื่อเปลี่ยนสถานะใบงานเป็น "ยกเลิก" ผ่านปุ่มแก้ไข ระบบจะให้กรอก <b>เหตุผลการยกเลิก</b> ด้วย และแสดงเหตุผลนั้นเวลากด "ดู" รายละเอียดใบงาน</li>
      <li>ปุ่ม <b>ส่งออก Excel</b> / <b>นำเข้าไฟล์</b> ใช้บันทึกหรือเพิ่มใบงานเป็นชุดจากไฟล์ (.xlsx หรือ .csv แถวแรกเป็นหัวตาราง)</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-fieldnav">
    <h3><span class="ic">${ic('mapPin')}</span>นำทางตรวจภาคสนาม</h3>
    <p>แผนที่แสดงจุดที่ต้องออกตรวจของใบงานที่ยังค้าง (รอดำเนินการ กำลังดำเนินการ หรือเกินกำหนด) วางตาม "สถานที่" ในใบงาน เรียงตามระยะทางจากศูนย์ปฏิบัติการ</p>
    <ul class="guide-list">
      <li>แผนที่เป็น <b>Google Maps จริง</b> แสดงเส้นทางขับรถจากศูนย์ปฏิบัติการ (จุด A) ผ่านทุกจุดตรวจ (B, C, D … ตรงกับตัวอักษรในรายการ) ซูม / เลื่อน / เปลี่ยนเป็นภาพดาวเทียมได้ในแผนที่เลย</li>
      <li>กด <b>ไอคอนหมุด</b> ท้ายรายการจุดตรวจ เพื่อซูมแผนที่ไปที่จุดนั้น กด "กลับไปดูเส้นทางทั้งหมด" เพื่อกลับมาภาพรวม</li>
      <li>ถ้าแผนที่ Google ไม่ขึ้น (เช่น เครือข่ายในที่ทำงานปิดกั้น หรือเปิดในหน้าพรีวิวของ Claude) กดปุ่ม <b>"แผนที่จำลอง"</b> เพื่อใช้แผนที่แบบเดิม ระบบจำตัวเลือกไว้</li>
      <li>กดรายการจุดตรวจเพื่อดูรายละเอียด และปุ่ม "ตรวจและปิดใบงาน"</li>
      <li>ปุ่ม <b>เปิดนำทางใน Google Maps</b> จะเปิดแอป/เว็บ Google Maps พร้อมเส้นทางจริงให้ทันที</li>
      <li>ปุ่ม <b>เปิดใบงาน</b> เปิดรายละเอียดใบงานของจุดนั้น</li>
      <li>ใช้ปุ่ม + / − มุมขวาบนของแผนที่เพื่อซูมเข้า-ออก</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-inspection">
    <h3><span class="ic">${ic('checklist')}</span>ใบตรวจสอบบำรุงรักษา</h3>
    <p>รวมแบบตรวจสอบ (SF-07) และคู่มือการปฏิบัติงาน (SW-OH) ของอุปกรณ์ 11 ประเภท</p>
    <ul class="guide-list">
      <li>กดการ์ดแบบฟอร์มเพื่อเปิด แล้วสลับแท็บ <b>แบบตรวจสอบ (SF-07)</b> ↔ <b>คู่มือการปฏิบัติงาน (SW-OH)</b> ได้</li>
      <li>กรอกข้อมูลแล้วกด <b>บันทึกแบบตรวจสอบ</b> ทุกครั้งจะถูกเก็บเป็นรายการใหม่ใน <b>ประวัติการตรวจสอบ</b> (ไม่ทับของเดิม)</li>
      <li>กดปุ่ม <b>ดูประวัติการตรวจสอบ</b> ที่ด้านบนของหน้ารายการแบบฟอร์ม เพื่อดูว่าเคยตรวจอะไรไปแล้วบ้าง วันที่ไหน กดดูรายละเอียดแต่ละครั้งได้ หรือลบทิ้ง หรือส่งออกทั้งหมดเป็น Excel</li>
      <li>ปุ่ม <b>พิมพ์แบบฟอร์ม / พิมพ์คู่มือ</b> จัดหน้าให้พร้อมพิมพ์ทันที (ซ่อนเมนูและปุ่มต่างๆ อัตโนมัติ)</li>
      <li>แบบตรวจสอบทั้ง 11 ใบ <b>เหมือนกระดาษต้นฉบับทุกช่อง</b> (หัวข้อ ลำดับข้อ ช่องติ๊ก เกณฑ์ ช่องลงชื่อ และรหัสเอกสารมุมล่าง) แสดงเป็นแผ่น A4 — พิมพ์ได้ตรงกระดาษ 1 แผ่นต่อ 1 หน้า (ใบ Unit Substation มี 2 หน้าเหมือนต้นฉบับ)</li>
      <li>กดในช่องเพื่อพิมพ์ กดที่ □ เพื่อติ๊ก ✓ (ติ๊กได้ช่องเดียวต่อแถว กดซ้ำเพื่อลบ) — ใบ Hot Spot และ Partial Discharge กดกรอบภาพเพื่อแนบรูปหรือถ่ายภาพจากมือถือได้ ใบกรองน้ำมันคำนวณค่าเฉลี่ยให้อัตโนมัติ</li>
      <li><b>ใบเปล่าทุกครั้ง:</b> กดการ์ดแบบฟอร์มจะได้ใบเปล่าพร้อมกรอกทันที (ระบบเติมชื่อผู้ตรวจให้) ไม่ต้องกดล้างคำตอบ — คำตอบที่เคยบันทึกดูได้ที่ <b>ประวัติการตรวจสอบ</b> เท่านั้น</li>
      <li><b>📍 พิกัด GPS:</b> ใบที่มีช่อง Lat. / Long. (015–020, 024, 025) มีปุ่ม <b>พิกัด</b> ท้ายช่อง Long. กดครั้งเดียวระบบดึงตำแหน่งจาก GPS ของมือถือมาใส่ให้ทั้งสองช่อง (ทศนิยม 6 ตำแหน่ง พร้อมบอกค่าคลาดเคลื่อน) — ครั้งแรกเบราว์เซอร์จะถามสิทธิ์ ให้กด "อนุญาต" ต้องเปิดเว็บผ่าน https:// และเปิด Location ไว้ ปุ่มนี้ไม่ติดไปตอนพิมพ์</li>
      <li><b>ตัวอย่างในประวัติ:</b> ประวัติการตรวจสอบมีใบตัวอย่าง 11 ใบ (ใบละ 1 ฟอร์ม มีป้าย "ตัวอย่าง") แต่ละใบผูกกับใบงาน PM ที่ปิดแล้ว ใช้ดูว่าการกรอกจริงหน้าตาเป็นอย่างไร — กดเลขใบงานเพื่อไปที่ใบงาน หรือกดถังขยะเพื่อลบได้เหมือนรายการปกติ</li>
      <li>ปุ่ม <b>ส่งออก Excel</b> บันทึกคำตอบที่กรอกไว้เป็นไฟล์ .xlsx เรียงตามลำดับบนกระดาษ เปิดดูหรือส่งต่อได้ทันที</li>
      <li><b>ช่องจำเป็น:</b> ต้องกรอก Station ID และชื่อผู้ตรวจ (ระบบเติมชื่อจากหน้าตั้งค่าให้) และกรอก/ติ๊กอย่างน้อย 1 ช่องก่อนบันทึก — ช่องที่ขาดจะขึ้นกรอบสีแดง</li>
      <li><b>ลายเซ็น:</b> กดปุ่ม "✍ เซ็น" ในช่องผู้ตรวจ / ผู้ตรวจสอบ แล้วเซ็นด้วยนิ้วหรือปากกา ลายเซ็นจะอยู่บนใบ พิมพ์ออกมาได้ และเก็บไปกับประวัติการตรวจ</li>
      <li><b>พบจุดผิดปกติ:</b> เมื่อบันทึกใบที่ติ๊ก "ชำรุด" / "ไม่ปกติ" ใบ Hot Spot ลำดับความสำคัญ 1–2 หรือ Delta T เกิน 20 °C ใบ PD ระดับ "สูง/สูงมาก" หรือค่าน้ำมันเฉลี่ยต่ำกว่า 26 kV ระบบจะสรุปจุดที่พบ และเสนอให้ <b>สร้างใบงานแก้ไข (CM)</b> หรือ <b>บันทึกความขัดข้อง</b> ได้ในคลิกเดียว — ในประวัติจะมีป้าย ⚠ บอกจำนวนจุด</li>
      <li><b>พิมพ์ใบเปล่า:</b> ปุ่มบนหน้ารายการแบบฟอร์ม เลือกได้ว่าจะพิมพ์ใบไหนกี่ชุด สำหรับทีมที่ยังกรอกด้วยปากกาหน้างาน</li>
      <li><b>ตรวจและปิดใบงาน:</b> เปิดใบงานที่ยังไม่เสร็จ (หรือจุดตรวจในหน้านำทาง) แล้วกด "ตรวจและปิดใบงาน" ระบบจะเปิดแบบฟอร์มที่ตรงกับอุปกรณ์ เติม Station ID / สถานที่ ให้ และเมื่อกดบันทึก ใบงานนั้นจะเปลี่ยนเป็น "เสร็จสิ้น" ทันที (PM Completion บนหน้าหลักขยับตาม) ถ้าไม่ต้องการผูกกับใบงาน กด "ไม่ผูกกับใบงาน" ที่แถบสีฟ้าด้านบนแบบฟอร์ม — ใบงานที่ปิดแล้วจะมีปุ่ม "ดูใบตรวจที่บันทึก" และในประวัติการตรวจจะมีเลขใบงานให้กดกลับไปได้</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-cost">
    <h3><span class="ic">${ic('coin')}</span>ต้นทุนบำรุงรักษา</h3>
    <p>สรุปงบประมาณและค่าใช้จ่ายรายเดือน พร้อมสัดส่วนค่าใช้จ่ายแยกตามประเภท · การ์ด กราฟ และสัดส่วนเป็น<b>ข้อมูลตัวอย่าง</b> (มีป้ายบอกบนหน้า) ส่วนตารางท้ายหน้าเป็นค่าใช้จ่ายจริงที่บันทึกในใบงาน</p>
    <ul class="guide-list">
      <li>เลือก <b>ปี</b> จากช่องด้านบนเพื่อดูปีนี้หรือย้อนหลัง 2 ปี · ปีปัจจุบันรวมเฉพาะเดือนที่ผ่านมาแล้ว เดือนที่ยังไม่ถึงไม่มีค่าใช้จ่าย</li>
      <li>สลับเป็น <b>"รายเดือน"</b> จะโชว์ปุ่มลูกศร ◀ ▶ ให้กดย้อนดูเดือนก่อนหน้า/ถัดไปได้ (ข้ามปีอัตโนมัติ และเลื่อนเกินเดือนปัจจุบันไม่ได้) ตัวเลขงบประมาณและกราฟจะปรับเป็นของเดือนนั้นๆ ทันที</li>
      <li>กดการ์ด <b>งบประมาณ</b> (ผู้ดูแลระบบ) เพื่อตั้งงบทั้งปี การ์ด "ใช้ไปแล้ว" จะบอก % ของงบ — เขียว ≤ 90% · เหลือง 90–100% · แดงเมื่อเกินงบ</li>
      <li><b>นำเข้าไฟล์ค่าใช้จ่าย (ผู้ดูแลระบบ):</b> กดปุ่ม <b>นำเข้าไฟล์ค่าใช้จ่าย</b> เหนือการ์ด เลือกไฟล์ .xlsx หรือ .csv แล้วระบบคำนวณการ์ด กราฟรายเดือน และสัดส่วนจากไฟล์นั้นให้ทันที — รองรับ 2 แบบ: (1) หนึ่งแถวต่อหนึ่งรายการ มีคอลัมน์ วันที่ / ประเภท (อะไหล่ ผู้รับเหมา ค่าแรง อื่นๆ) / จำนวนเงิน (เลขที่ใบงานและรายละเอียดใส่หรือไม่ใส่ก็ได้) (2) แยกคอลัมน์ตามประเภท เช่น เดือน | อะไหล่ | ผู้รับเหมา | ค่าแรง | อื่นๆ วันที่ใช้ได้ทั้ง พ.ศ./ค.ศ. เช่น 5/10/2569, 2026-10-05, 5 ต.ค. 69 หรือชื่อเดือน ระบบเดาคอลัมน์ให้เอง แก้ได้ และมีตัวอย่างผลรวมให้ดูก่อนกดยืนยัน แถวรวมยอดหรือแถวที่ข้อมูลไม่ครบจะถูกข้าม ไม่นับซ้ำ · นำเข้าเพิ่มต่อจากเดิม (ข้ามรายการซ้ำ) หรือแทนที่ได้ · กด <b>ไฟล์ตัวอย่าง</b> เพื่อดาวน์โหลดแบบฟอร์มเปล่า · กด <b>ล้างข้อมูลที่นำเข้า</b> เพื่อกลับไปใช้ตัวเลขตัวอย่าง · ข้อมูลที่นำเข้าเก็บในเบราว์เซอร์เครื่องนี้ (ไม่ซิงก์ขึ้น Google Sheets) และเทียบกับงบประมาณทั้งปีที่ตั้งไว้ในทุกปี</li>
      <li><b>มูลค่าทรัพย์สินและค่าเสื่อมราคา (ผู้ดูแลระบบนำเข้า):</b> ส่วนใต้กราฟ แสดงทะเบียนทรัพย์สินจากไฟล์ .xlsx / .csv ที่มีคอลัมน์ ค่าการได้มาสะสม · มูลค่าสุทธิ · ค่าเสื่อมสะสมยกมา · ค่าเสื่อมสะสมประจำปี · วันที่ติดตั้ง (รหัสทรัพย์สินและรายละเอียดใส่เพิ่มได้) กด <b>นำเข้าทะเบียนทรัพย์สิน</b> ระบบจับคู่คอลัมน์ให้ ตรวจสมการ ค่าการได้มา − ค่าเสื่อมสะสม = มูลค่าสุทธิ ให้ก่อนนำเข้า แล้วแสดงการ์ดสรุป กราฟมูลค่าทรัพย์สินที่ติดตั้งรายเดือน และตารางสรุป พร้อมการ์ด <b>ค่าบำรุงรักษา ÷ มูลค่าทรัพย์สิน</b> = ค่าบำรุงรักษาของปีที่เลือก หารด้วยค่าการได้มาสะสมทั้งหมด (ใช้ตัวเลขตัวอย่างถ้ายังไม่ได้นำเข้าไฟล์ค่าใช้จ่าย) · นำเข้า PDF โดยตรงไม่ได้ ให้ใช้ไฟล์ Excel/CSV · ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ไม่ซิงก์ขึ้น Google Sheets</li>
      <li><b>ค่าใช้จ่ายที่บันทึกในใบงาน</b> (การ์ดล่างสุด) รวมค่าใช้จ่ายจริงที่กรอกตอนปิดงาน หรือจากปุ่มแก้ไขใบงาน ช่อง "ค่าใช้จ่ายของงาน" กดแถวเพื่อเปิดใบงาน — ใบงานตัวอย่างที่ปิดด้วยใบตรวจตัวอย่าง 11 ใบมีค่าใช้จ่ายบันทึกไว้แล้ว (เช่น เปลี่ยนแบตเตอรี่ SZ, กรองน้ำมันหม้อแปลงวงจรตาข่าย)</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-link">
    <h3><span class="ic">${ic('branch')}</span>การเชื่อมโยงข้อมูลข้ามหน้า</h3>
    <p>ทุกหน้าอ้างอิงใบงานชุดเดียวกัน: ใบงานทุกใบขึ้นในปฏิทินงาน PM หน้าใบงาน แผนที่นำทาง และ KPI · บันทึกใบตรวจจากใบงานแล้วใบงานปิดเอง · พบจุดผิดปกติแล้วได้ใบงานแก้ไข (CM) กลับเข้าคิว</p>
    <ul class="guide-list">
      <li><b>แถบขั้นตอนงาน</b> ใต้หัวข้อหน้า ปฏิทินงาน PM / ใบงาน / นำทาง / ใบตรวจ บอกว่าอยู่ขั้นไหน พร้อมตัวเลขสดของทุกขั้น กดขั้นใดก็ไปหน้านั้น ปุ่มขวาสุดพาไปขั้นถัดไป</li>
      <li><b>หน้าต่างใบงาน</b> มีปุ่ม ตรวจและปิดใบงาน · ประวัติอุปกรณ์ · นำทาง (เปิดแผนที่ที่จุดของใบนี้) · ดูในปฏิทิน (เปิดเดือนของใบนี้) ใบงานแก้ไข (CM) จะมีลิงก์กลับไปใบตรวจต้นทาง และใบงานที่ตรวจพบผิดปกติจะมีลิงก์ไปใบ CM ที่เปิดต่อ</li>
      <li><b>หลังบันทึกใบตรวจที่ปิดใบงาน</b> ระบบสรุปผลและเสนอขั้นถัดไป: ตรวจจุดถัดไปที่ใกล้ที่สุด · กลับแผนที่นำทาง · ดู KPI (ถ้าพบจุดผิดปกติ จะเปิดหน้าต่างเปิดใบงานแก้ไขแทน)</li>
      <li>การ์ด KPI บนหน้าแรก กดแล้วเปิดสูตรคำนวณ พร้อมปุ่มพาไปหน้าใบงานที่กรองสถานะนั้นไว้แล้ว (เช่น ใบงานที่เกินกำหนด)</li>
      <li>ใบงานของหม้อแปลง / LBS / สถานีย่อย กด "ดู" จะมีปุ่ม "ตรวจและปิดใบงาน" พาไปเปิดแบบฟอร์มของอุปกรณ์ประเภทนั้นพร้อมเติม Station ID และสถานที่ให้</li>
    </ul>
  </div>

  <div class="guide-section" id="guide-settings">
    <h3><span class="ic">${ic('help')}</span>ตั้งค่า</h3>
    <p>ดูและแก้ชื่อ-ตำแหน่งของผู้ใช้ (ใช้เป็นชื่อผู้ตรวจในใบตรวจ) ดูบทบาท ตั้งค่าซิงก์ และสำรอง/กู้คืนข้อมูล — ระบบจำการตั้งค่าไว้ในเบราว์เซอร์</p>
    <ul class="guide-list">
      <li>แก้ไข <b>ชื่อ-นามสกุล</b> และ <b>ตำแหน่ง</b> ที่แสดงบนแถบด้านบนได้ที่นี่ (กรอกแล้วกด "บันทึก") ตัวย่อในวงกลมอวาตาร์จะเปลี่ยนตามชื่อที่กรอกโดยอัตโนมัติ</li>
      <li><b>เข้าสู่ระบบ</b> ด้วยชื่อผู้ใช้ (Username) และรหัสผ่าน (Password) · ใช้งานครั้งแรกใช้ <b>admin / admin</b> แล้วระบบบังคับให้ตั้งรหัสผ่านใหม่ทันที · ชื่อ-นามสกุลของบัญชีใช้เป็นชื่อผู้ตรวจในใบตรวจ และบทบาท (ผู้ดูแลระบบ / ผู้ใช้งานทั่วไป) มาจากบัญชี</li>
      <li><b>ผู้ดูแลระบบ</b> เพิ่มบัญชีให้ทีม เปลี่ยนบทบาท รีเซ็ตรหัสผ่าน ปิดใช้งาน หรือลบบัญชีได้ที่ ตั้งค่า › บัญชีผู้ใช้งาน · รหัสที่ผู้ดูแลตั้งให้เป็นรหัสชั่วคราว ผู้ใช้ต้องเปลี่ยนเองตอนเข้าครั้งแรก · ทุกคนเปลี่ยนรหัสของตัวเองได้ที่ ตั้งค่า หรือกดชื่อมุมขวาบน · กรอกรหัสผิด 5 ครั้งต้องรอ 30 วินาที</li>
      <li>ระบบไม่มีเซิร์ฟเวอร์ บัญชีผู้ใช้จึงเก็บในเบราว์เซอร์ของแต่ละเครื่อง (รหัสผ่านเก็บแบบเข้ารหัส ไม่เก็บตัวจริง) ใช้ไฟล์สำรองข้อมูลเพื่อย้ายบัญชีไปเครื่องอื่น · ระบบบัญชีนี้ใช้<b>แยกสิทธิ์</b>ผู้ดูแล/ผู้ใช้งานในเครื่องเดียวกัน ไม่ใช่ระบบรักษาความปลอดภัยของข้อมูล — ผู้ที่เข้าถึงเบราว์เซอร์ของเครื่องได้ก็เข้าถึงข้อมูลในเครื่องนั้นได้</li>
      <li>ปุ่ม <b>ผู้ดูแลระบบ (Admin) / ผู้ใช้งานทั่วไป (User)</b> ในหน้านี้สลับบทบาทการใช้งาน — โหมด <b>Admin</b> แก้ไข/เพิ่ม/ลบข้อมูลได้เต็มสิทธิ์ ส่วนโหมด <b>User</b> จะซ่อนปุ่มแก้ไข/เพิ่ม/ลบทั่วทั้งระบบไว้ชั่วคราว (ดูได้อย่างเดียว) เหมาะสำหรับสาธิตมุมมองของผู้ใช้งานทั่วไป ป้ายบทบาทบนแถบบนสุดจะเปลี่ยนตามและกดกลับมาที่หน้านี้ได้ทันที</li>

// v53 (once per browser): one year of sample inspection history (the 12 months before this one), built from the 11 sample forms
// with different equipment, dates and inspectors. They are ordinary history entries (marked "ตัวอย่าง") and can be deleted.
function inspYearEntries(){
  const T = INSP_SAMPLE, out = [];
  const trs = WO_SEED.transformer.slice(0, 40).map(a => [a.code, getAssetDistrict("transformer", a) || "เมืองสมุทรปราการ"]);
  const lbs = WO_SEED.lbs.slice(0, 30).map(a => [a.code, getAssetDistrict("lbs", a) || "เมืองสมุทรปราการ"]);
  const uss = WO_SEED.substation.slice(0, 10).map(a => [a.code, getAssetDistrict("substation", a) || "เมืองสมุทรปราการ"]);
  const POOL = { "SF-07-0-015":trs, "SF-07-0-016":lbs, "SF-07-0-019":uss, "SF-07-0-024":trs, "SF-07-0-025":lbs };
  const INSPECTORS = ["สมชาย ใจดี", "กิตติ รักงาน", "วิชัย มั่นคง", "อนพล สุขสบาย", "สุชาติ พึ่งบุญ", "มานะ ขยันดี"];
  const SUPERVISORS = ["ประเสริฐ ทองดี", "สมศักดิ์ ศรีสวัสดิ์"];
  // how often each form is used: transformer and LBS rounds are the most common
  const SEQ = [0,1,0,4,1,9,0,10,5,2,1,0,3,6,7,8,0,1,4,0,10,1,9,0];
  const PER_MONTH = [9, 10, 10, 11, 11, 12, 12, 13, 12, 13, 14, 13]; // Oct 2568 (tail) … Sep 2569
  let n = 0, seq = 0;
  for (let mo = 0; mo < 12; mo++){
    const first = new Date(NOW_Y - 1, NOW_M + mo, 1), dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const count = mo === 0 ? 2 : PER_MONTH[mo - 1];
    for (let i = 0; i < count; i++){
      let day = mo === 0 ? Math.min(dim, 28 + i * 2) : 1 + ((i * 7 + mo * 5 + 3) % dim);
      const d = new Date(first.getFullYear(), first.getMonth(), day, 8 + (n * 3) % 8, (n * 17) % 60);
      if (d > new Date(NOW_Y, NOW_M, 1)) continue;
      if (d.getDay() === 0) d.setDate(d.getDate() + 1); else if (d.getDay() === 6) d.setDate(d.getDate() + 2);
      if (d < new Date(NOW_Y - 1, NOW_M, NOW_D)) continue; // keep inside the last 12 months
      const tmpl = T[SEQ[seq++ % SEQ.length]], m = INSP_SAMPLE_WO[tmpl.code];
      const pool = POOL[tmpl.code];
      const pick = pool ? pool[(n * 5 + mo * 3) % pool.length] : [m[2], tmpl.headerVals["สถานที่"]];
      const baseCode = m[2], basePlace = tmpl.headerVals["สถานที่"];
      const ds = d.toLocaleDateString("th-TH", { day:"numeric", month:"numeric", year:"numeric" });
      let js = JSON.stringify(tmpl).split("@D").join(ds);
      js = js.split(baseCode).join(pick[0]).split(basePlace).join(pick[1]);
      const lat = tmpl.headerVals["Lat."], lng = tmpl.headerVals["Long."];
      if (lat && pool){ const k = (n * 13 + mo) % 41 - 20; js = js.split(lat).join((parseFloat(lat) + k * 0.001).toFixed(4)).split(lng).join((parseFloat(lng) + ((n * 7) % 41 - 20) * 0.001).toFixed(4)); }
      js = js.split("สมชาย ใจดี").join(INSPECTORS[(n + mo) % INSPECTORS.length]).split("ประเสริฐ ทองดี").join(SUPERVISORS[(n >> 1) % SUPERVISORS.length]);
      const e = JSON.parse(js);
      delete e.day; e.id = "hy" + String(++n).padStart(3, "0"); e.savedAt = d.toISOString(); e.sample = true;
      e.assetCode = pick[0]; if (m[1]) e.assetTableId = m[1];
      out.push(e);
    }
  }
  return out;
}

// Every chart is hand-drawn as SVG in plain JS. This removes the whole class of
// "chart library failed to load" problems (blocked CDN, offline, stale cache) —
// there is nothing to fetch and nothing that can fail to load.
const GRID = "#d6d6d3", MUTED = "#68686f";

// used only for chart fills/legends, not for badges, buttons, or other chrome.

function svgDonut(id, values, colors){
  const el = document.getElementById(id);
  if (!el) return;
  const size = Math.min(el.clientWidth || 168, el.clientHeight || 168) || 168;
  if (!size) return;
  const cx = size/2, cy = size/2, r = size*0.36, sw = size*0.16;
  const circ = 2 * Math.PI * r;
  const total = values.reduce((a,b)=>a+b,0) || 1;
  let offset = 0, segs = "";
  values.forEach((v,i) => {
    const dash = (v/total) * circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  el.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${segs}</svg>`;
}

function svgStackedBar(id, labels, series, unit){
  unit = unit || "k";
  const el = document.getElementById(id);
  if (!el) return;
  const w = el.clientWidth || 560, h = 190;
  if (!w) return;
  const padL = 40, padR = 8, padT = 8, padB = 20;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const n = labels.length;
  const totals = labels.map((_,i) => series.reduce((a,s)=>a+s.data[i],0));
  let max = (Math.max(...totals) || 1) * 1.15;
  if (unit === " ") max = Math.max(4, Math.ceil(max / 4) * 4); // whole-number axis for counts
  const gap = chartW / n, barW = gap * 0.55;
  let grid = "", bars = "";
  for (let s = 0; s <= 4; s++){
    const val = max * s / 4;
    const y = padT + chartH - (val/max) * chartH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" style="stroke:var(--kpi-grid);" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="10.5" style="fill:var(--text-faint);" text-anchor="end">${max < 20 ? val.toFixed(1) : Math.round(val)}${unit}</text>`;
  }
  for (let i = 0; i < n; i++){
    let yCursor = padT + chartH;

  t = t.replace(/[฿,\s]|บาท|THB|baht/gi, "").replace(/[()\-]/g, "");
  if (!/^\d*\.?\d+$/.test(t)) return NaN;
  const n = parseFloat(t); return neg ? -n : n;
}
function detectCostHeader(rows){
  const re = /วัน|date|เดือน|month|ประเภท|หมวด|category|จำนวนเงิน|amount|ยอด|อะไหล่|ผู้รับเหมา|ค่าแรง|ใบงาน|รายละเอียด|รายการ|งวด/i;
  for (let i = 0; i < Math.min(rows.length, 10); i++) if ((rows[i] || []).filter(c => re.test(String(c ?? ""))).length >= 2) return i;
  return Math.max(0, rows.findIndex(r => (r || []).some(c => String(c ?? "").trim() !== "")));
}
function autoCostMap(head){
  const used = new Set(), map = { date:-1, cat:-1, amt:-1, ref:-1, desc:-1, parts:-1, contractor:-1, labor:-1, other:-1 };
  const take = (key, re) => { const i = head.findIndex((h, j) => !used.has(j) && re.test(h)); map[key] = i; if (i >= 0) used.add(i); return i; };
  take("date", /วัน|date|เดือน|month|งวด|period/i);
  let wideCount = 0;
  COST_CATS.forEach(c => { if (take(c.k, c.re) >= 0) wideCount++; });
  const wide = wideCount >= 2;
  if (!wide) COST_CATS.forEach(c => { if (map[c.k] >= 0){ used.delete(map[c.k]); map[c.k] = -1; } });
  take("cat", /ประเภท|หมวด|category|type/i);
  if (take("amt", /จำนวนเงิน|amount|ยอดเงิน|ราคา/i) < 0) take("amt", /ค่าใช้จ่าย|cost|ยอด|บาท|total|รวม/i);
  take("ref", /ใบงาน|\bwo\b|work.?order|เลขที่|ref|อ้างอิง/i);
  take("desc", /รายละเอียด|รายการ|desc|หมายเหตุ|note/i);
  return { wide, map };
}
// rows + chosen mapping → cost items {d:"yyyy-mm-dd", c:category, a:baht, r:work order, t:text}
function parseCostRows(rows, o){
  const items = [], skipped = []; let unmatched = 0, noYear = 0;
  const cell = (r, i) => (i >= 0 && i < r.length ? r[i] : "");
  const note = (line, why, val) => skipped.push({ line, why, val: String(val ?? "") });
  for (let li = o.head + 1; li < rows.length; li++){
    const r = rows[li]; if (!r || !r.some(c => String(c ?? "").trim() !== "")) continue;
    const dt = parseCostDate(cell(r, o.map.date), o.fallbackBE);
    if (!dt){ note(li + 1, "อ่านวันที่ไม่ได้", cell(r, o.map.date)); continue; }
    if (dt.noYear) noYear++;
    const d = `${dt.y}-${String(dt.m + 1).padStart(2, "0")}-${String(dt.d).padStart(2, "0")}`;
    const ref = String(cell(r, o.map.ref) ?? "").trim(), desc = String(cell(r, o.map.desc) ?? "").trim();
    if (o.mode === "wide"){
      let any = false, bad = "";
      COST_CATS.forEach(c => {
        const i = o.map[c.k]; if (i === undefined || i < 0) return;
        const raw = cell(r, i), a = parseCostAmount(raw);
        if (a > 0){ items.push({ d, c:c.k, a, r:ref, t:desc }); any = true; }
        else if (String(raw ?? "").trim() !== "" && isNaN(a)) bad = String(raw);
      });
      if (!any && bad) note(li + 1, "จำนวนเงินไม่ใช่ตัวเลข", bad);
    } else {
      const raw = cell(r, o.map.amt), a = parseCostAmount(raw);
      if (!(a > 0)){ note(li + 1, isNaN(a) ? "จำนวนเงินไม่ใช่ตัวเลข" : "จำนวนเงินต้องมากกว่า 0", raw); continue; }
      let c = "other";
      if (o.map.cat >= 0){
        const txt = String(cell(r, o.map.cat) ?? "").trim(), hit = COST_CATS.find(x => x.re.test(txt));
        if (hit) c = hit.k; else if (txt) unmatched++;
      }
      items.push({ d, c, a, r:ref, t:desc });
    }
  }
  return { items, skipped, unmatched, noYear };
}

// Reads a .xlsx/.xls/.csv into sheets of raw rows (dates stay Excel numbers, amounts stay numbers). null = nothing usable (a toast says why).
async function readTableFile(file){
  let sheets;
  if (/\.xlsx?$/i.test(file.name)){
    if (!(await getXLSXLib()) || typeof XLSX === "undefined"){ showToast("โหลดตัวอ่านไฟล์ Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต) — บันทึกเป็น .csv แล้วนำเข้าใหม่ได้"); return null; }
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
    sheets = wb.SheetNames.map(n => ({ name:n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:"" }) }));
  } else {
    const buf = await file.arrayBuffer(); let text;
    try { text = new TextDecoder("utf-8", { fatal:true }).decode(buf); } catch(e){ text = new TextDecoder("windows-874").decode(buf); } // Thai Excel "CSV" is often TIS-620
    sheets = [{ name:"CSV", rows: parseCSV(text.replace(/^﻿/, "")) }];
  }
  sheets = sheets.filter(sh => sh.rows.filter(r => (r || []).some(c => String(c ?? "").trim() !== "")).length >= 2);
  if (!sheets.length){ showToast("ไม่พบข้อมูลในไฟล์ — ต้องมีหัวตารางและอย่างน้อย 1 แถวข้อมูล"); return null; }
  return sheets;
}

}

const asNorm = v => String(v ?? "").replace(/\s+/g, "");
function detectAssetHeader(rows){
  const re = /ค่าการได้มา|ได้มาสะสม|มูลค่าสุทธิ|ค่าเสื่อม|ติดตั้ง|acquisition|netbook|depreciation|install/i;
  for (let i = 0; i < Math.min(rows.length, 10); i++) if ((rows[i] || []).filter(c => re.test(asNorm(c))).length >= 2) return i;
  return Math.max(0, rows.findIndex(r => (r || []).some(c => String(c ?? "").trim() !== "")));
}
function autoAssetMap(head){
  const h = head.map(asNorm), used = new Set(), map = {};
  const take = (key, re) => { const i = h.findIndex((x, j) => !used.has(j) && re.test(x)); map[key] = i; if (i >= 0) used.add(i); };
  take("date", /ติดตั้ง|วันที่|date|install/i);
  take("cost", /ค่าการได้มา|ได้มาสะสม|การได้มา|acquisition|ราคาทุน|ต้นทุน|cost/i);
  take("nbv", /มูลค่าสุทธิ|netbook|nbv|bookvalue|คงเหลือ/i);
  take("bf", /ยกมา|broughtforward|b\/f|ปีก่อน|prior/i);
  take("yr", /ประจำปี|currentyear|annual|ปีนี้|ระหว่างปี/i);
  take("code", /รหัส|assetno|assetcode|assetid|หมายเลข|เลขที่ทรัพย์สิน/i);
  take("desc", /รายละเอียด|คำอธิบาย|ชื่อ|description|name/i);
