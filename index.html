<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asset Inspection App - ระบบตรวจสอบอุปกรณ์ไฟฟ้า</title>
    
    <!-- Google Fonts: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SheetJS CDN สำหรับ Export ไฟล์ Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #f4f6f8;
            --card-bg: #ffffff;
            --panel-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --border-soft: #cbd5e1;
            --border-focus: #94a3b8;
            
            --primary-warm: #d97706;
            --primary-light: #fef3c7;
            --primary-dark: #b45309;

            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-soft: 0 4px 15px -2px rgba(0, 0, 0, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 6px;
            font-size: 14px; /* ขยายขนาดฟอนต์บนมือถือให้อ่านง่ายขึ้น */
            line-height: 1.5;
        }

        .app-container { max-width: 100%; margin: 0 auto; padding-bottom: 50px; }

        /* จัดการหน้าจอ Mobile ให้ใช้งานง่าย ไม่ล้นจอ */
        .no-print {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-hub {
            background: var(--card-bg);
            padding: 10px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-soft);
        }

        .app-brand {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .google-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            border: 1px solid var(--border-soft);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
        }

        .action-toolbar {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* จัดเรียงปุ่มบนมือถือให้กดง่าย 3 คอลัมน์ */
            gap: 5px;
            margin-bottom: 8px;
        }

        .btn {
            padding: 10px 6px; /* ขยายพื้นที่เป้าหมายการกด (Touch Target) บนมือถือ */
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s ease;
            text-align: center;
        }
        .btn:active { transform: scale(0.96); }

        .btn-primary { background: #d97706; color: #ffffff; }
        .btn-secondary { background: #f8fafc; color: #334155; border: 1px solid var(--border-soft); }
        .btn-danger { background: #fff1f2; color: #e11d48; border: 1px solid #ffe4e6; }
        .btn-print { background: #334155; color: white; grid-column: span 3; } /* ปุ่มพิมพ์เต็มแถวบนมือถือ */
        .btn-excel { background: #059669; color: white; }
        .btn-geo { background: #059669; color: white; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; border: none; margin-left: 4px; }

        .tab-scroller {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid var(--border-soft);
            white-space: nowrap;
            color: var(--text-muted);
            font-weight: 600;
        }

        .tab-btn.active {
            background: #334155;
            color: white;
            border-color: #334155;
        }

        .extra-panel {
            background: var(--card-bg);
            padding: 10px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
            font-size: 0.8rem;
            box-shadow: var(--shadow-soft);
            margin-bottom: 8px;
        }

        .extra-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin-bottom: 6px;
            color: #334155;
        }

        .extra-grid {
            display: grid;
            grid-template-columns: 1fr; /* ปรับช่องค้นหาบนมือถือให้เรียงแถวเดี่ยว ไม่เบียด */
            gap: 6px;
        }

        .saved-records-list {
            max-height: 140px;
            overflow-y: auto;
            margin-top: 6px;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
        }

        .saved-item {
            padding: 8px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .saved-item.active-item { background: #f0fdf4; border-left: 3px solid #10b981; }

        /* ล็อกรูปแบบใบงานตามต้นฉบับ ไม่ให้เพี้ยน */
        .official-sheet {
            background: var(--card-bg);
            padding: 10px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
            font-size: 0.75rem;
            overflow-x: auto; /* ป้องกันตารางล้นจอมือถือ */
        }

        .section-header {
            background-color: #f1f5f9;
            font-weight: 700;
            padding: 4px 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border-soft);
            margin-top: 6px;
            margin-bottom: 3px;
            border-radius: 4px;
            color: #1e293b;
            border-left: 3px solid var(--primary-warm);
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
            font-size: 0.7rem;
        }

        .info-table th, .info-table td {
            border: 1px solid var(--border-soft);
            padding: 4px 6px;
            background-color: #f8fafc;
        }

        .info-table th { text-align: left; color: var(--text-muted); font-weight: 600; }
        .info-table td { background-color: #fff; }
        .info-table input { border: 1px solid var(--border-soft); background: #fff; width: 100%; padding: 4px; font-size: 0.75rem; color: var(--text-main); border-radius: 4px; }

        table.inspection-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 4px;
        }

        table.inspection-table th, table.inspection-table td {
            border: 1px solid var(--border-soft);
            padding: 4px;
            font-size: 0.7rem;
        }

        table.inspection-table th { background-color: #f1f5f9; text-align: center; font-weight: 700; color: #334155; }
        table.inspection-table td { background-color: #fff; }
        
        input[type="radio"], input[type="checkbox"] { transform: scale(1.2); accent-color: var(--primary-warm); cursor: pointer; }
        .form-control { padding: 5px; border: 1px solid var(--border-soft); border-radius: 4px; font-size: 0.75rem; background-color: #ffffff; width: 100%; }
        textarea.form-control { height: 28px; }

        .sheet-footer-note {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            border-top: 1px solid var(--border-soft);
            padding-top: 4px;
        }

        @media print {
            @page { size: A4 portrait; margin: 4mm; }
            body { background: white !important; padding: 0; font-size: 8.5px; }
            .no-print { display: none !important; }
            .official-sheet { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; overflow: visible !important; }
            .info-table th, .info-table td { padding: 1px 3px; font-size: 8px; border: 1px solid #000 !important; }
            table.inspection-table th, table.inspection-table td { padding: 1px 3px; font-size: 8px; border: 1px solid #000 !important; }
            input[type="radio"], input[type="checkbox"] { transform: scale(0.85); }
            .form-control { padding: 1px 3px; font-size: 8px; height: 18px; border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="no-print">
        <div class="control-hub">
            <div class="top-bar">
                <div class="app-brand">
                    <div class="brand-icon">⚡</div>
                    <span>ระบบตรวจสอบอุปกรณ์ไฟฟ้า</span>
                </div>
                <div class="google-pill" onclick="handleGoogleLogin()">
                    <span id="authStatus">👤 บัญชีหน้างาน</span>
                </div>
            </div>

            <div class="action-toolbar">
                <button class="btn btn-primary" onclick="saveNewRecord()">💾 บันทึกใหม่</button>
                <button class="btn btn-secondary" onclick="saveCurrentRecord()">🔄 บันทึกทับ</button>
                <button class="btn btn-secondary" onclick="copyAsNewRecord()">📄 คัดลอก</button>
                <button class="btn btn-secondary" onclick="newForm()">➕ ฟอร์มใหม่</button>
                <button class="btn btn-danger" onclick="clearForm()">🗑️ ล้าง</button>
                <button class="btn btn-excel" onclick="exportPlanToExcel()">📗 Excel</button>
                <!-- ปุ่มพิมพ์/PDF ใช้งานได้ดีทั้งบนมือถือและคอมพิวเตอร์ -->
                <button class="btn btn-print" onclick="window.print()">🖨️ พิมพ์/PDF (A4 หน้าเดียว)</button>
            </div>

            <div class="tab-scroller" id="tabContainer">
                <button class="tab-btn active" onclick="switchTab(this, 'SF-07-0-015')">SF-07-0-015</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-016')">SF-07-0-016</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-017')">SF-07-0-017</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-018')">SF-07-0-018</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-019')">SF-07-0-019</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-020')">SF-07-0-020</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-021')">SF-07-0-021</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-022')">SF-07-0-022</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-023')">SF-07-0-023</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-024')">SF-07-0-024</button>
                <button class="tab-btn" onclick="switchTab(this, 'SF-07-0-025')">SF-07-0-025</button>
            </div>
        </div>

        <div class="extra-panel">
            <div class="extra-panel-header">
                <span id="savedCountText">📁 ข้อมูลที่บันทึกไว้ในเครื่อง (0 รายการ)</span>
                <button class="btn btn-secondary" style="font-size:0.68rem; padding:2px 6px;" onclick="renderSavedRecordsList()">🔄 รีเฟรช</button>
            </div>
            <div class="extra-grid">
                <input type="text" id="filterPlant" class="form-control" placeholder="ค้นหา Station / สถานที่..." oninput="filterSavedRecords()">
            </div>
            <div class="saved-records-list" id="savedRecordsContainer"></div>
        </div>

        <div class="extra-panel">
            <div class="extra-panel-header">
                <span>📷 รูปภาพประกอบการตรวจสอบ</span>
                <span id="photoSizeLabel" style="font-size:0.7rem; color:var(--text-muted);">0 KB</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                <span id="photoStatusText" style="font-size:0.75rem; color:var(--text-muted);">ยังไม่มีรูปภาพประกอบ</span>
                <input type="file" id="actualFileInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
                <button class="btn btn-primary" style="font-size:0.72rem; padding:4px 10px;" onclick="triggerUpload()">+ เพิ่มรูปภาพ</button>
            </div>
            <div id="imagePreviewBox" style="display:none; margin-top:6px; text-align:center;">
                <img id="previewImg" src="" style="max-height:100px; border-radius:4px; border:1px solid var(--border-soft);">
                <button class="btn btn-danger" style="font-size:0.6rem; padding:2px 6px; margin:3px auto 0;" onclick="removeImage()">ลบรูป</button>
            </div>
        </div>
    </div>

    <!-- ส่วนแสดงใบตรวจสอบ (รูปแบบถูกล็อกไว้สมบูรณ์ตามต้นฉบับ) -->
    <div id="formContentArea">
        <div class="official-sheet" id="printArea"></div>
    </div>

</div>

<script>
    let savedRecords = JSON.parse(localStorage.getItem('mea_inspection_records')) || [];
    let currentRecordIndex = -1;
    let currentActiveForm = 'SF-07-0-015';

    function saveToLocalStorage() {
        localStorage.setItem('mea_inspection_records', JSON.stringify(savedRecords));
    }

    function collectCurrentFormData() {
        const data = {};
        document.querySelectorAll('#formContentArea input[type="text"], #formContentArea textarea, #formContentArea input[type="date"], #formContentArea input[type="time"]').forEach((el, idx) => {
            data[`field_${idx}`] = el.value;
        });
        document.querySelectorAll('#formContentArea input[type="radio"], #formContentArea input[type="checkbox"]').forEach((el, idx) => {
            data[`check_${idx}`] = el.checked;
        });
        return data;
    }

    function fillFormData(formData) {
        if(!formData) return;
        document.querySelectorAll('#formContentArea input[type="text"], #formContentArea textarea, #formContentArea input[type="date"], #formContentArea input[type="time"]').forEach((el, idx) => {
            if(formData[`field_${idx}`] !== undefined) el.value = formData[`field_${idx}`];
        });
        document.querySelectorAll('#formContentArea input[type="radio"], #formContentArea input[type="checkbox"]').forEach((el, idx) => {
            if(formData[`check_${idx}`] !== undefined) el.checked = formData[`check_${idx}`];
        });
    }

    function saveNewRecord() {
        const stationInput = document.querySelector('.info-table input[placeholder*="Station"]') || 
                             document.querySelector('.info-table input[placeholder*="สถานี"]');
        const locationInput = document.querySelector('.info-table input[placeholder*="สถานที่"]');
        
        const stationId = (stationInput && stationInput.value) ? stationInput.value : `ST-${Math.floor(Math.random()*80 + 10)}`;
        const location = (locationInput && locationInput.value) ? locationInput.value : "พื้นที่หน้างาน MEA";

        const newRec = {
            id: `REC-${Date.now().toString().slice(-4)}`,
            date: new Date().toISOString().split('T')[0],
            formCode: currentActiveForm,
            stationId: stationId,
            location: location,
            formData: collectCurrentFormData()
        };

        savedRecords.unshift(newRec);
        currentRecordIndex = 0;
        saveToLocalStorage();
        renderSavedRecordsList();
        alert(`💾 บันทึกข้อมูลลงเครื่องสำเร็จ (${newRec.id})`);
    }

    function saveCurrentRecord() {
        if(currentRecordIndex >= 0 && currentRecordIndex < savedRecords.length) {
            savedRecords[currentRecordIndex].formData = collectCurrentFormData();
            saveToLocalStorage();
            renderSavedRecordsList();
            alert(`🔄 บันทึกทับข้อมูลเรียบร้อยแล้ว!`);
        } else {
            saveNewRecord();
        }
    }

    function copyAsNewRecord() {
        if(currentRecordIndex >= 0 && currentRecordIndex < savedRecords.length) {
            const original = savedRecords[currentRecordIndex];
            const copied = JSON.parse(JSON.stringify(original));
            copied.id = `REC-${Date.now().toString().slice(-4)}`;
            copied.date = new Date().toISOString().split('T')[0];
            savedRecords.unshift(copied);
            currentRecordIndex = 0;
            saveToLocalStorage();
            renderSavedRecordsList();
            alert(`📄 คัดลอกข้อมูลเป็นฉบับใหม่สำเร็จ!`);
        } else {
            saveNewRecord();
        }
    }

    function newForm() {
        if(confirm("ต้องการล้างฟอร์มเพื่อกรอกใบงานใหม่ใช่หรือไม่?")) {
            currentRecordIndex = -1;
            clearForm();
        }
    }

    function clearForm() {
        document.querySelectorAll('#formContentArea input[type="text"], #formContentArea textarea, #formContentArea input[type="time"]').forEach(el => el.value = '');
        document.querySelectorAll('#formContentArea input[type="radio"], #formContentArea input[type="checkbox"]').forEach(el => el.checked = false);
        setTodayDate();
        removeImage();
        renderSavedRecordsList();
    }

    function renderSavedRecordsList(filteredList = null) {
        const container = document.getElementById('savedRecordsContainer');
        const list = filteredList || savedRecords;
        container.innerHTML = '';

        document.getElementById('savedCountText').innerText = `📁 ข้อมูลที่บันทึกไว้ในเครื่อง (${savedRecords.length} รายการ)`;

        if (list.length === 0) {
            container.innerHTML = `<div style="padding:8px; text-align:center; color:var(--text-muted);">ยังไม่มีข้อมูลในเครื่อง</div>`;
            return;
        }

        list.forEach((item) => {
            const originalIndex = savedRecords.indexOf(item);
            const isSelected = originalIndex === currentRecordIndex;

            const div = document.createElement('div');
            div.className = `saved-item ${isSelected ? 'active-item' : ''}`;
            div.innerHTML = `
                <div>
                    <span style="font-weight:700; color:#1e293b;">${item.id}</span>
                    <span style="color:#0284c7; font-weight:600; margin:0 4px;">[${item.formCode}]</span>
                    <span style="color:var(--text-muted); font-size:0.7rem;">${item.stationId}</span>
                </div>
                <div style="display:flex; gap:4px;">
                    <button type="button" class="btn btn-secondary" style="font-size:0.65rem; padding:2px 6px;" onclick="selectRecordToView(${originalIndex}, event)">เปิดดู</button>
                    <button type="button" class="btn btn-danger" style="font-size:0.65rem; padding:2px 5px;" onclick="deleteRecord(${originalIndex}, event)">ลบ</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function selectRecordToView(idx, event) {
        if (event) { event.preventDefault(); event.stopPropagation(); }
        currentRecordIndex = idx;
        const record = savedRecords[idx];
        if (!record) return;

        const tabBtns = document.querySelectorAll('.tab-btn');
        let targetBtn = null;
        tabBtns.forEach(btn => { if (btn.innerText.includes(record.formCode)) targetBtn = btn; });

        if (targetBtn) {
            switchTab(targetBtn, record.formCode);
        }

        setTimeout(() => {
            fillFormData(record.formData);
            renderSavedRecordsList();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }, 100);
    }

    function deleteRecord(idx, event) {
        if(event) event.stopPropagation();
        if(confirm(`ยืนยันการลบรายการนี้?`)) {
            savedRecords.splice(idx, 1);
            if(currentRecordIndex === idx) currentRecordIndex = -1;
            saveToLocalStorage();
            renderSavedRecordsList();
        }
    }

    function filterSavedRecords() {
        const val = document.getElementById('filterPlant').value.toLowerCase();
        const filtered = savedRecords.filter(item => item.stationId.toLowerCase().includes(val) || item.location.toLowerCase().includes(val) || item.formCode.toLowerCase().includes(val));
        renderSavedRecordsList(filtered);
    }

    function triggerUpload() { document.getElementById('actualFileInput').click(); }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        const kbSize = (file.size / 1024).toFixed(1);
        document.getElementById('photoSizeLabel').innerText = `${kbSize} KB`;
        document.getElementById('photoStatusText').innerText = `แนบไฟล์: ${file.name}`;
        const reader = new FileReader();
        reader.onload = function(evt) {
            document.getElementById('previewImg').src = evt.target.result;
            document.getElementById('imagePreviewBox').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function removeImage() {
        document.getElementById('actualFileInput').value = '';
        document.getElementById('photoSizeLabel').innerText = '0 KB';
        document.getElementById('photoStatusText').innerText = 'ยังไม่มีรูปภาพประกอบ';
        document.getElementById('imagePreviewBox').style.display = 'none';
        document.getElementById('previewImg').src = '';
    }

    function exportPlanToExcel() {
        if(savedRecords.length === 0) { alert("ยังไม่มีข้อมูลสำหรับส่งออก Excel"); return; }
        const ws = XLSX.utils.json_to_sheet(savedRecords);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Inspection_Data");
        XLSX.writeFile(wb, `MEA_Inspection_Data_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function getCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latEl = document.getElementById('latInput');
                    const longEl = document.getElementById('longInput');
                    if(latEl) latEl.value = pos.coords.latitude.toFixed(6);

    function switchSubTab(pageNum) {
        document.querySelectorAll('.sub-tab-btn').forEach((tab, index) => {
            if(index + 1 === pageNum) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
        document.getElementById('subFormContent').innerHTML = unitSubstationPages[pageNum];
        const today = new Date().toISOString().split('T')[0];
        if(document.getElementById('dateField1')) document.getElementById('dateField1').value = today;
        if(document.getElementById('dateField2')) document.getElementById('dateField2').value = today;
        if(document.getElementById('dateField3')) document.getElementById('dateField3').value = today;
        if(document.getElementById('dateField4')) document.getElementById('dateField4').value = today;
    }

    function switchTab(element, formCode) {
        currentActiveForm = formCode;
        document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
        element.classList.add('active');

        if(formCode === 'SF-07-0-019') {
            document.getElementById('formContentArea').innerHTML = `
                <div class="official-sheet" id="printArea">
                    <div id="subFormContent">
                        ${unitSubstationPages[1]}
                    </div>
                </div>
            `;
            setTodayDate();
            return;
        }

        if(formTemplates[formCode]) {
            document.getElementById('formContentArea').innerHTML = `
                <div class="official-sheet" id="printArea">
                    ${formTemplates[formCode]}
                </div>
            `;
            setTodayDate();
        }
    }

    function setTodayDate() {
        const today = new Date().toISOString().split('T')[0];
        document.querySelectorAll('input[type="date"]').forEach(el => {
            if(!el.value) el.value = today;
        });
    }

    function handleGoogleLogin() {
        document.getElementById('authStatus').innerText = "👤 คุณศิรภัสสร (Admin PM)";
        alert("เข้าสู่ระบบสำเร็จ! สิทธิ์การใช้งาน: Maintenance Engineer / Supervisor");
    }

    document.addEventListener("DOMContentLoaded", () => {
        switchTab(document.querySelector('.tab-btn'), 'SF-07-0-015');
        renderSavedRecordsList();
    });
</script>
