}
const asUnquote = v => typeof v === "string" ? v.replace(/^[\s'"‘’“”]+|[\s'"‘’“”]+$/g, "") : v; // the register stores dates as text like '2025-04-17'
// rows + mapping → {d:"yyyy-mm-dd", c:cost, n:net book value, b:depreciation b/f, y:depreciation this year, k:code, t:text}; depreciation kept as positive amounts
function parseAssetRows(rows, o){
  const items = [], skipped = []; let mismatch = 0, withVal = 0;
  const cell = (r, i) => (i >= 0 && i < r.length ? r[i] : "");
  const num = v => { const a = parseCostAmount(v); return isNaN(a) ? null : a; };
  for (let li = o.head + 1; li < rows.length; li++){
    const r = rows[li]; if (!r || !r.some(c => String(c ?? "").trim() !== "")) continue;
    const dt = parseCostDate(asUnquote(cell(r, o.map.date)), NOW_BE);
    if (!dt){ skipped.push({ line: li + 1, why:"อ่านวันที่ไม่ได้", val: String(cell(r, o.map.date) ?? "") }); continue; }
    let c = num(cell(r, o.map.cost)), n = num(cell(r, o.map.nbv)), b = num(cell(r, o.map.bf)), y = num(cell(r, o.map.yr));
    b = b == null ? 0 : Math.abs(b); y = y == null ? 0 : Math.abs(y);
    if (c == null && n != null) c = n + b + y;
    if (n == null && c != null) n = c - b - y;
    else if (c != null && n != null && Math.abs(c - b - y - n) > 1) mismatch++;
    if (c != null) withVal++;
    items.push({ d: `${dt.y}-${String(dt.m + 1).padStart(2, "0")}-${String(dt.d).padStart(2, "0")}`, c, n, b, y,
      k: String(cell(r, o.map.code) ?? "").trim(), t: String(cell(r, o.map.desc) ?? "").trim() });
  }
  return { items, skipped, mismatch, withVal };
}
function assetAgg(){
  if (!ASSET_REG) return null;
  if (ASSET_AGG_CACHE) return ASSET_AGG_CACHE;
  const z = () => ({ n:0, withVal:0, cost:0, nbv:0, bf:0, yr:0 }), months = {}, T = z();
  ASSET_REG.rows.forEach(r => {
    const M = months[r.d.slice(0, 7)] || (months[r.d.slice(0, 7)] = z());
    M.n++; T.n++;
    if (r.c != null){ [M, T].forEach(X => { X.withVal++; X.cost += r.c; X.nbv += r.n; X.bf += r.b; X.yr += r.y; }); }
  });
  return (ASSET_AGG_CACHE = { months, T, keys: Object.keys(months).sort() });
}

}

  if (AI.map.date < 0 || (AI.map.cost < 0 && AI.map.nbv < 0)){
    if (go) go.disabled = true; AI.res = null;
    el.innerHTML = `<div class="ci-warn bad">ต้องเลือกคอลัมน์ <b>วันที่ติดตั้ง</b> และ <b>ค่าการได้มาสะสม</b> (หรือมูลค่าสุทธิ) อย่างน้อย</div>`; return;
  }
  const res = AI.res = parseAssetRows(AI.rows, AI);
  if (go) go.disabled = !res.items.length;
  const skipHtml = res.skipped.length ? `<div class="ci-warn">ข้ามไป ${res.skipped.length} แถว (เช่น แถวรวมยอด หรือแถวที่ไม่มีวันที่): ${res.skipped.slice(0, 4).map(k => `แถวที่ ${k.line} ${k.why}${k.val ? ` “${costEsc(k.val.slice(0, 24))}”` : ""}`).join(" · ")}${res.skipped.length > 4 ? " …" : ""}</div>` : "";
  if (!res.items.length){ el.innerHTML = `<div class="ci-warn bad">ยังอ่านรายการไม่ได้ — ลองเปลี่ยนแถวหัวตารางหรือการจับคู่คอลัมน์ด้านบน</div>${skipHtml}`; return; }
  const T = { c:0, n:0, b:0, y:0 };
  res.items.forEach(r => { if (r.c != null){ T.c += r.c; T.n += r.n; T.b += r.b; T.y += r.y; } });
  const ds = res.items.map(r => r.d).sort(), both = AI.map.cost >= 0 && AI.map.nbv >= 0;
  const eq = both ? (res.mismatch ? `<div class="ci-warn">ตรวจสมการ <b>ค่าการได้มา − ค่าเสื่อมสะสม = มูลค่าสุทธิ</b>: ไม่ลงตัว ${res.mismatch.toLocaleString()} จาก ${res.withVal.toLocaleString()} แถว — ตรวจว่าเลือกคอลัมน์ถูกต้อง</div>` : `<div class="ci-warn" style="color:var(--green-ink);">ตรวจสมการ <b>ค่าการได้มา − ค่าเสื่อมสะสม = มูลค่าสุทธิ</b>: ลงตัวทุกแถว (${res.withVal.toLocaleString()} แถว) ✓</div>`) : "";
  el.innerHTML = `
    <div style="font-size:13px; font-weight:700;">พบ ${res.items.length.toLocaleString()} รายการ (มีมูลค่า ${res.withVal.toLocaleString()} · ยังไม่มีมูลค่า ${(res.items.length - res.withVal).toLocaleString()}) · ติดตั้ง ${costThaiDate(ds[0])} – ${costThaiDate(ds[ds.length - 1])}</div>
    <div class="ci-chips"><span class="ci-chip">ค่าการได้มา ${fmtBaht(T.c)}</span><span class="ci-chip">มูลค่าสุทธิ ${fmtBaht(T.n)}</span><span class="ci-chip">ค่าเสื่อมสะสม ${fmtBaht(T.b + T.y)}</span><span class="ci-chip">ค่าเสื่อมประจำปี ${fmtBaht(T.y)}</span></div>
    ${eq}${skipHtml}
    <div class="ci-scroll"><table><thead><tr><th>วันที่ติดตั้ง</th><th>รหัส</th><th style="text-align:right;">ค่าการได้มา</th><th style="text-align:right;">ค่าเสื่อมสะสม</th><th style="text-align:right;">มูลค่าสุทธิ</th></tr></thead><tbody>${res.items.filter(r => r.c != null).slice(0, 6).map(r => `<tr><td>${costThaiDate(r.d)}</td><td>${costEsc(r.k) || "-"}</td><td class="num" style="text-align:right;">${fmtBaht(r.c)}</td><td class="num" style="text-align:right;">${fmtBaht(r.b + r.y)}</td><td class="num" style="text-align:right;">${fmtBaht(r.n)}</td></tr>`).join("")}</tbody></table></div>`;
}
window.aiConfirm = function(){
  const res = AI && AI.res; if (!res || !res.items.length) return;
  if (res.items.length > ASSET_REG_MAX){ showToast(`ข้อมูลมากเกินไป (สูงสุด ${ASSET_REG_MAX.toLocaleString()} รายการ)`); return; }
  const next = { file:AI.file, at:Date.now(), rows:res.items };
  try { localStorage.setItem(ASSET_REG_KEY, JSON.stringify(next)); } catch(e){ showToast("พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม — นำเข้าไม่ได้"); return; }
  ASSET_REG = next; ASSET_AGG_CACHE = null;
  closeModal(); renderCostView();
  const box = document.getElementById("assetRegBox"); if (box) box.scrollIntoView({ behavior:"smooth", block:"start" });
  showToast(`นำเข้าทะเบียนทรัพย์สิน ${res.items.length.toLocaleString()} รายการแล้ว`);
};

    [900000, 855000, -30000, -15000, "2026-03-12", "TR-0063", "หม้อแปลงจำหน่าย 800 kVA"],
    [480000, 441600, -26400, -12000, "2026-04-02", "LBS-0203", "Load Break Switch"],

function renderCostDonut(parts, contractor, labor, other){
  const total = parts + contractor + labor + other;
  const pct = v => total ? Math.round(v / total * 100) + "%" : "–";
  svgDonut("chartCostDonut", total ? [parts, contractor, labor, other] : [0, 0, 0, 1], [COST_C.parts, COST_C.contractor, COST_C.labor, total ? COST_C.other : "var(--gray-soft)"]);
  setText("costDonutTotal", fmtBaht(total));
  setText("costLegendParts", pct(parts));
  setText("costLegendContractor", pct(contractor));
  setText("costLegendLabor", pct(labor));
  setText("costLegendOther", pct(other));
}
function renderCostView(){
  try { renderWoCostCard(); } catch(e){ console.error(e); }
  fillCostYearSelect();
  const imp = costAgg();
  let data, done;
  if (imp){
    const Y = imp[costYear - 543] || { parts:Array(12).fill(0), contractor:Array(12).fill(0), labor:Array(12).fill(0), other:Array(12).fill(0) };
    const k = a => a.map(v => v / 1000); // the chart and sums below work in thousand baht
    data = { parts:k(Y.parts), contractor:k(Y.contractor), labor:k(Y.labor), other:k(Y.other) };
    done = 0; for (let i = 0; i < 12; i++) if (Y.parts[i] + Y.contractor[i] + Y.labor[i] + Y.other[i] > 0) done = i + 1;
  } else { data = costDataForYear(costYear); done = costDoneNoImport(costYear); }
  renderCostSource();
  const sum = arr => arr.reduce((a, b) => a + b, 0);
  setText("costYearSub", String(costYear));
  setText("costMonthLabel", `${COST_MONTH_LABELS[costMonthIdx]} ${costYear}`);
  const series = idx => [
    { name:"อะไหล่", color:COST_C.parts, data:idx.map(i => data.parts[i]) },
    { name:"ผู้รับเหมา", color:COST_C.contractor, data:idx.map(i => data.contractor[i]) },
    { name:"ค่าแรง", color:COST_C.labor, data:idx.map(i => data.labor[i]) },
    { name:"อื่นๆ", color:COST_C.other, data:idx.map(i => data.other[i]) },
  ];
  let budget, p, c, l, o, spentLabel;
  if (costMode === "yearly"){
    const upTo = done > 0 && done < 12 ? ` (ม.ค.–${COST_MONTH_LABELS[done - 1]})` : "";
    setText("costPanelTitle", "ค่าใช้จ่ายรายเดือน");
    budget = costBudgetFor(costYear);
    [p, c, l, o] = [sum(data.parts), sum(data.contractor), sum(data.labor), sum(data.other)].map(v => v * 1000);
    spentLabel = "ใช้ไปแล้ว" + upTo;
    setText("costBudgetLbl", "งบประมาณทั้งปี");
    svgStackedBar("chartCostBar", COST_MONTH_LABELS, series(COST_MONTH_LABELS.map((_, i) => i)));
  } else {
    const label = `${COST_MONTH_LABELS[costMonthIdx]} ${costYear}`;
    setText("costPanelTitle", `ค่าใช้จ่ายเดือน ${label}`);
    budget = costBudgetFor(costYear) / 12;
    [p, c, l, o] = [data.parts, data.contractor, data.labor, data.other].map(a => a[costMonthIdx] * 1000);
    spentLabel = `ใช้ไปแล้ว (${label})`;
    setText("costBudgetLbl", "งบประมาณต่อเดือน");
    svgStackedBar("chartCostBar", [label], series([costMonthIdx]));
  }
  const spent = p + c + l + o, pct = budget ? spent / budget * 100 : 0;
  setText("costKpiBudget", fmtBaht(budget));
  setText("costKpiSpent", fmtBaht(spent));
  setText("costKpiContractor", fmtBaht(c));
  setText("costKpiOther", fmtBaht(o));
  setText("costSpentLbl", spentLabel);
  renderCostDonut(p, c, l, o);
  // Colour "ใช้ไปแล้ว" against the budget: green ≤ 90%, amber 90–100%, red over budget.
  const pe = document.getElementById("costKpiPct"), se = document.getElementById("costKpiSpent");
  if (pe){ pe.textContent = budget ? `${pct.toFixed(0)}% ของงบ` : ""; pe.style.color = pct > 100 ? "var(--red-ink)" : pct > 90 ? "var(--amber-ink)" : "var(--green-ink)"; }
  if (se) se.style.color = pct > 100 ? "var(--red-ink)" : "";
  renderCostImportTable();
  try { renderAssetReg(); } catch(e){ console.error(e); }
}
function initCostCharts(){

}

/* ===================== v52: live "today" on the PM calendar page (day / month / year, ticks every second, rolls over at midnight) ===================== */
(function(){
  const DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  let lastKey = null;
  function tickToday(){
    const d = new Date(), key = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    document.querySelectorAll("#pmTodayChip").forEach(chip => {
      const day = chip.querySelector(".td-day"), tm = chip.querySelector(".td-time");
      if (day) day.textContent = `${DAYS[d.getDay()]} ${d.getDate()} ${RP_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
      if (tm) tm.textContent = d.toLocaleTimeString("th-TH", { hour12:false });
    });
    if (lastKey && key !== lastKey){ try { renderCalendarView(); } catch(e){} } // a new day began while the page was open: move the highlighted cell and the "this month" button
    lastKey = key;
  }
  tickToday();
  setInterval(tickToday, 1000);
})();
